<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HOMEKALL</title>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: #080b12;
  color: white;
  font-family: Arial, sans-serif;
  min-height: 100vh;
}

.app {
  width: 100%;
  max-width: 600px;
  margin: auto;
  padding: 20px;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 25px;
}

.logo {
  font-size: 25px;
  font-weight: bold;
}

.status {
  font-size: 13px;
  color: #22c55e;
}

#welcome {
  padding-top: 60px;
}

#welcome h1 {
  font-size: 40px;
  margin: 10px 0;
}

#welcome p {
  color: #8b93a7;
  line-height: 1.6;
}

.start {
  width: 100%;
  margin-top: 30px;
  padding: 17px;
  border: 0;
  border-radius: 15px;
  background: #2563eb;
  color: white;
  font-size: 17px;
  font-weight: bold;
}

#callArea {
  display: none;
}

.videoBox {
  position: relative;
  width: 100%;
}

#remoteVideo {
  width: 100%;
  min-height: 300px;
  background: black;
  border-radius: 18px;
  object-fit: cover;
}

#localVideo {
  position: absolute;
  right: 12px;
  bottom: 12px;
  width: 120px;
  height: 165px;
  background: #111;
  border: 2px solid white;
  border-radius: 12px;
  object-fit: cover;
}

.controls {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-top: 15px;
}

.controls button {
  border: 0;
  border-radius: 13px;
  padding: 14px 5px;
  background: #182131;
  color: white;
  font-size: 14px;
  font-weight: bold;
}

.controls button:active {
  transform: scale(.95);
}

.controls .danger {
  background: #dc2626;
}

.chat {
  margin-top: 18px;
  background: #111722;
  border-radius: 15px;
  padding: 12px;
}

#messages {
  height: 140px;
  overflow-y: auto;
  margin-bottom: 10px;
}

.message {
  padding: 8px 10px;
  margin: 5px 0;
  border-radius: 10px;
  background: #202938;
  font-size: 14px;
  word-wrap: break-word;
}

.message.me {
  background: #2563eb;
  text-align: right;
}

.chatInput {
  display: flex;
  gap: 8px;
}

.chatInput input {
  flex: 1;
  padding: 12px;
  border: 0;
  border-radius: 10px;
  outline: none;
}

.chatInput button {
  padding: 12px 15px;
  border: 0;
  border-radius: 10px;
  background: #2563eb;
  color: white;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="app">

<header>
  <div class="logo">🏠 HOMEKALL</div>
  <div class="status" id="status">🟡 Menghubungkan...</div>
</header>

<div id="welcome">

  <h1>Hubungi<br>saya sekarang.</h1>

  <p>
    Tekan tombol di bawah untuk memulai
    panggilan video.
  </p>

  <button class="start" onclick="startCall()">
    📞 Mulai Video Call
  </button>

</div>

<div id="callArea">

  <div class="videoBox">

    <video id="remoteVideo"
           autoplay
           playsinline></video>

    <video id="localVideo"
           autoplay
           muted
           playsinline></video>

  </div>

  <div class="controls">

    <button onclick="switchCamera()" id="cameraBtn">
      🔄 Kamera
    </button>

    <button onclick="toggleMirror()" id="mirrorBtn">
      ↔️ Balik Layar
    </button>

    <button onclick="toggleMic()" id="micBtn">
      🎙️ Mic
    </button>

    <button onclick="toggleCamera()" id="videoBtn">
      📹 Kamera ON
    </button>

    <button onclick="sendMessage()">
      💬 Kirim
    </button>

    <button onclick="endCall()" class="danger">
      🔴 Akhiri
    </button>

  </div>

  <div class="chat">

    <div id="messages"></div>

    <div class="chatInput">

      <input
        id="messageInput"
        type="text"
        placeholder="Ketik pesan..."
        onkeydown="if(event.key==='Enter') sendMessage()"
      >

      <button onclick="sendMessage()">Kirim</button>

    </div>

  </div>

</div>

</div>

<script>

const OWNER_ID = "homecall-owner-2026";

let peer = null;
let currentCall = null;
let dataConnection = null;

let localStream = null;
let currentVideoTrack = null;

let usingFrontCamera = true;
let mirrored = false;
let micEnabled = true;
let cameraEnabled = true;


/* =========================
   PEER
========================= */

peer = new Peer({
  debug: 2,

  config: {
    iceServers: [
      {
        urls: "stun:stun.l.google.com:19302"
      }
    ]
  }
});


peer.on("open", function(id) {

  document.getElementById("status").textContent =
    "🟢 Online";

});


peer.on("error", function(error) {

  console.log("PeerJS error:", error);

  document.getElementById("status").textContent =
    "🔴 Error";

  alert("Koneksi gagal: " + error.type);

});


/* =========================
   MULAI PANGGILAN
========================= */

async function startCall() {

  try {

    localStream =
      await navigator.mediaDevices.getUserMedia({

        video: true,
        audio: true

      });

    currentVideoTrack =
      localStream.getVideoTracks()[0];

    document.getElementById("localVideo").srcObject =
      localStream;

    currentCall =
      peer.call(
        OWNER_ID,
        localStream
      );

    if (!currentCall) {

      alert("Gagal membuat panggilan.");

      return;
    }

    document.getElementById("welcome").style.display =
      "none";

    document.getElementById("callArea").style.display =
      "block";

    document.getElementById("status").textContent =
      "📞 Memanggil...";


    /* VIDEO OWNER */

    currentCall.on("stream", function(remoteStream) {

      document.getElementById("remoteVideo").srcObject =
        remoteStream;

      document.getElementById("status").textContent =
        "🟢 Terhubung";

    });


    /* PANGGILAN DITUTUP */

    currentCall.on("close", function() {

      endCall(false);

    });


    currentCall.on("error", function(error) {

      console.log(error);

      alert("Panggilan gagal.");

      endCall(false);

    });


    /* DATA CHAT */

    dataConnection =
      peer.connect(OWNER_ID);

    dataConnection.on("open", function() {

      console.log("Chat connected");

    });

    dataConnection.on("data", function(data) {

      receiveMessage(data);

    });

  }

  catch(error) {

    alert(
      "Kamera atau mikrofon tidak bisa digunakan.\n\n" +
      error.message
    );

  }

}


/* =========================
   GANTI KAMERA
========================= */

async function switchCamera() {

  if (!currentCall) {

    alert("Panggilan belum dimulai.");

    return;
  }

  try {

    usingFrontCamera =
      !usingFrontCamera;

    const facing =
      usingFrontCamera
      ? "user"
      : "environment";


    const newStream =
      await navigator.mediaDevices.getUserMedia({

        video: {
          facingMode: {
            ideal: facing
          }
        },

        audio: false

      });


    const newTrack =
      newStream.getVideoTracks()[0];


    const sender =
      currentCall.peerConnection
      .getSenders()
      .find(function(s) {

        return s.track &&
               s.track.kind === "video";

      });


    if (sender) {

      await sender.replaceTrack(newTrack);

    }


    if (currentVideoTrack) {

      currentVideoTrack.stop();

    }


    currentVideoTrack =
      newTrack;


    localStream.removeTrack(
      localStream.getVideoTracks()[0]
    );

    localStream.addTrack(newTrack);


    document.getElementById("localVideo").srcObject =
      localStream;


    document.getElementById("status").textContent =
      usingFrontCamera
      ? "📱 Kamera depan"
      : "📷 Kamera belakang";

  }

  catch(error) {

    console.log(error);

    usingFrontCamera =
      !usingFrontCamera;

    alert(
      "Kamera tidak bisa diganti.\n\n" +
      error.message
    );

  }

}


/* =========================
   BALIK LAYAR
========================= */

function toggleMirror() {

  mirrored =
    !mirrored;

  document.getElementById("localVideo").style.transform =
    mirrored
    ? "scaleX(-1)"
    : "scaleX(1)";

}


/* =========================
   MUTE MICROPHONE
========================= */

function toggleMic() {

  if (!localStream) return;

  const audioTracks =
    localStream.getAudioTracks();

  if (audioTracks.length === 0) {

    alert("Mikrofon tidak ditemukan.");

    return;
  }


  micEnabled =
    !micEnabled;


  audioTracks.forEach(function(track) {

    track.enabled =
      micEnabled;

  });


  document.getElementById("micBtn").textContent =
    micEnabled
    ? "🎙️ Mic ON"
    : "🔇 Mic OFF";

}


/* =========================
   MATIKAN KAMERA
========================= */

function toggleCamera() {

  if (!localStream) return;

  const videoTracks =
    localStream.getVideoTracks();


  if (videoTracks.length === 0) {

    alert("Kamera tidak ditemukan.");

    return;
  }


  cameraEnabled =
    !cameraEnabled;


  videoTracks.forEach(function(track) {

    track.enabled =
      cameraEnabled;

  });


  document.getElementById("videoBtn").textContent =
    cameraEnabled
    ? "📹 Kamera ON"
    : "🚫 Kamera OFF";

}


/* =========================
   CHAT
========================= */

function sendMessage() {

  const input =
    document.getElementById("messageInput");

  const text =
    input.value.trim();


  if (!text) return;


  if (
    dataConnection &&
    dataConnection.open
  ) {

    dataConnection.send({
      type: "message",
      text: text
    });

    addMessage(
      "Saya",
      text,
      true
    );

    input.value = "";

  }

  else {

    alert("Chat belum terhubung.");

  }

}


function receiveMessage(data) {

  if (
    data &&
    data.type === "message"
  ) {

    addMessage(
      "Owner",
      data.text,
      false
    );

  }

}


function addMessage(name, text, me) {

  const box =
    document.getElementById("messages");

  const div =
    document.createElement("div");

  div.className =
    "message" +
    (me ? " me" : "");


  div.textContent =
    name + ": " + text;


  box.appendChild(div);

  box.scrollTop =
    box.scrollHeight;

}


/* =========================
   AKHIRI PANGGILAN
========================= */

function endCall(closePeerCall = true) {

  if (
    closePeerCall &&
    currentCall
  ) {

    try {

      currentCall.close();

    } catch(e) {}

  }


  if (dataConnection) {

    try {

      dataConnection.close();

    } catch(e) {}

    dataConnection = null;

  }


  if (localStream) {

    localStream
      .getTracks()
      .forEach(function(track) {

        track.stop();

      });

    localStream = null;

  }


  currentVideoTrack = null;
  currentCall = null;


  document.getElementById("localVideo").srcObject =
    null;

  document.getElementById("remoteVideo").srcObject =
    null;


  document.getElementById("callArea").style.display =
    "none";

  document.getElementById("welcome").style.display =
    "block";


  document.getElementById("status").textContent =
    "🟢 Online";


  micEnabled = true;
  cameraEnabled = true;
  mirrored = false;
  usingFrontCamera = true;


  document.getElementById("localVideo").style.transform =
    "scaleX(1)";


  document.getElementById("micBtn").textContent =
    "🎙️ Mic";

  document.getElementById("videoBtn").textContent =
    "📹 Kamera ON";


  document.getElementById("messages").innerHTML =
    "";

}

</script>

</body>
</html>
