<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home Call - Owner</title>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial, sans-serif;
  background:#080b12;
  color:white;
  min-height:100vh;
}

.app{
  width:100%;
  max-width:500px;
  margin:auto;
  padding:18px;
}

/* TOP */
.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:25px;
}

.logo{
  font-size:21px;
  font-weight:bold;
}

.online{
  background:#102b1b;
  color:#45e878;
  padding:8px 12px;
  border-radius:20px;
  font-size:12px;
}

/* OWNER CARD */
.owner-card{
  background:#111722;
  border:1px solid #202938;
  border-radius:20px;
  padding:22px;
  margin-bottom:18px;
  text-align:center;
}

.owner-icon{
  width:70px;
  height:70px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:20px;
  background:#080b12;
  font-size:35px;
  margin-bottom:15px;
}

.owner-card h2{
  font-size:21px;
  margin-bottom:8px;
}

.server-text{
  color:#9aa5b5;
  font-size:14px;
  line-height:1.5;
}

/* NOTIFICATION */
.notify-btn{
  width:100%;
  border:none;
  border-radius:13px;
  padding:13px;
  margin-top:17px;
  background:#1d2635;
  color:white;
  font-size:14px;
  cursor:pointer;
}

.notify-btn:active{
  transform:scale(.98);
}

/* INCOMING */
.incoming{
  display:none;
  background:#152238;
  border:1px solid #31527d;
  border-radius:20px;
  padding:20px;
  margin-bottom:18px;
  text-align:center;
}

.incoming h3{
  margin-bottom:8px;
}

.incoming p{
  color:#aab5c5;
  font-size:14px;
  margin-bottom:17px;
}

.incoming-buttons{
  display:flex;
  gap:10px;
}

.accept,
.reject{
  flex:1;
  border:0;
  border-radius:12px;
  padding:13px;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

.accept{
  background:#20a95a;
}

.reject{
  background:#d83242;
}

/* CALL */
.call-screen{
  display:none;
}

.call-card{
  background:#111722;
  border:1px solid #202938;
  border-radius:20px;
  padding:15px;
}

.call-title{
  text-align:center;
  font-weight:bold;
  margin-bottom:14px;
}

.video-container{
  position:relative;
  width:100%;
  aspect-ratio:9/16;
  max-height:600px;
  background:#000;
  border-radius:17px;
  overflow:hidden;
}

.remote-video{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  background:#000;
  transition:transform .25s ease;
}

.local-video{
  position:absolute;
  right:12px;
  bottom:12px;
  width:115px;
  height:160px;
  object-fit:cover;
  border-radius:12px;
  border:2px solid white;
  background:#111;
  z-index:5;
  transition:transform .25s ease;
}

.remote-status{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  background:rgba(0,0,0,.72);
  padding:12px 17px;
  border-radius:12px;
  font-size:14px;
  display:none;
  z-index:4;
  text-align:center;
}

/* CONTROLS */
.controls{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-top:15px;
}

.control{
  border:0;
  border-radius:13px;
  padding:13px 8px;
  background:#1b2330;
  color:white;
  cursor:pointer;
  font-size:13px;
}

.control.off{
  background:#7c2630;
}

.end-call{
  width:100%;
  margin-top:12px;
  border:0;
  border-radius:13px;
  padding:14px;
  background:#d83242;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

/* CHAT */
.chat{
  margin-top:15px;
  background:#0e141e;
  border-radius:17px;
  padding:12px;
}

.chat-messages{
  height:150px;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  gap:7px;
  margin-bottom:10px;
}

.message{
  max-width:78%;
  padding:8px 11px;
  border-radius:12px;
  font-size:13px;
  word-break:break-word;
}

.message.me{
  align-self:flex-end;
  background:#075e54;
}

.message.other{
  align-self:flex-start;
  background:#202936;
}

.chat-input-row{
  display:flex;
  gap:7px;
}

.emoji-btn,
.send-btn{
  border:0;
  border-radius:10px;
  background:#202936;
  color:white;
  cursor:pointer;
}

.emoji-btn{
  width:43px;
}

.chat-input{
  flex:1;
  border:0;
  outline:0;
  background:#202936;
  color:white;
  padding:10px;
  border-radius:10px;
}

.send-btn{
  width:55px;
  background:#168aad;
}

.emoji-panel{
  display:none;
  padding:8px 0;
  font-size:22px;
  line-height:1.8;
}

.emoji{
  cursor:pointer;
  margin-right:7px;
}

/* FOOTER */
.footer{
  text-align:center;
  color:#596575;
  font-size:12px;
  margin-top:25px;
  padding-bottom:15px;
}
</style>
</head>

<body>

<div class="app">

  <div class="top">
    <div class="logo">Home Call</div>
    <div class="online" id="onlineStatus">🟡 Menghubungkan...</div>
  </div>

  <div class="owner-card">
    <div class="owner-icon">🏠</div>

    <h2>Owner</h2>

    <div class="server-text" id="serverText">
      Menghubungkan ke server...
    </div>

    <button class="notify-btn" id="notifyBtn">
      🔔 Aktifkan Notifikasi & Dering
    </button>
  </div>

  <!-- PANGGILAN MASUK -->
  <div class="incoming" id="incomingBox">

    <h3>📞 Panggilan Masuk</h3>

    <p>
      Seseorang sedang mencoba menghubungi Anda.
    </p>

    <div class="incoming-buttons">

      <button class="accept" id="acceptBtn">
        ✅ Terima Panggilan
      </button>

      <button class="reject" id="rejectBtn">
        ❌ Tolak
      </button>

    </div>

  </div>

  <!-- VIDEO CALL -->
  <div class="call-screen" id="callScreen">

    <div class="call-card">

      <div class="call-title">
        🎥 Video Call
      </div>

      <div class="video-container">

        <video
          id="remoteVideo"
          class="remote-video"
          autoplay
          playsinline>
        </video>

        <video
          id="localVideo"
          class="local-video"
          autoplay
          muted
          playsinline>
        </video>

        <div class="remote-status" id="remoteStatus"></div>

      </div>

      <!-- CONTROLS -->
      <div class="controls">

        <button
          class="control"
          id="micBtn">
          🎙️ Mic ON
        </button>

        <button
          class="control"
          id="cameraBtn">
          🎥 Kamera ON
        </button>

        <button
          class="control"
          id="mirrorBtn">
          🔄 Mirror
        </button>

      </div>

      <button
        class="end-call"
        id="endBtn">
        🔴 Akhiri Panggilan
      </button>

      <!-- CHAT -->
      <div class="chat">

        <div
          class="chat-messages"
          id="chatMessages">
        </div>

        <div
          class="emoji-panel"
          id="emojiPanel">

          <span class="emoji">😀</span>
          <span class="emoji">😂</span>
          <span class="emoji">😍</span>
          <span class="emoji">🥰</span>
          <span class="emoji">😎</span>
          <span class="emoji">👍</span>
          <span class="emoji">❤️</span>
          <span class="emoji">🔥</span>
          <span class="emoji">👏</span>
          <span class="emoji">🙏</span>

        </div>

        <div class="chat-input-row">

          <button
            class="emoji-btn"
            id="emojiBtn">
            😊
          </button>

          <input
            type="text"
            id="chatInput"
            class="chat-input"
            placeholder="Ketik pesan...">

          <button
            class="send-btn"
            id="sendBtn">
            ➤
          </button>

        </div>

      </div>

    </div>

  </div>

  <div class="footer">
    Home Call • Video Communication
  </div>

</div>


<script>

const OWNER_ID = "homecall-owner-2026";

let peer = null;
let incomingCall = null;
let activeCall = null;
let dataConn = null;
let localStream = null;

let micEnabled = true;
let cameraEnabled = true;
let mirrorEnabled = false;

let ringtoneInterval = null;
let audioContext = null;


/* ELEMENT */
const onlineStatus = document.getElementById("onlineStatus");
const serverText = document.getElementById("serverText");

const incomingBox = document.getElementById("incomingBox");
const acceptBtn = document.getElementById("acceptBtn");
const rejectBtn = document.getElementById("rejectBtn");

const callScreen = document.getElementById("callScreen");

const remoteVideo = document.getElementById("remoteVideo");
const localVideo = document.getElementById("localVideo");
const remoteStatus = document.getElementById("remoteStatus");

const micBtn = document.getElementById("micBtn");
const cameraBtn = document.getElementById("cameraBtn");
const mirrorBtn = document.getElementById("mirrorBtn");

const endBtn = document.getElementById("endBtn");

const chatMessages = document.getElementById("chatMessages");
const chatInput = document.getElementById("chatInput");
const sendBtn = document.getElementById("sendBtn");

const emojiBtn = document.getElementById("emojiBtn");
const emojiPanel = document.getElementById("emojiPanel");

const notifyBtn = document.getElementById("notifyBtn");


/* STATUS */
function setStatus(status, text){

  onlineStatus.textContent = status;
  serverText.textContent = text;

}


/* CEK PEERJS */
if(typeof Peer === "undefined"){

  setStatus(
    "🔴 Error",
    "PeerJS gagal dimuat. Periksa koneksi internet."
  );

}


/* BUAT PEER */
function createPeer(){

  if(typeof Peer === "undefined"){
    return;
  }

  setStatus(
    "🟡 Menghubungkan...",
    "Sedang menghubungkan Owner ke server..."
  );

  try{

    /*
      Sengaja memakai PeerJS Cloud default.

      Tidak memakai host/path/key tambahan.
    */

    peer = new Peer(OWNER_ID);

  }catch(error){

    console.error(error);

    setStatus(
      "🔴 Error",
      "Gagal membuat koneksi PeerJS."
    );

    return;

  }


  /* SERVER TERHUBUNG */
  peer.on("open", function(id){

    console.log("Owner online:", id);

    setStatus(
      "🟢 Owner Online",
      "Terhubung. Owner siap menerima panggilan."
    );

  });


  /* TERPUTUS */
  peer.on("disconnected", function(){

    console.log("Peer disconnected");

    setStatus(
      "🟠 Terputus",
      "Koneksi terputus. Mencoba menghubungkan kembali..."
    );

    setTimeout(function(){

      if(
        peer &&
        peer.disconnected &&
        !peer.destroyed
      ){

        try{
          peer.reconnect();
        }catch(error){
          console.error(error);
        }

      }

    },2000);

  });


  /* ERROR */
  peer.on("error", function(error){

    console.error(
      "PeerJS error:",
      error.type,
      error
    );


    if(error.type === "unavailable-id"){

      setStatus(
        "🔴 ID Dipakai",
        "ID Owner sedang dipakai tab/browser lain. Tutup Owner yang lain."
      );

      return;
    }


    if(error.type === "network"){

      setStatus(
        "🔴 Jaringan",
        "Koneksi internet bermasalah."
      );

      return;
    }


    if(error.type === "server-error"){

      setStatus(
        "🔴 Server",
        "Server PeerJS mengalami masalah."
      );

      return;
    }


    if(error.type === "socket-error" ||
       error.type === "socket-closed"){

      setStatus(
        "🟠 Koneksi",
        "Koneksi ke server terputus."
      );

      return;
    }


    if(error.type === "ssl-unavailable"){

      setStatus(
        "🔴 SSL",
        "Koneksi aman tidak tersedia."
      );

      return;
    }


    setStatus(
      "🔴 Error",
      "PeerJS: " + (error.message || error.type)
    );

  });


  /* CONNECTION DITUTUP */
  peer.on("close", function(){

    setStatus(
      "🔴 Offline",
      "Koneksi Owner ditutup."
    );

  });


  /* DATA CONNECTION */
  peer.on("connection", function(conn){

    console.log("Data connection masuk");

    dataConn = conn;

    setupDataConnection(conn);

  });


  /* PANGGILAN MASUK */
  peer.on("call", function(call){

    console.log("Panggilan masuk");

    if(activeCall || incomingCall){

      try{
        call.close();
      }catch(e){}

      return;
    }

    incomingCall = call;

    incomingBox.style.display = "block";

    startRingtone();

    showNotification();

  });

}


/* JALANKAN PEER */
createPeer();


/* DATA CONNECTION */
function setupDataConnection(conn){

  conn.on("open", function(){

    console.log("Data connection terbuka");

  });


  conn.on("data", function(data){

    console.log("Data diterima:", data);


    if(!data || !data.type){
      return;
    }


    /* CHAT */
    if(data.type === "chat"){

      addMessage(
        data.text,
        "other"
      );

    }


    /* MIC */
    if(data.type === "mic"){

      if(data.enabled){

        showRemoteStatus(
          "🎙️ Mikrofon menyala",
          1200
        );

      }else{

        showRemoteStatus(
          "🔇 Mikrofon dimatikan",
          2500
        );

      }

    }


    /* CAMERA */
    if(data.type === "camera"){

      if(data.enabled){

        showRemoteStatus(
          "🎥 Kamera menyala",
          1200
        );

      }else{

        showRemoteStatus(
          "📷 Kamera dimatikan",
          2500
        );

      }

    }


    /* MIRROR */
    if(data.type === "mirror"){

      remoteVideo.style.transform =
        data.enabled
          ? "scaleX(-1)"
          : "scaleX(1)";

    }

  });


  conn.on("close", function(){

    if(dataConn === conn){

      dataConn = null;

    }

  });


  conn.on("error", function(error){

    console.error(
      "Data connection error:",
      error
    );

  });

}


/* MINTA MEDIA */
async function getLocalMedia(){

  if(localStream){
    return localStream;
  }

  try{

    localStream =
      await navigator.mediaDevices.getUserMedia({

        video:true,
        audio:true

      });

    localVideo.srcObject = localStream;

    return localStream;

  }catch(error){

    console.error(error);

    alert(
      "Kamera dan mikrofon tidak bisa digunakan.\n\n" +
      "Pastikan izin kamera dan mikrofon sudah diberikan."
    );

    throw error;

  }

}


/* TERIMA PANGGILAN */
acceptBtn.onclick = async function(){

  if(!incomingCall){
    return;
  }

  stopRingtone();

  try{

    const stream =
      await getLocalMedia();

    incomingCall.answer(stream);

    activeCall = incomingCall;

    incomingCall = null;

    incomingBox.style.display = "none";

    callScreen.style.display = "block";


    activeCall.on("stream", function(remoteStream){

      remoteVideo.srcObject = remoteStream;

      remoteVideo.play().catch(()=>{});

    });


    activeCall.on("close", function(){

      endCall(false);

    });


    activeCall.on("error", function(error){

      console.error(
        "Call error:",
        error
      );

      endCall(false);

    });


    updateButtons();

  }catch(error){

    console.error(error);

    try{

      incomingCall.close();

    }catch(e){}

    incomingCall = null;

    incomingBox.style.display = "none";

  }

};


/* TOLAK */
rejectBtn.onclick = function(){

  stopRingtone();

  if(incomingCall){

    try{
      incomingCall.close();
    }catch(e){}

  }

  incomingCall = null;

  incomingBox.style.display = "none";

};


/* MIC */
micBtn.onclick = function(){

  if(!localStream){
    return;
  }

  const track =
    localStream.getAudioTracks()[0];

  if(!track){
    return;
  }

  micEnabled = !micEnabled;

  track.enabled = micEnabled;

  updateButtons();

  sendData({

    type:"mic",
    enabled:micEnabled

  });

};


/* CAMERA */
cameraBtn.onclick = function(){

  if(!localStream){
    return;
  }

  const track =
    localStream.getVideoTracks()[0];

  if(!track){
    return;
  }

  cameraEnabled = !cameraEnabled;

  track.enabled = cameraEnabled;

  updateButtons();

  sendData({

    type:"camera",
    enabled:cameraEnabled

  });

};


/* MIRROR */
mirrorBtn.onclick = function(){

  mirrorEnabled = !mirrorEnabled;

  localVideo.style.transform =
    mirrorEnabled
      ? "scaleX(-1)"
      : "scaleX(1)";

  updateButtons();

  sendData({

    type:"mirror",
    enabled:mirrorEnabled

  });

};


/* UPDATE BUTTON */
function updateButtons(){

  micBtn.textContent =
    micEnabled
      ? "🎙️ Mic ON"
      : "🔇 Mic OFF";

  cameraBtn.textContent =
    cameraEnabled
      ? "🎥 Kamera ON"
      : "📷 Kamera OFF";

  mirrorBtn.textContent =
    mirrorEnabled
      ? "🔄 Mirror ON"
      : "🔄 Mirror";


  micBtn.classList.toggle(
    "off",
    !micEnabled
  );

  cameraBtn.classList.toggle(
    "off",
    !cameraEnabled
  );

  mirrorBtn.classList.toggle(
    "off",
    mirrorEnabled
  );

}


/* KIRIM DATA */
function sendData(data){

  if(
    dataConn &&
    dataConn.open
  ){

    try{

      dataConn.send(data);

    }catch(error){

      console.error(
        "Gagal mengirim data:",
        error
      );

    }

  }

}


/* CHAT */
function sendMessage(){

  const text =
    chatInput.value.trim();

  if(!text){
    return;
  }


  addMessage(
    text,
    "me"
  );


  sendData({

    type:"chat",
    text:text

  });


  chatInput.value = "";

}


/* ENTER CHAT */
chatInput.addEventListener(
  "keydown",
  function(event){

    if(event.key === "Enter"){

      event.preventDefault();

      sendMessage();

    }

  }
);


/* SEND BUTTON */
sendBtn.onclick = sendMessage;


/* TAMBAH PESAN */
function addMessage(text, type){

  const message =
    document.createElement("div");

  message.className =
    "message " + type;

  message.textContent = text;

  chatMessages.appendChild(message);

  chatMessages.scrollTop =
    chatMessages.scrollHeight;

}


/* EMOJI */
emojiBtn.onclick = function(){

  emojiPanel.style.display =
    emojiPanel.style.display === "block"
      ? "none"
      : "block";

};


/* PILIH EMOJI */
document.querySelectorAll(".emoji")
.forEach(function(el){

  el.onclick = function(){

    chatInput.value +=
      el.textContent;

    chatInput.focus();

  };

});


/* STATUS REMOTE */
function showRemoteStatus(text, duration){

  remoteStatus.textContent = text;

  remoteStatus.style.display =
    "block";


  clearTimeout(
    showRemoteStatus.timer
  );


  showRemoteStatus.timer =
    setTimeout(function(){

      remoteStatus.style.display =
        "none";

    }, duration);

}


/* NOTIFIKASI */
notifyBtn.onclick = async function(){

  try{

    /* Unlock audio browser */
    const AudioContextClass =
      window.AudioContext ||
      window.webkitAudioContext;

    if(AudioContextClass){

      audioContext =
        audioContext ||
        new AudioContextClass();

      if(audioContext.state === "suspended"){

        await audioContext.resume();

      }

    }


    /* Permission notification */
    if("Notification" in window){

      const permission =
        await Notification.requestPermission();

      if(permission === "granted"){

        notifyBtn.textContent =
          "✅ Notifikasi Aktif";

      }else{

        notifyBtn.textContent =
          "⚠️ Notifikasi Ditolak";

      }

    }else{

      notifyBtn.textContent =
        "⚠️ Browser Tidak Mendukung";

    }


    /* Bunyi tes */
    playBeep();

  }catch(error){

    console.error(error);

  }

};


/* NOTIFIKASI PANGGILAN */
function showNotification(){

  if(
    "Notification" in window &&
    Notification.permission === "granted"
  ){

    try{

      new Notification(
        "📞 Home Call",
        {
          body:"Ada panggilan video masuk.",
          icon:""
        }
      );

    }catch(error){

      console.error(error);

    }

  }

}


/* BUNYI */
function playBeep(){

  try{

    const AudioContextClass =
      window.AudioContext ||
      window.webkitAudioContext;

    if(!AudioContextClass){
      return;
    }

    audioContext =
      audioContext ||
      new AudioContextClass();


    const oscillator =
      audioContext.createOscillator();

    const gain =
      audioContext.createGain();


    oscillator.type = "sine";

    oscillator.frequency.value =
      880;

    gain.gain.value =
      0.12;


    oscillator.connect(gain);
