<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home Call</title>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0b0f14;
  color:white;
}
.header{
  padding:20px;
  text-align:center;
  background:#111821;
  border-bottom:1px solid #222b35;
}
.header h1{margin:0;font-size:25px}
.status{margin-top:7px;color:#35e27b;font-size:14px}

.container{
  max-width:480px;
  margin:auto;
  padding:20px;
}

.welcome{text-align:center;margin:25px 0}
.welcome h2{margin-bottom:8px}
.welcome p{color:#aeb7c2}

.card{
  background:#151c25;
  border-radius:20px;
  padding:25px;
  text-align:center;
  box-shadow:0 8px 30px #0005;
}

.callIcon{font-size:55px;margin-bottom:10px}

button{
  border:0;
  border-radius:13px;
  padding:13px 16px;
  color:white;
  background:#26313e;
  font-size:15px;
  cursor:pointer;
}
button:active{transform:scale(.97)}

.start{
  width:100%;
  margin-top:15px;
  background:#18a957;
  font-size:17px;
  font-weight:bold;
}

#callArea{display:none;margin-top:20px}

.videoBox{
  position:relative;
  width:100%;
  aspect-ratio:16/10;
  background:#000;
  border-radius:18px;
  overflow:hidden;
}

#remoteVideo{
  width:100%;
  height:100%;
  object-fit:cover;
  background:#000;
}

.localBox{
  position:absolute;
  right:12px;
  bottom:12px;
  width:110px;
  aspect-ratio:3/4;
  border-radius:12px;
  overflow:hidden;
  border:2px solid white;
  background:#111;
}

#localVideo{
  width:100%;
  height:100%;
  object-fit:cover;
}

.controls{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin-top:15px;
}

.end{background:#d83232}

.chat{
  margin-top:20px;
  background:#151c25;
  border-radius:18px;
  padding:15px;
}

.messages{
  height:180px;
  overflow-y:auto;
  margin-bottom:10px;
}

.msg{
  background:#26313e;
  padding:9px 11px;
  border-radius:10px;
  margin-bottom:7px;
  max-width:85%;
}

.mine{
  margin-left:auto;
  background:#168a4a;
}

.chatRow{
  display:flex;
  gap:7px;
}

.chatRow input{
  flex:1;
  border:0;
  outline:0;
  border-radius:10px;
  padding:12px;
  background:#222b35;
  color:white;
}
</style>
</head>

<body>

<div class="header">
  <h1>🏠 Home Call</h1>
  <div class="status" id="status">🟢 Online</div>
</div>

<div class="container">

  <div class="welcome">
    <h2>Selamat datang 👋</h2>
    <p>Hubungi pemilik rumah sekarang.</p>
  </div>

  <div class="card" id="startCard">
    <div class="callIcon">📹</div>
    <h2>Video Call</h2>
    <p>Tekan tombol di bawah untuk menghubungi pemilik rumah.</p>
    <button class="start" onclick="startCall()">📞 Mulai Video Call</button>
  </div>

  <div id="callArea">

    <div class="videoBox">
      <video id="remoteVideo" autoplay playsinline></video>

      <div class="localBox">
        <video id="localVideo" autoplay muted playsinline></video>
      </div>
    </div>

    <div class="controls">
      <button onclick="toggleMirror()">↔️</button>
      <button onclick="toggleMic()" id="micBtn">🎙️</button>
      <button onclick="toggleCamera()" id="camBtn">📹</button>
      <button class="end" onclick="endCall()">🔴</button>
    </div>

    <div class="chat">
      <h3>💬 Pesan</h3>

      <div class="messages" id="messages"></div>

      <div class="chatRow">
        <input id="messageInput" placeholder="Ketik pesan...">
        <button onclick="sendMessage()">Kirim</button>
      </div>
    </div>

  </div>
</div>

<script>
const OWNER_ID = "homecall-owner-2026";

const peer = new Peer();

let currentCall = null;
let dataConnection = null;

let localStream = null;
let audioTrack = null;
let videoTrack = null;
let audioSender = null;

let micOn = true;
let cameraOn = true;
let mirrored = false;

const statusEl = document.getElementById("status");
const localVideo = document.getElementById("localVideo");
const remoteVideo = document.getElementById("remoteVideo");

peer.on("open", () => {
  statusEl.textContent = "🟢 Online";
});

peer.on("error", err => {
  console.log(err);
  statusEl.textContent = "🔴 Terjadi masalah";
});

async function getMedia(){
  localStream = await navigator.mediaDevices.getUserMedia({
    video:true,
    audio:true
  });

  audioTrack = localStream.getAudioTracks()[0];
  videoTrack = localStream.getVideoTracks()[0];

  localVideo.srcObject = localStream;
}

async function startCall(){

  try{

    await getMedia();

    document.getElementById("startCard").style.display="none";
    document.getElementById("callArea").style.display="block";

    dataConnection = peer.connect(OWNER_ID);

    dataConnection.on("open",()=>{
      console.log("Data connection connected");
    });

    dataConnection.on("data",handleData);

    currentCall = peer.call(OWNER_ID,localStream);

    currentCall.on("stream",stream=>{
      remoteVideo.srcObject=stream;

      setTimeout(()=>{
        audioSender =
          currentCall.peerConnection
          .getSenders()
          .find(s => s.track && s.track.kind==="audio");
      },500);
    });

    currentCall.on("close",()=>{
      endCall(false);
    });

  }catch(e){
    alert("Tidak dapat menggunakan kamera atau mikrofon.");
    console.log(e);
  }
}

function toggleMirror(){

  mirrored=!mirrored;

  localVideo.style.transform =
    mirrored ? "scaleX(-1)" : "scaleX(1)";

  if(dataConnection && dataConnection.open){
    dataConnection.send({
      type:"mirror",
      value:mirrored
    });
  }
}

function toggleMic(){

  micOn=!micOn;

  if(audioSender){

    if(micOn){
      audioSender.replaceTrack(audioTrack);
    }else{
      audioSender.replaceTrack(null);
    }
  }

  audioTrack.enabled=micOn;

  document.getElementById("micBtn").textContent =
    micOn ? "🎙️" : "🔇";
}

function toggleCamera(){

  cameraOn=!cameraOn;

  videoTrack.enabled=cameraOn;

  document.getElementById("camBtn").textContent =
    cameraOn ? "📹" : "🚫📹";
}

function endCall(sendMessage=true){

  if(sendMessage && dataConnection && dataConnection.open){
    dataConnection.send({
      type:"peer-ended"
    });
  }

  if(currentCall){
    currentCall.close();
    currentCall=null;
  }

  if(localStream){
    localStream.getTracks().forEach(track=>track.stop());
    localStream=null;
  }

  remoteVideo.srcObject=null;
  localVideo.srcObject=null;

  document.getElementById("callArea").style.display="none";
  document.getElementById("startCard").style.display="block";

  micOn=true;
  cameraOn=true;
  mirrored=false;

  document.getElementById("micBtn").textContent="🎙️";
  document.getElementById("camBtn").textContent="📹";
}

function sendMessage(){

  const input=document.getElementById("messageInput");
  const text=input.value.trim();

  if(!text)return;

  if(dataConnection && dataConnection.open){

    dataConnection.send({
      type:"chat",
      message:text
    });

    addMessage(text,true);
    input.value="";
  }
}

function addMessage(text,mine){

  const box=document.getElementById("messages");

  const div=document.createElement("div");
  div.className="msg"+(mine ? " mine":"");
  div.textContent=text;

  box.appendChild(div);
  box.scrollTop=box.scrollHeight;
}

function handleData(data){

  if(data.type==="chat"){
    addMessage(data.message,false);
  }

  if(data.type==="mirror"){

    remoteVideo.style.transform =
      data.value ? "scaleX(-1)" : "scaleX(1)";
  }

  if(data.type==="peer-ended"){
    endCall(false);
  }
}
</script>

</body>
</html>
