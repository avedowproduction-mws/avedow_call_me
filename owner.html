<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home Call - Owner</title>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0b0f19;
    color: white;
    text-align: center;
}

header {
    padding: 25px 15px 15px;
}

h1 {
    margin: 0;
    font-size: 28px;
}

.status {
    margin-top: 10px;
    color: #8b9bb4;
}

/* =========================
   TOMBOL AKTIFKAN NOTIFIKASI
========================= */

#enableAlertsBtn {
    margin-top: 15px;
    background: #2563eb;
    color: white;
    border: 0;
    border-radius: 12px;
    padding: 13px 18px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

#enableAlertsBtn.active {
    background: #19c37d;
}

/* =========================
   PANGGILAN MASUK
========================= */

#incoming {
    display: none;
    margin: 20px auto;
    padding: 20px;
    max-width: 400px;
    background: #151c2b;
    border-radius: 18px;
    border: 1px solid #26324a;
}

#incoming h2 {
    margin-top: 0;
}

button {
    border: 0;
    border-radius: 12px;
    padding: 14px 22px;
    margin: 7px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.accept {
    background: #19c37d;
    color: white;
}

.reject,
.end {
    background: #e5484d;
    color: white;
}

#callArea {
    display: none;
    padding: 10px;
}

.videoBox {
    position: relative;
    width: 100%;
    max-width: 700px;
    margin: auto;
}

#remoteVideo {
    width: 100%;
    min-height: 250px;
    background: black;
    border-radius: 18px;
    object-fit: cover;
}

#localVideo {
    position: absolute;
    right: 15px;
    bottom: 15px;
    width: 140px;
    height: 190px;
    background: #111;
    border: 2px solid white;
    border-radius: 12px;
    object-fit: cover;
}

#message {
    margin: 15px;
    color: #8b9bb4;
    min-height: 20px;
}

/* =========================
   ANIMASI PANGGILAN
========================= */

.incoming-icon {
    font-size: 48px;
    animation: ringIcon 1s infinite;
}

@keyframes ringIcon {

    0% {
        transform: rotate(0deg);
    }

    10% {
        transform: rotate(-12deg);
    }

    20% {
        transform: rotate(12deg);
    }

    30% {
        transform: rotate(-12deg);
    }

    40% {
        transform: rotate(12deg);
    }

    50% {
        transform: rotate(0deg);
    }

    100% {
        transform: rotate(0deg);
    }

}

</style>
</head>

<body>

<header>

    <h1>🏠 Home Call</h1>

    <div class="status" id="status">
        Menghubungkan ke server...
    </div>

    <button id="enableAlertsBtn">
        🔔 Aktifkan Notifikasi & Dering
    </button>

</header>


<!-- =========================
     PANGGILAN MASUK
========================= -->

<div id="incoming">

    <div class="incoming-icon">
        📞
    </div>

    <h2>📞 Panggilan Masuk</h2>

    <p>
        Seseorang sedang menelepon.
    </p>

    <button class="accept" id="acceptBtn">
        ✅ Terima Panggilan
    </button>

    <button class="reject" id="rejectBtn">
        ❌ Tolak
    </button>

</div>


<div id="message"></div>


<!-- =========================
     AREA VIDEO
========================= -->

<div id="callArea">

    <div class="videoBox">

        <video
            id="remoteVideo"
            autoplay
            playsinline>
        </video>

        <video
            id="localVideo"
            autoplay
            muted
            playsinline>
        </video>

    </div>

    <button class="end" id="endBtn">
        🔴 Akhiri Panggilan
    </button>

</div>


<script>

/* =====================================================
   KONFIGURASI
===================================================== */

const OWNER_ID = "homecall-owner-2026";


/* =====================================================
   VARIABEL
===================================================== */

let peer;

let incomingCall = null;

let localStream = null;

let callNotification = null;


/* =====================================================
   AUDIO / DERING
===================================================== */

let audioContext = null;

let ringtoneTimer = null;

let audioUnlocked = false;


/* =====================================================
   ELEMENT HTML
===================================================== */

const status =
    document.getElementById("status");

const incoming =
    document.getElementById("incoming");

const callArea =
    document.getElementById("callArea");

const acceptBtn =
    document.getElementById("acceptBtn");

const rejectBtn =
    document.getElementById("rejectBtn");

const endBtn =
    document.getElementById("endBtn");

const remoteVideo =
    document.getElementById("remoteVideo");

const localVideo =
    document.getElementById("localVideo");

const message =
    document.getElementById("message");

const enableAlertsBtn =
    document.getElementById("enableAlertsBtn");


/* =====================================================
   AKTIFKAN NOTIFIKASI + AUDIO
===================================================== */

enableAlertsBtn.onclick = async function() {

    /* =========================
       AKTIFKAN AUDIO
    ========================= */

    try {

        if (!audioContext) {

            audioContext =
                new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();

        }

        if (
            audioContext.state ===
            "suspended"
        ) {

            await audioContext.resume();

        }

        audioUnlocked = true;

        console.log(
            "Audio berhasil diaktifkan"
        );

    } catch(error) {

        console.error(
            "Audio error:",
            error
        );

    }


    /* =========================
       IZIN NOTIFIKASI
    ========================= */

    if ("Notification" in window) {

        try {

            const permission =
                await Notification.requestPermission();

            console.log(
                "Notification permission:",
                permission
            );

        } catch(error) {

            console.error(
                "Notification error:",
                error
            );

        }

    }


    /* =========================
       UPDATE TOMBOL
    ========================= */

    if (
        "Notification" in window &&
        Notification.permission === "granted" &&
        audioUnlocked
    ) {

        enableAlertsBtn.innerText =
            "✅ Notifikasi & Dering Aktif";

        enableAlertsBtn.classList.add(
            "active"
        );

        message.innerText =
            "🔔 Notifikasi dan dering aktif.";

    }

    else if (
        "Notification" in window &&
        Notification.permission !== "granted"
    ) {

        enableAlertsBtn.innerText =
            "⚠️ Izin Notifikasi Belum Aktif";

        message.innerText =
            "Izinkan notifikasi di pengaturan browser.";

    }

    else {

        enableAlertsBtn.innerText =
            "🔊 Dering Aktif";

        message.innerText =
            "🔊 Dering berhasil diaktifkan.";

    }

};


/* =====================================================
   FUNGSI MEMBUAT SUARA DERING
===================================================== */

function playTone(frequency, duration) {

    if (!audioContext) {
        return;
    }

    if (!audioUnlocked) {
        return;
    }

    try {

        const oscillator =
            audioContext.createOscillator();

        const gain =
            audioContext.createGain();


        oscillator.type = "sine";

        oscillator.frequency.value =
            frequency;


        gain.gain.setValueAtTime(
            0.0001,
            audioContext.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            0.25,
            audioContext.currentTime + 0.03
        );

        gain.gain.exponentialRampToValueAtTime(
            0.0001,
            audioContext.currentTime + duration
        );


        oscillator.connect(gain);

        gain.connect(
            audioContext.destination
        );


        oscillator.start();

        oscillator.stop(
            audioContext.currentTime +
            duration
        );

    } catch(error) {

        console.error(
            "Ringtone error:",
            error
        );

    }

}


/* =====================================================
   MULAI DERING
===================================================== */

function startRingtone() {

    stopRingtone();


    if (!audioUnlocked) {

        console.log(
            "Audio belum diaktifkan."
        );

        return;

    }


    function ring() {

        /* Nada pertama */

        playTone(
            880,
            0.35
        );


        /* Nada kedua */

        setTimeout(function() {

            playTone(
                660,
                0.35
            );

        }, 400);

    }


    ring();


    ringtoneTimer =
        setInterval(
            ring,
            1800
        );


    console.log(
        "🔊 Ringtone dimulai"
    );

}


/* =====================================================
   HENTIKAN DERING
===================================================== */

function stopRingtone() {

    if (ringtoneTimer) {

        clearInterval(
            ringtoneTimer
        );

        ringtoneTimer = null;

    }

    console.log(
        "🔇 Ringtone berhenti"
    );

}


/* =====================================================
   NOTIFIKASI PANGGILAN
===================================================== */

function showCallNotification() {

    if (!("Notification" in window)) {

        console.log(
            "Browser tidak mendukung Notification API"
        );

        return;

    }


    if (
        Notification.permission !==
        "granted"
    ) {

        console.log(
            "Izin notifikasi belum diberikan."
        );

        return;

    }


    try {

        callNotification =
            new Notification(
                "📞 Home Call — Panggilan Masuk",
                {
                    body:
                        "Seseorang sedang menelepon. Buka Home Call untuk menerima panggilan.",

                    tag:
                        "homecall-incoming",

                    renotify:
                        true,

                    requireInteraction:
                        true,

                    silent:
                        false
                }
            );


        callNotification.onclick =
            function() {

                try {

                    window.focus();

                } catch(error) {

                    console.log(error);

                }

                closeCallNotification();

            };


        console.log(
            "🔔 Notifikasi panggilan ditampilkan"
        );

    } catch(error) {

        console.error(
            "Gagal membuat notifikasi:",
            error
        );

    }

}


/* =====================================================
   TUTUP NOTIFIKASI
===================================================== */

function closeCallNotification() {

    if (callNotification) {

        try {

            callNotification.close();

        } catch(error) {

            console.log(error);

        }

        callNotification = null;

    }

}


/* =====================================================
   BUAT PEER OWNER
===================================================== */

peer = new Peer(
    OWNER_ID,
    {
        debug: 3,

        config: {

            iceServers: [

                {
                    urls:
                        "stun:stun.l.google.com:19302"
                }

            ]

        }

    }
);


/* =====================================================
   PEER TERHUBUNG
===================================================== */

peer.on(
    "open",
    function(id) {

        console.log(
            "Owner online:",
            id
        );

        status.innerText =
            "🟢 Owner online — menunggu panggilan";

    }
);


/* =====================================================
   ADA PANGGILAN MASUK
===================================================== */

peer.on(
    "call",
    function(call) {

        console.log(
            "📞 Panggilan masuk dari:",
            call.peer
        );


        /* =========================
           SIMPAN PANGGILAN
        ========================= */

        incomingCall =
            call;


        /* =========================
           TAMPILKAN PANEL
        ========================= */

        incoming.style.display =
            "block";


        status.innerText =
            "📞 Ada panggilan masuk";


        message.innerText =
            "🔔 Telepon masuk — silakan terima atau tolak.";


        /* =========================
           MULAI DERING
        ========================= */

        startRingtone();


        /* =========================
           NOTIFIKASI ASLI
        ========================= */

        showCallNotification();


        /* =========================
           JIKA PENELEPON MEMUTUS
        ========================= */

        call.on(
            "close",
            function() {

                console.log(
                    "Penelepon menutup panggilan."
                );

                stopRingtone();

                closeCallNotification();

                incomingCall =
                    null;

                incoming.style.display =
                    "none";

                if (
                    callArea.style.display !==
                    "block"
                ) {

                    status.innerText =
                        "🟢 Owner online — menunggu panggilan";

                    message.innerText =
                        "";

                }

            }
        );

    }
);


/* =====================================================
   TOMBOL TERIMA
===================================================== */

acceptBtn.onclick =
    async function() {

        if (!incomingCall) {
            return;
        }


        /* =========================
           HENTIKAN DERING
        ========================= */

        stopRingtone();

        closeCallNotification();


        try {

            message.innerText =
                "Meminta izin kamera dan mikrofon...";


            /* =========================
               AKTIFKAN KAMERA + AUDIO
            ========================= */

            localStream =
                await navigator.mediaDevices
                    .getUserMedia(
                        {
                            video: true,
                            audio: true
                        }
                    );


            console.log(
                "Kamera Owner aktif"
            );


            /* =========================
               VIDEO LOCAL
            ========================= */

            localVideo.srcObject =
                localStream;


            await localVideo
                .play()
                .catch(
                    function() {}
                );


            /* =========================
               JAWAB PANGGILAN
            ========================= */

            incomingCall.answer(
                localStream
            );


            console.log(
                "Panggilan dijawab"
            );


            incoming.style.display =
                "none";


            callArea.style.display =
                "block";


            status.innerText =
                "🟢 Terhubung";


            message.innerText =
                "Menunggu video dari penelpon...";


            /* =========================
               TERIMA VIDEO PENELPON
            ========================= */

            incomingCall.on(
                "stream",
                function(remoteStream) {

                    console.log(
                        "Video penelpon diterima"
                    );


                    remoteVideo.srcObject =
                        remoteStream;


                    remoteVideo
                        .play()
                        .catch(
                            function(error) {

                                console.log(
                                    "Video belum autoplay:",
                                    error
                                );

                                message.innerText =
                                    "Tekan video untuk memulai pemutaran.";

                            }
                        );


                    message.innerText =
                        "🟢 Video terhubung";

                }
            );


            /* =========================
               PANGGILAN DITUTUP
            ========================= */

            incomingCall.on(
                "close",
                function() {

                    endCall();

                }
            );


            /* =========================
               ERROR PANGGILAN
            ========================= */

            incomingCall.on(
                "error",
                function(error) {

                    console.error(
                        error
                    );


                    message.innerText =
                        "❌ Koneksi video gagal: " +
                        error.type;

                }
            );

        }

        catch(error) {

            console.error(
                error
            );


            message.innerText =
                "❌ Kamera/mikrofon tidak bisa digunakan: " +
                error.message;

        }

    };


/* =====================================================
   TOMBOL TOLAK
===================================================== */

rejectBtn.onclick =
    function() {

        stopRingtone();

        closeCallNotification();


        if (incomingCall) {

            incomingCall.close();

        }


        incomingCall =
            null;


        incoming.style.display =
            "none";


        status.innerText =
            "🟢 Owner online — menunggu panggilan";


        message.innerText =
            "Panggilan ditolak.";

    };


/* =====================================================
   TOMBOL AKHIRI PANGGILAN
===================================================== */

endBtn.onclick =
    function() {

        stopRingtone();

        closeCallNotification();


        if (incomingCall) {

            incomingCall.close();

        }


        endCall();

    };


/* =====================================================
   FUNGSI END CALL
===================================================== */

function endCall() {

    stopRingtone();

    closeCallNotification();


    /* =========================
       MATIKAN STREAM OWNER
    ========================= */

    if (localStream) {

        localStream
            .getTracks()
            .forEach(
                function(track) {

                    track.stop();

                }
            );

        localStream =
            null;

    }


    /* =========================
       HAPUS VIDEO
    ========================= */

    remoteVideo.srcObject =
        null;

    localVideo.srcObject =
        null;


    /* =========================
       TUTUP AREA
    ========================= */

    callArea.style.display =
        "none";

    incoming.style.display =
        "none";


    incomingCall =
        null;


    /* =========================
       STATUS
    ========================= */

    status.innerText =
        "🟢 Owner online — menunggu panggilan";

    message.innerText =
        "";

}
