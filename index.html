<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HOMEKALL</title>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#080b12;
    color:white;
    font-family:Arial,sans-serif;
}

header{
    padding:16px;
    text-align:center;
    font-size:23px;
    font-weight:bold;
    background:#111827;
}

.status{
    text-align:center;
    padding:8px;
    color:#aaa;
}

.container{
    max-width:900px;
    margin:auto;
    padding:12px;
}

.callArea{
    position:relative;
    width:100%;
    height:65vh;
    min-height:400px;
    background:#000;
    border-radius:18px;
    overflow:hidden;
}

#remoteVideo{
    width:100%;
    height:100%;
    object-fit:cover;
    background:#000;
}

.localBox{
    position:absolute;
    right:15px;
    bottom:15px;
    width:145px;
    height:190px;
    border-radius:14px;
    overflow:hidden;
    background:#111;
    border:2px solid white;
    box-shadow:0 5px 20px #000;
}

#localVideo{
    width:100%;
    height:100%;
    object-fit:cover;
}

.label{
    position:absolute;
    left:8px;
    top:8px;
    background:#000b;
    padding:5px 8px;
    border-radius:20px;
    font-size:11px;
}

.welcome{
    text-align:center;
    padding:15px;
}

.welcome h2{
    margin:5px 0;
}

.startBtn{
    width:100%;
    padding:15px;
    border:0;
    border-radius:14px;
    background:#16a34a;
    color:white;
    font-size:17px;
    font-weight:bold;
}

.controls{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:9px;
    margin-top:12px;
}

button{
    border:0;
    border-radius:12px;
    padding:13px 8px;
    background:#263244;
    color:white;
    font-size:14px;
    font-weight:bold;
}

button.active{
    background:#2563eb;
}

button.danger{
    background:#b91c1c;
}

.chat{
    margin-top:12px;
    background:#111827;
    padding:12px;
    border-radius:16px;
}

.messages{
    height:140px;
    overflow-y:auto;
    background:#080b12;
    padding:10px;
    border-radius:12px;
    margin-bottom:9px;
}

.message{
    padding:8px 10px;
    background:#1f2937;
    border-radius:10px;
    margin:6px 0;
    word-break:break-word;
}

.message.me{
    background:#1d4ed8;
}

.chatRow{
    display:flex;
    gap:8px;
}

input{
    flex:1;
    min-width:0;
    padding:12px;
    border:0;
    border-radius:10px;
    font-size:15px;
}

@media(max-width:600px){

    .callArea{
        height:60vh;
        min-height:350px;
    }

    .localBox{
        width:105px;
        height:140px;
        right:10px;
        bottom:10px;
    }

}
</style>
</head>

<body>

<header>
🏠 HOMEKALL
</header>

<div id="status" class="status">
🟡 Menghubungkan...
</div>

<div class="container">

<div class="welcome">
<h2>Selamat datang 👋</h2>
<p>Hubungi pemilik rumah sekarang.</p>

<button id="startBtn" class="startBtn">
📞 Mulai Video Call
</button>
</div>

<div class="callArea">

<video id="remoteVideo"
       autoplay
       playsinline>
</video>

<div class="localBox">

<video id="localVideo"
       autoplay
       muted
       playsinline>
</video>

<div class="label">
Penelpon
</div>

</div>

</div>

<div class="controls">

<button id="mirrorBtn">
↔️ Balik Layar
</button>

<button id="micBtn">
🎙️ Matikan Mikrofon
</button>

<button id="camBtn">
📹 Matikan Kamera
</button>

<button id="endBtn" class="danger">
🔴 Akhiri Panggilan
</button>

</div>

<div class="chat">

<div id="messages" class="messages"></div>

<div class="chatRow">

<input
id="messageInput"
placeholder="Ketik pesan..."
maxlength="500">

<button id="sendBtn">
💬 Kirim
</button>

</div>

</div>

</div>

<script>

const OWNER_ID="homecall-owner-2026";

const peer=new Peer(undefined,{
    host:"0.peerjs.com",
    port:443,
    secure:true,
    path:"/"
});

let localStream=null;
let currentCall=null;
let dataConnection=null;

let mirror=false;
let mic=true;
let cam=true;

let audioTrack=null;
let videoTrack=null;

const localVideo=
document.getElementById("localVideo");

const remoteVideo=
document.getElementById("remoteVideo");

const status=
document.getElementById("status");

const mirrorBtn=
document.getElementById("mirrorBtn");

const micBtn=
document.getElementById("micBtn");

const camBtn=
document.getElementById("camBtn");

const endBtn=
document.getElementById("endBtn");

const startBtn=
document.getElementById("startBtn");

const input=
document.getElementById("messageInput");

const sendBtn=
document.getElementById("sendBtn");

const messages=
document.getElementById("messages");


function setStatus(text){
    status.textContent=text;
}


function addMessage(text,mine){

    const div=document.createElement("div");

    div.className="message";

    if(mine){
        div.classList.add("me");
    }

    div.textContent=
        (mine?"Saya: ":"Pemilik: ")+text;

    messages.appendChild(div);

    messages.scrollTop=
        messages.scrollHeight;
}


function sendData(data){

    if(dataConnection &&
       dataConnection.open){

        dataConnection.send(data);

    }

}


/* =========================
   MEDIA
========================= */

async function getMedia(){

    localStream=
        await navigator.mediaDevices
        .getUserMedia({
            video:true,
            audio:true
        });

    localVideo.srcObject=
        localStream;

    audioTrack=
        localStream.getAudioTracks()[0];

    videoTrack=
        localStream.getVideoTracks()[0];

}


/* =========================
   MUTE BENAR-BENAR
========================= */

async function setMicrophone(enabled){

    mic=enabled;

    if(!currentCall ||
       !currentCall.peerConnection){

        if(audioTrack){
            audioTrack.enabled=enabled;
        }

        return;
    }

    const sender=
        currentCall.peerConnection
        .getSenders()
        .find(s =>
            s.track &&
            s.track.kind==="audio"
        );

    if(!sender){
        return;
    }

    if(enabled){

        await sender.replaceTrack(
            audioTrack
        );

        audioTrack.enabled=true;

    }else{

        await sender.replaceTrack(null);

        audioTrack.enabled=false;

    }

}


/* =========================
   KAMERA
========================= */

function setCamera(enabled){

    cam=enabled;

    if(videoTrack){
        videoTrack.enabled=enabled;
    }

    if(currentCall &&
       currentCall.peerConnection){

        const sender=
            currentCall.peerConnection
            .getSenders()
            .find(s =>
                s.track &&
                s.track.kind==="video"
            );

        if(sender &&
           sender.track){

            sender.track.enabled=enabled;

        }

    }

}


/* =========================
   TOMBOL
========================= */

function updateButtons(){

    mirrorBtn.textContent=
        mirror
        ? "↔️ Balik Layar: ON"
        : "↔️ Balik Layar";

    micBtn.textContent=
        mic
        ? "🎙️ Matikan Mikrofon"
        : "🎙️ Nyalakan Mikrofon";

    camBtn.textContent=
        cam
        ? "📹 Matikan Kamera"
        : "📹 Nyalakan Kamera";

    micBtn.classList.toggle(
        "active",
        !mic
    );

    camBtn.classList.toggle(
        "active",
        !cam
    );

}


/* =========================
   DATA
========================= */

function receiveData(data){

    if(!data ||
       !data.type){

        return;

    }


    if(data.type==="chat"){

        addMessage(
            String(data.text),
            false
        );

    }


    if(data.type==="mirror"){

        remoteVideo.style.transform=
            data.value
            ? "scaleX(-1)"
            : "scaleX(1)";

    }


    if(data.type==="state"){

        remoteVideo.style.transform=
            data.mirror
            ? "scaleX(-1)"
            : "scaleX(1)";

    }


    if(data.type==="peer-ended"){

        endCall(false);

    }

}


/* =========================
   CONNECTION
========================= */

function setupConnection(connection){

    dataConnection=connection;

    connection.on("open",()=>{

        sendData({
            type:"state",
            mirror:mirror,
            mic:mic,
            cam:cam
        });

    });

    connection.on(
        "data",
        receiveData
    );

}


/* =========================
   PEER READY
========================= */

peer.on("open",async()=>{

    try{

        await getMedia();

        setStatus(
            "🟢 Siap. Tekan Mulai Video Call."
        );

    }catch(error){

        console.error(error);

        setStatus(
            "🔴 Izin kamera/mikrofon ditolak."
        );

    }

});


peer.on(
    "connection",
    setupConnection
);


/* =========================
   MULAI PANGGILAN
========================= */

startBtn.onclick=async()=>{

    if(!localStream){

        await getMedia();

    }

    if(currentCall){
        return;
    }


    dataConnection=
        peer.connect(
            OWNER_ID,
            {
                reliable:true
            }
        );

    setupConnection(
        dataConnection
    );


    currentCall=
        peer.call(
            OWNER_ID,
            localStream
        );


    currentCall.on(
        "stream",
        remoteStream=>{

            remoteVideo.srcObject=
                remoteStream;

            setStatus(
                "🟢 Terhubung dengan pemilik."
            );

        }
    );


    currentCall.on(
        "close",
        ()=>{

            currentCall=null;

            remoteVideo.srcObject=null;

            setStatus(
                "⚪ Panggilan berakhir."
            );

        }
    );

};


/* =========================
   BALIK LAYAR
========================= */

mirrorBtn.onclick=()=>{

    mirror=!mirror;

    localVideo.style.transform=
        mirror
        ? "scaleX(-1)"
        : "scaleX(1)";

    updateButtons();

    sendData({
        type:"mirror",
        value:mirror
    });

};


/* =========================
   MIKROFON
========================= */

micBtn.onclick=async()=>{

    try{

        await setMicrophone(
            !mic
        );

        updateButtons();

        sendData({
            type:"mic",
            value:mic
        });

    }catch(error){

        console.error(error);

    }

};


/* =========================
   KAMERA
========================= */

camBtn.onclick=()=>{

    setCamera(
        !cam
    );

    updateButtons();

    sendData({
        type:"cam",
        value:cam
    });

};


/* =========================
   AKHIRI
========================= */

function endCall(notify=true){

    if(notify){

        sendData({
            type:"peer-ended"
        });

    }


    try{

        if(currentCall){
            currentCall.close();
        }

    }catch(error){}


    currentCall=null;

    remoteVideo.srcObject=null;

    setStatus(
        "⚪ Panggilan diakhiri."
    );

}


endBtn.onclick=()=>{

    endCall(true);

};


/* =========================
   CHAT
========================= */

function sendMessage(){

    const text=
        input.value.trim();

    if(!text){
        return;
    }


    addMessage(
        text,
        true
    );


    sendData({
        type:"chat",
        text:text
    });


    input.value="";

}


sendBtn.onclick=
    sendMessage;


input.onkeydown=e=>{

    if(e.key==="Enter"){
        sendMessage();
    }

};


updateButtons();

</script>

</body>
</html>
