<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home Call - Avedo</title>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0b0f14;
  color:white;
}

.header{
  padding:20px;
  text-align:center;
  background:#111821;
  border-bottom:1px solid #252e38;
}

.header h1{
  margin:0;
  font-size:25px;
}

.status{
  margin-top:7px;
  color:#35e27b;
  font-size:14px;
}

.container{
  max-width:480px;
  margin:auto;
  padding:20px;
}

.waiting{
  text-align:center;
  padding:45px 20px;
}

.waitingIcon{
  font-size:60px;
}

#callArea{
  display:none;
}

.videoBox{
  position:relative;
  width:100%;
  aspect-ratio:16/10;
  background:#000;
  border-radius:18px;
  overflow:hidden;
}

#remoteVideo{
  width:100%;
  height:100%;
  object-fit:cover;
  background:#000;
}

.localBox{
  position:absolute;
  right:12px;
  bottom:12px;
  width:105px;
  aspect-ratio:3/4;
  border-radius:12px;
  overflow:hidden;
  border:2px solid white;
  background:#111;
}

#localVideo{
  width:100%;
  height:100%;
  object-fit:cover;
}

.controls{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:15px;
}

.controlBtn{
  border:0;
  border-radius:13px;
  padding:13px 5px;
  color:white;
  background:#26313e;
  font-size:14px;
}

.end{
  background:#d83232;
}

.chat{
  margin-top:15px;
  background:#151c25;
  border-radius:15px;
  padding:12px;
}

.chatTitle{
  font-size:15px;
  margin-bottom:8px;
}

.messages{
  height:125px;
  overflow-y:auto;
  margin-bottom:8px;
}

.msg{
  background:#26313e;
  padding:7px 9px;
  border-radius:9px;
  margin-bottom:6px;
  max-width:85%;
  font-size:13px;
}

.mine{
  margin-left:auto;
  background:#168a4a;
}

.msgName{
  font-size:10px;
  opacity:.7;
  margin-bottom:3px;
}

.chatRow{
  display:flex;
  gap:5px;
}

.chatRow input{
  min-width:0;
  flex:1;
  border:0;
  outline:0;
  border-radius:9px;
  padding:9px;
  background:#222b35;
  color:white;
  font-size:13px;
}

.sendBtn,
.emojiBtn{
  border:0;
  border-radius:9px;
  background:#26313e;
  color:white;
  padding:8px 10px;
}

.emojiPanel{
  display:none;
  background:#202934;
  border-radius:10px;
  padding:7px;
  margin-bottom:7px;
  text-align:center;
  line-height:1.8;
}

.emojiPanel span{
  cursor:pointer;
  font-size:20px;
  margin:2px;
}

.incoming{
  display:none;
  background:#151c25;
  border-radius:18px;
  padding:20px;
  text-align:center;
  margin-bottom:20px;
}

.incoming h2{
  margin-top:5px;
}

.incomingButtons{
  display:flex;
  gap:10px;
  margin-top:15px;
}

.incomingButtons button{
  flex:1;
  border:0;
  border-radius:12px;
  padding:13px;
  color:white;
  font-size:15px;
}

.accept{
  background:#18a957;
}

.reject{
  background:#d83232;
}
</style>
</head>

<body>

<div class="header">
  <h1>🏠 Home Call</h1>
  <div class="status" id="status">🟢 Online</div>
</div>

<div class="container">

  <div class="incoming" id="incoming">

    <div style="font-size:45px">📞</div>

    <h2>Panggilan Masuk</h2>

    <p>Seseorang ingin menghubungi Avedo.</p>

    <div class="incomingButtons">

      <button class="accept" onclick="acceptCall()">
        ✅ Terima
      </button>

      <button class="reject" onclick="rejectCall()">
        ❌ Tolak
      </button>

    </div>

  </div>

  <div class="waiting" id="waiting">

    <div class="waitingIcon">📹</div>

    <h2>Menunggu Panggilan</h2>

    <p>Avedo siap menerima panggilan.</p>

  </div>

  <div id="callArea">

    <div class="videoBox">

      <video id="remoteVideo" autoplay playsinline></video>

      <div class="localBox">
        <video id="localVideo" autoplay muted playsinline></video>
      </div>

    </div>

    <div class="controls">

      <button class="controlBtn" onclick="toggleMirror()">
        ↔️ Balik Layar
      </button>

      <button class="controlBtn" onclick="toggleCamera()" id="camBtn">
        📹 Kamera
      </button>

      <button class="controlBtn end" onclick="endCall()">
        🔴 Akhiri
      </button>

    </div>

    <div class="chat">

      <div class="chatTitle">💬 Pesan</div>

      <div class="messages" id="messages"></div>

      <div class="emojiPanel" id="emojiPanel">

        <span onclick="addEmoji('😀')">😀</span>
        <span onclick="addEmoji('😂')">😂</span>
        <span onclick="addEmoji('😊')">😊</span>
        <span onclick="addEmoji('😍')">😍</span>
        <span onclick="addEmoji('👍')">👍</span>
        <span onclick="addEmoji('❤️')">❤️</span>
        <span onclick="addEmoji('🙏')">🙏</span>
        <span onclick="addEmoji('😎')">😎</span>
        <span onclick="addEmoji('😁')">😁</span>
        <span onclick="addEmoji('🎉')">🎉</span>
        <span onclick="addEmoji('👋')">👋</span>
        <span onclick="addEmoji('🏠')">🏠</span>

      </div>

      <div class="chatRow">

        <button class="emojiBtn" onclick="toggleEmoji()">
          😀
        </button>

        <input
          id="messageInput"
          placeholder="Pesan..."
          onkeydown="if(event.key==='Enter')sendMessage()"
        >

        <button class="sendBtn" onclick="sendMessage()">
          ➤
        </button>

      </div>

    </div>

  </div>

</div>

<script>

const OWNER_ID="homecall-owner-2026";

const peer=new Peer(OWNER_ID);

let incomingCall=null;
let currentCall=null;
let dataConnection=null;

let localStream=null;
let videoTrack=null;

let cameraOn=true;
let mirrored=false;

const localVideo=document.getElementById("localVideo");
const remoteVideo=document.getElementById("remoteVideo");
const statusEl=document.getElementById("status");

peer.on("open",async()=>{

  statusEl.textContent="🟢 Online";

  try{

    await getMedia();

  }catch(e){

    console.log(e);

    statusEl.textContent="🔴 Kamera tidak tersedia";

  }

});

async function getMedia(){

  localStream=await navigator.mediaDevices.getUserMedia({
    video:true,
    audio:false
  });

  videoTrack=localStream.getVideoTracks()[0];

  localVideo.srcObject=localStream;
}

peer.on("call",call=>{

  incomingCall=call;

  document.getElementById("incoming").style.display="block";
  document.getElementById("waiting").style.display="none";

});

function acceptCall(){

  if(!incomingCall)return;

  currentCall=incomingCall;
  incomingCall=null;

  document.getElementById("incoming").style.display="none";
  document.getElementById("callArea").style.display="block";

  currentCall.answer(localStream);

  currentCall.on("stream",stream=>{

    remoteVideo.srcObject=stream;

  });

  currentCall.on("close",()=>{

    endCall(false);

  });

}

function rejectCall(){

  if(incomingCall){

    incomingCall.close();
    incomingCall=null;

  }

  document.getElementById("incoming").style.display="none";
  document.getElementById("waiting").style.display="block";

}

peer.on("connection",connection=>{

  dataConnection=connection;

  connection.on("data",handleData);

});

function toggleMirror(){

  mirrored=!mirrored;

  localVideo.style.transform=
    mirrored ? "scaleX(-1)" : "scaleX(1)";

  if(dataConnection && dataConnection.open){

    dataConnection.send({
      type:"mirror",
      value:mirrored
    });

  }
}

function toggleCamera(){

  cameraOn=!cameraOn;

  if(videoTrack){
    videoTrack.enabled=cameraOn;
  }

  document.getElementById("camBtn").textContent=
    cameraOn ? "📹 Kamera" : "🚫 Kamera";
}

function endCall(sendMessage=true){

  if(
    sendMessage &&
    dataConnection &&
    dataConnection.open
  ){

    dataConnection.send({
      type:"peer-ended"
    });

  }

  if(currentCall){

    currentCall.close();
    currentCall=null;

  }

  if(localStream){

    localStream.getTracks().forEach(track=>{
      track.stop();
    });

    localStream=null;

  }

  remoteVideo.srcObject=null;
  localVideo.srcObject=null;

  document.getElementById("callArea").style.display="none";
  document.getElementById("waiting").style.display="block";

  cameraOn=true;
  mirrored=false;

  document.getElementById("camBtn").textContent="📹 Kamera";

}

function toggleEmoji(){

  const panel=document.getElementById("emojiPanel");

  panel.style.display=
    panel.style.display==="block"
    ? "none"
    : "block";

}

function addEmoji(emoji){

  const input=document.getElementById("messageInput");

  input.value+=emoji;
  input.focus();

}

function sendMessage(){

  const input=document.getElementById("messageInput");

  const text=input.value.trim();

  if(!text)return;

  if(dataConnection && dataConnection.open){

    dataConnection.send({
      type:"chat",
      message:text
    });

    addMessage("Avedo",text,true);

    input.value="";

  }

}

function addMessage(name,text,mine){

  const box=document.getElementById("messages");

  const div=document.createElement("div");

  div.className="msg"+(mine ? " mine":"");

  div.innerHTML=
    '<div class="msgName">'+
    escapeHtml(name)+
    '</div>'+
    escapeHtml(text);

  box.appendChild(div);

  box.scrollTop=box.scrollHeight;

}

function escapeHtml(text){

  const div=document.createElement("div");

  div.textContent=text;

  return div.innerHTML;

}

function handleData(data){

  if(data.type==="chat"){

    addMessage("Penelepon",data.message,false);

  }

  if(data.type==="mirror"){

    remoteVideo.style.transform=
      data.value ? "scaleX(-1)" : "scaleX(1)";

  }

  if(data.type==="peer-ended"){

    endCall(false);

  }

}

</script>

</body>
</html>
