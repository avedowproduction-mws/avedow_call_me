<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Home Call - Owner</title>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #080b12;
    color: white;
}

.app {
    width: 100%;
    max-width: 500px;
    margin: auto;
    padding: 18px;
}

.top {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 21px;
    font-weight: bold;
}

.online {
    color: #19c37d;
    font-size: 14px;
}

#status {
    text-align: center;
    color: #8b9bb4;
    margin: 12px 0;
}

#enableAlertsBtn {
    display: block;
    margin: 10px auto 18px;

    border: 0;
    border-radius: 12px;

    padding: 12px 17px;

    background: #2563eb;
    color: white;

    font-weight: bold;
}

#enableAlertsBtn.active {
    background: #19c37d;
}

/* INCOMING */

#incoming {
    display: none;

    background: #111722;

    border-radius: 20px;

    padding: 22px;

    text-align: center;

    border: 1px solid #202a3b;
}

.incomingIcon {
    font-size: 48px;

    animation: ring 1s infinite;
}

@keyframes ring {

    0% {
        transform: rotate(0);
    }

    25% {
        transform: rotate(-12deg);
    }

    50% {
        transform: rotate(12deg);
    }

    75% {
        transform: rotate(-12deg);
    }

    100% {
        transform: rotate(0);
    }

}

.accept,
.reject,
.endBtn {
    border: 0;

    border-radius: 14px;

    padding: 14px 20px;

    color: white;

    font-weight: bold;
}

.accept {
    background: #19c37d;
}

.reject,
.endBtn {
    background: #e5484d;
}

/* CALL */

#callArea {
    display: none;
}

.videoBox {
    position: relative;

    width: 100%;

    background: black;

    border-radius: 20px;

    overflow: hidden;
}

#remoteVideo {
    width: 100%;

    height: 65vh;

    min-height: 350px;

    object-fit: cover;

    background: black;

    transition: transform .2s;
}

#localVideo {
    position: absolute;

    right: 12px;
    bottom: 12px;

    width: 115px;
    height: 155px;

    object-fit: cover;

    background: #111;

    border: 2px solid white;

    border-radius: 14px;

    transition: transform .2s;
}

.remoteState {
    display: none;

    position: absolute;

    left: 12px;
    top: 12px;

    background: rgba(0,0,0,.7);

    padding: 7px 10px;

    border-radius: 10px;

    font-size: 13px;
}

.callStatus {
    text-align: center;

    color: #8b9bb4;

    font-size: 13px;

    margin: 10px;
}

/* CONTROLS */

.controls {
    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 10px;
}

.control {
    border: 0;

    border-radius: 15px;

    padding: 14px 5px;

    background: #1a2230;

    color: white;

    font-size: 13px;
}

.control.active {
    background: #2563eb;
}

.control.off {
    background: #e5484d;
}

.control .icon {
    display: block;

    font-size: 22px;

    margin-bottom: 4px;
}

.endBtn {
    width: 100%;

    margin-top: 10px;

    font-size: 16px;
}

/* CHAT */

.chat {
    margin-top: 12px;

    background: #111722;

    border-radius: 18px;

    overflow: hidden;
}

.chatHeader {
    padding: 12px;

    border-bottom:
        1px solid #263044;

    font-weight: bold;
}

.messages {
    height: 190px;

    overflow-y: auto;

    padding: 12px;
}

.message {
    max-width: 78%;

    padding: 9px 12px;

    margin-bottom: 8px;

    border-radius: 14px;

    font-size: 14px;

    line-height: 1.4;

    word-wrap: break-word;
}

.message.me {
    margin-left: auto;

    background: #2563eb;

    border-bottom-right-radius: 4px;
}

.message.other {
    margin-right: auto;

    background: #263044;

    border-bottom-left-radius: 4px;
}

.chatInput {
    display: flex;

    gap: 6px;

    padding: 8px;

    border-top:
        1px solid #263044;
}

.chatInput input {
    flex: 1;

    min-width: 0;

    border: 0;
    outline: none;

    background: #1a2230;

    color: white;

    border-radius: 12px;

    padding: 12px;
}

.chatInput button {
    width: 44px;

    border: 0;

    border-radius: 12px;

    background: #2563eb;

    color: white;

    font-size: 18px;
}

#message {
    text-align: center;

    color: #8b9bb4;

    font-size: 13px;

    margin: 10px;

    min-height: 20px;
}

</style>
</head>

<body>

<div class="app">

    <div class="top">

        <div class="logo">
            Home Call
        </div>

        <div class="online">
            🟢 Owner
        </div>

    </div>


    <div id="status">
        Menghubungkan ke server...
    </div>


    <button id="enableAlertsBtn">
        🔔 Aktifkan Notifikasi & Dering
    </button>


    <!-- INCOMING -->

    <div id="incoming">

        <div class="incomingIcon">
            📞
        </div>

        <h2>
            Panggilan Masuk
        </h2>

        <p>
            Seseorang sedang menelepon.
        </p>

        <button
            class="accept"
            id="acceptBtn">

            ✅ Terima Panggilan

        </button>

        <button
            class="reject"
            id="rejectBtn">

            ❌ Tolak

        </button>

    </div>


    <!-- CALL -->

    <div id="callArea">

        <div class="videoBox">

            <video
                id="remoteVideo"
                autoplay
                playsinline>
            </video>

            <video
                id="localVideo"
                autoplay
                muted
                playsinline>
            </video>

            <div
                class="remoteState"
                id="remoteState">
            </div>

        </div>


        <div class="callStatus"
             id="callStatus">

            Terhubung

        </div>


        <div class="controls">

            <button
                class="control active"
                id="micBtn">

                <span class="icon">
                    🎙️
                </span>

                Mic

            </button>


            <button
                class="control active"
                id="cameraBtn">

                <span class="icon">
                    📹
                </span>

                Kamera

            </button>


            <button
                class="control"
                id="mirrorBtn">

                <span class="icon">
                    🔄
                </span>

                Mirror

            </button>

        </div>


        <button
            class="endBtn"
            id="endBtn">

            🔴 Akhiri Panggilan

        </button>


        <!-- CHAT -->

        <div class="chat">

            <div class="chatHeader">
                💬 Pesan
            </div>

            <div
                class="messages"
                id="messages">
            </div>

            <div class="chatInput">

                <input
                    id="chatText"
                    type="text"
                    placeholder="Tulis pesan...">

                <button
                    id="emojiBtn">
                    😊
                </button>

                <button
                    id="sendBtn">
                    ➤
                </button>

            </div>

        </div>

    </div>


    <div id="message"></div>

</div>


<script>

/* =====================================================
   CONFIG
===================================================== */

const OWNER_ID =
    "homecall-owner-2026";


const PEER_OPTIONS = {

    host: "0.peerjs.com",

    port: 443,

    path: "/",

    secure: true,

    debug: 2,

    config: {

        iceServers: [

            {
                urls:
                    "stun:stun.l.google.com:19302"
            }

        ]

    }

};


/* =====================================================
   VARIABLES
===================================================== */

let peer = null;

let incomingCall = null;

let activeCall = null;

let dataConn = null;

let localStream = null;

let audioTrack = null;

let videoTrack = null;

let micOn = true;

let cameraOn = true;

let mirrorOn = false;

let audioContext = null;

let audioUnlocked = false;

let ringtoneTimer = null;

let callNotification = null;


/* =====================================================
   ELEMENTS
===================================================== */

const status =
    document.getElementById("status");

const incoming =
    document.getElementById("incoming");

const acceptBtn =
    document.getElementById("acceptBtn");

const rejectBtn =
    document.getElementById("rejectBtn");

const callArea =
    document.getElementById("callArea");

const remoteVideo =
    document.getElementById("remoteVideo");

const localVideo =
    document.getElementById("localVideo");

const micBtn =
    document.getElementById("micBtn");

const cameraBtn =
    document.getElementById("cameraBtn");

const mirrorBtn =
    document.getElementById("mirrorBtn");

const endBtn =
    document.getElementById("endBtn");

const remoteState =
    document.getElementById("remoteState");

const callStatus =
    document.getElementById("callStatus");

const message =
    document.getElementById("message");

const enableAlertsBtn =
    document.getElementById(
        "enableAlertsBtn"
    );

const messages =
    document.getElementById(
        "messages"
    );

const chatText =
    document.getElementById(
        "chatText"
    );

const sendBtn =
    document.getElementById(
        "sendBtn"
    );

const emojiBtn =
    document.getElementById(
        "emojiBtn"
    );


/* =====================================================
   PEER
===================================================== */

peer =
    new Peer(
        OWNER_ID,
        PEER_OPTIONS
    );


peer.on(
    "open",
    function(id) {

        status.innerText =
            "🟢 Owner online — siap menerima panggilan";

        console.log(
            "Owner online:",
            id
        );

    }
);


/* =====================================================
   DATA CONNECTION
===================================================== */

peer.on(
    "connection",
    function(conn) {

        console.log(
            "Data connection masuk"
        );

        dataConn =
            conn;

        setupDataConnection(
            conn
        );

    }
);


/* =====================================================
   SETUP DATA
===================================================== */

function setupDataConnection(conn) {

    conn.on(
        "open",
        function() {

            console.log(
                "💬 Data connection terbuka"
            );

        }
    );


    conn.on(
        "data",
        function(data) {

            handleData(
                data
            );

        }
    );


    conn.on(
        "close",
        function() {

            console.log(
                "Data connection ditutup"
            );

        }
    );

}


/* =====================================================
   HANDLE DATA
===================================================== */

function handleData(data) {

    if (!data) {
        return;
    }


    if (
        data.type ===
        "chat"
    ) {

        addMessage(
            data.text,
            "other"
        );

        return;

    }


    if (
        data.type ===
        "mic"
    ) {

        showRemoteMic(
            data.enabled
        );

        return;

    }


    if (
        data.type ===
        "camera"
    ) {

        showRemoteCamera(
            data.enabled
        );

        return;

    }


    if (
        data.type ===
        "mirror"
    ) {

        remoteVideo.style.transform =
            data.enabled
                ? "scaleX(-1)"
                : "scaleX(1)";

        return;

    }

}


/* =====================================================
   INCOMING CALL
===================================================== */

peer.on(
    "call",
    function(call) {

        console.log(
            "📞 Panggilan masuk:",
            call.peer
        );


        incomingCall =
            call;


        incoming.style.display =
            "block";


        status.innerText =
            "📞 Ada panggilan masuk";


        startRingtone();

        showCallNotification();


        call.on(
            "close",
            function() {

                stopRingtone();

                closeCallNotification();

                incoming.style.display =
                    "none";

            }
        );

    }
);


/* =====================================================
   ACCEPT
===================================================== */

acceptBtn.onclick =
    async function() {

        if (!incomingCall) {
            return;
        }


        stopRingtone();

        closeCallNotification();


        try {

            localStream =
                await navigator
                    .mediaDevices
                    .getUserMedia({

                        video: true,

                        audio: true

                    });


            audioTrack =
                localStream
                    .getAudioTracks()[0];


            videoTrack =
                localStream
                    .getVideoTracks()[0];


            micOn = true;

            cameraOn = true;


            localVideo.srcObject =
                localStream;


            await localVideo
                .play()
                .catch(
                    function() {}
                );


            incomingCall.answer(
                localStream
            );


            activeCall =
                incomingCall;


            incomingCall =
                null;


            incoming.style.display =
                "none";


            callArea.style.display =
                "block";


            status.innerText =
                "🟢 Terhubung";


            callStatus.innerText =
                "🟢 Terhubung";


            activeCall.on(
                "stream",
                function(stream) {

                    remoteVideo.srcObject =
                        stream;

                    remoteVideo
                        .play()
                        .catch(
                            function() {}
                        );

                }
            );


            activeCall.on(
                "close",
                function() {

                    endCall();

                }
            );


            activeCall.on(
                "error",
                function(error) {

                    console.error(
                        error
                    );

                    message.innerText =
                        "❌ Koneksi video gagal.";

                }
            );

        }
        catch(error) {

            console.error(
                error
            );

            message.innerText =
                "❌ Kamera/mikrofon gagal: " +
                error.message;

        }

    };


/* =====================================================
   MIC
===================================================== */

micBtn.onclick =
    function() {

        if (!audioTrack) {
            return;
        }


        micOn =
            !micOn;


        audioTrack.enabled =
            micOn;


        micBtn.classList.toggle(
            "active",
            micOn
        );

        micBtn.classList.toggle(
            "off",
            !micOn
        );


        micBtn.innerHTML =
            micOn
                ? "🎙️<br>Mic"
                : "🔇<br>Mic";


        sendData({

            type: "mic",

            enabled: micOn

        });

    };


/* =====================================================
   CAMERA
===================================================== */

cameraBtn.onclick =
    function() {

        if (!videoTrack) {
            return;
        }


        cameraOn =
            !cameraOn;


        videoTrack.enabled =
            cameraOn;


        cameraBtn.classList.toggle(
            "active",
            cameraOn
        );

        cameraBtn.classList.toggle(
            "off",
            !cameraOn
        );


        cameraBtn.innerHTML =
            cameraOn
                ? "📹<br>Kamera"
                : "🚫<br>Kamera";


        sendData({

            type: "camera",

            enabled: cameraOn

        });

    };


/* =====================================================
   MIRROR
===================================================== */

mirrorBtn.onclick =
    function() {

        mirrorOn =
            !mirrorOn;


        localVideo.style.transform =
            mirrorOn
                ? "scaleX(-1)"
                : "scaleX(1)";


        mirrorBtn.classList.toggle(
            "active",
            mirrorOn
        );


        sendData({

            type: "mirror",

            enabled: mirrorOn

        });

    };


/* =====================================================
   REMOTE MIC
===================================================== */

function showRemoteMic(enabled) {

    remoteState.style.display =
        "block";


    if (enabled) {

        remoteState.innerText =
            "🎙️ Mikrofon aktif";

        setTimeout(
            function() {

                remoteState.style.display =
                    "none";

            },
            1500
        );

    }
    else {

        remoteState.innerText =
            "🔇 Mikrofon dimatikan";

    }

}


/* =====================================================
   REMOTE CAMERA
===================================================== */

function showRemoteCamera(enabled) {

    remoteState.style.display =
        "block";


    if (enabled) {

        remoteState.innerText =
            "📹 Kamera aktif";

        setTimeout(
            function() {

                remoteState.style.display =
                    "none";

            },
            1500
        );

    }
    else {

        remoteState.innerText =
            "📷 Kamera dimatikan";

    }

}


/* =====================================================
   SEND DATA
===================================================== */

function sendData(data) {

    if (
        dataConn &&
        dataConn.open
    ) {

        dataConn.send(
            data
        );

    }

}


/* =====================================================
   CHAT
===================================================== */

function sendMessage() {

    const text =
        chatText.value.trim();


    if (!text) {
        return;
    }


    addMessage(
        text,
        "me"
    );


    sendData({

        type: "chat",

        text: text

    });


    chatText.value =
        "";

}


sendBtn.onclick =
    sendMessage;


chatText.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key ===
            "Enter"
        ) {

            sendMessage();

        }

    }
);


emojiBtn.onclick =
    function() {

        chatText.value +=
            "😊";

        chatText.focus();

    };


function addMessage(
    text,
    side
) {

    const div =
        document.createElement(
            "div"
        );


    div.className =
        "message " +
        side;


    div.textContent =
        text;


    messages.appendChild(
        div
    );


    messages.scrollTop =
        messages.scrollHeight;

}


/* =====================================================
   ALERT / RINGTONE
===================================================== */

enableAlertsBtn.onclick =
    async function() {

        try {

            audioContext =
                audioContext ||
                new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();


            if (
                audioContext.state ===
                "s
