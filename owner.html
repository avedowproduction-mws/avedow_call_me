<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Home Call - Owner</title>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    background:#080b12;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
}

.app{
    width:100%;
    max-width:500px;
    margin:auto;
    padding:18px;
}

.top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.logo{
    font-size:24px;
    font-weight:bold;
}

.online{
    background:#102b1b;
    color:#42e27b;
    padding:8px 12px;
    border-radius:20px;
    font-size:13px;
}

.card{
    background:#111722;
    border:1px solid #202938;
    border-radius:24px;
    padding:20px;
    margin-top:15px;
}

.card h2{
    margin-top:0;
}

.info{
    color:#9ea7b7;
    line-height:1.6;
}

.notifyBtn{
    width:100%;
    padding:14px;
    border:0;
    border-radius:14px;
    background:#1677ff;
    color:white;
    font-weight:bold;
    margin-top:12px;
    cursor:pointer;
}

.incoming{
    display:none;
    background:#182235;
    border:1px solid #2c3c56;
    border-radius:20px;
    padding:18px;
    margin-top:15px;
    text-align:center;
}

.incomingIcon{
    font-size:50px;
}

.accept,
.reject{
    width:100%;
    border:0;
    padding:14px;
    border-radius:14px;
    margin-top:10px;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

.accept{
    background:#19a85b;
}

.reject{
    background:#ef3340;
}

#callScreen{
    display:none;
}

.videoBox{
    position:relative;
    width:100%;
    background:#000;
    border-radius:20px;
    overflow:hidden;
    aspect-ratio:9/16;
    max-height:70vh;
}

#remoteVideo{
    width:100%;
    height:100%;
    object-fit:cover;
}

#localVideo{
    position:absolute;
    width:105px;
    height:150px;
    right:12px;
    bottom:12px;
    object-fit:cover;
    border-radius:14px;
    border:2px solid white;
    background:#111;
}

.remoteStatus{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    background:rgba(0,0,0,.75);
    padding:12px 18px;
    border-radius:14px;
    display:none;
    text-align:center;
}

.controls{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-top:14px;
}

.control{
    background:#1a2230;
    color:white;
    border:0;
    border-radius:15px;
    padding:13px 5px;
    font-size:13px;
    font-weight:bold;
    cursor:pointer;
}

.control.active{
    background:#26364d;
}

.end{
    width:100%;
    margin-top:12px;
    padding:15px;
    border-radius:15px;
    background:#ef3340;
    color:white;
    font-size:15px;
    border:0;
    font-weight:bold;
}

.chat{
    margin-top:15px;
    background:#111722;
    border-radius:18px;
    padding:12px;
}

.messages{
    max-height:190px;
    overflow-y:auto;
}

.msg{
    margin:7px 0;
    padding:9px 12px;
    border-radius:13px;
    max-width:80%;
    word-wrap:break-word;
}

.mine{
    background:#1677ff;
    margin-left:auto;
}

.theirs{
    background:#252d3b;
}

.chatInput{
    display:flex;
    gap:6px;
    margin-top:8px;
}

.chatInput input{
    flex:1;
    min-width:0;
    padding:12px;
    border:0;
    border-radius:12px;
    background:#202938;
    color:white;
    outline:none;
}

.chatInput button{
    padding:0 12px;
    border:0;
    border-radius:12px;
    background:#1677ff;
    color:white;
}

.emoji{
    background:#202938!important;
}

.footer{
    text-align:center;
    color:#687181;
    font-size:12px;
    margin:25px 0 5px;
}
</style>
</head>

<body>

<div class="app">

    <div class="top">

        <div class="logo">
            Home Call
        </div>

        <div
            class="online"
            id="onlineStatus"
        >
            🟡 Menghubungkan...
        </div>

    </div>


    <div class="card">

        <h2>🏠 Owner</h2>

        <div
            class="info"
            id="serverText"
        >
            Menghubungkan ke server...
        </div>

        <button
            class="notifyBtn"
            onclick="enableNotifications()"
        >
            🔔 Aktifkan Notifikasi & Dering
        </button>

    </div>


    <div
        class="incoming"
        id="incomingBox"
    >

        <div class="incomingIcon">
            📞
        </div>

        <h2>Panggilan Masuk</h2>

        <p>
            Seseorang sedang mencoba
            menghubungi Anda.
        </p>

        <button
            class="accept"
            onclick="acceptCall()"
        >
            ✅ Terima Panggilan
        </button>

        <button
            class="reject"
            onclick="rejectCall()"
        >
            ❌ Tolak
        </button>

    </div>


    <div id="callScreen">

        <div class="card">

            <h2>🎥 Video Call</h2>

            <div class="videoBox">

                <video
                    id="remoteVideo"
                    autoplay
                    playsinline
                ></video>

                <video
                    id="localVideo"
                    autoplay
                    muted
                    playsinline
                ></video>

                <div
                    class="remoteStatus"
                    id="remoteStatus"
                ></div>

            </div>


            <div class="controls">

                <button
                    class="control active"
                    id="micBtn"
                    onclick="toggleMic()"
                >
                    🎙️ Mic ON
                </button>

                <button
                    class="control active"
                    id="cameraBtn"
                    onclick="toggleCamera()"
                >
                    📹 Kamera ON
                </button>

                <button
                    class="control"
                    id="mirrorBtn"
                    onclick="toggleMirror()"
                >
                    🔄 Mirror
                </button>

            </div>


            <button
                class="end"
                onclick="endCall()"
            >
                🔴 Akhiri Panggilan
            </button>

        </div>


        <div class="chat">

            <div
                class="messages"
                id="messages"
            ></div>

            <div class="chatInput">

                <button
                    class="emoji"
                    onclick="addEmoji('😊')"
                >
                    😊
                </button>

                <input
                    id="chatText"
                    type="text"
                    placeholder="Ketik pesan..."
                    onkeydown="if(event.key==='Enter') sendMessage()"
                >

                <button onclick="sendMessage()">
                    ➤
                </button>

            </div>

        </div>

    </div>


    <div class="footer">
        Home Call • Video Communication
    </div>

</div>


<script>

const OWNER_ID =
    "homecall-owner-2026";

let peer;

let incomingCall = null;
let activeCall = null;
let dataConn = null;

let localStream = null;

let micEnabled = true;
let cameraEnabled = true;
let mirrorEnabled = false;

let ringtoneInterval = null;
let audioContext = null;


// =====================================================
// PEERJS
// =====================================================

// Tidak lagi menentukan host/path/secure manual.
// PeerJS akan memakai PeerJS Cloud.

peer = new Peer(
    OWNER_ID,
    {
        debug:2,

        config:{
            iceServers:[
                {
                    urls:"stun:stun.l.google.com:19302"
                }
            ]
        }
    }
);


peer.on("open", function(id){

    console.log(
        "OWNER ONLINE:",
        id
    );

    document.getElementById(
        "onlineStatus"
    ).textContent =
        "🟢 Owner Online";

    document.getElementById(
        "serverText"
    ).textContent =
        "Terhubung ke server. Siap menerima panggilan.";

});


peer.on("disconnected", function(){

    document.getElementById(
        "onlineStatus"
    ).textContent =
        "🟠 Terputus";

    document.getElementById(
        "serverText"
    ).textContent =
        "Koneksi terputus. Mencoba menghubungkan kembali...";

    setTimeout(function(){

        if(peer.disconnected){

            peer.reconnect();

        }

    },1500);

});


peer.on("error", function(err){

    console.error(
        "PeerJS ERROR:",
        err
    );

    document.getElementById(
        "onlineStatus"
    ).textContent =
        "🔴 Error";

    let text =
        "Gagal terhubung ke server.";

    if(err.type === "unavailable-id"){

        text =
            "ID Owner sedang digunakan. Tutup halaman Owner lain.";

    }

    else if(err.type === "network"){

        text =
            "Jaringan bermasalah.";

    }

    else if(err.type === "server-error"){

        text =
            "Server PeerJS tidak dapat dihubungi.";

    }

    document.getElementById(
        "serverText"
    ).textContent =
        text;

});


peer.on("close", function(){

    document.getElementById(
        "onlineStatus"
    ).textContent =
        "🔴 Offline";

});


// =====================================================
// DATA CONNECTION
// =====================================================

peer.on(
    "connection",
    function(conn){

        console.log(
            "Data connection masuk"
        );

        dataConn = conn;

        setupDataConnection(conn);

    }
);


function setupDataConnection(conn){

    conn.on("open", function(){

        console.log(
            "Data channel OWNER terbuka"
        );

        sendState();

    });


    conn.on("data", function(data){

        if(!data) return;


        if(data.type === "chat"){

            addMessage(
                data.text,
                false
            );

        }


        if(data.type === "mic"){

            showRemoteStatus(
                data.enabled
                ? ""
                : "🎙️ Mikrofon dimatikan"
            );

        }


        if(data.type === "camera"){

            showRemoteStatus(
                data.enabled
                ? ""
                : "📷 Kamera dimatikan"
            );

        }


        if(data.type === "mirror"){

            document.getElementById(
                "remoteVideo"
            ).style.transform =
                data.enabled
                ? "scaleX(-1)"
                : "scaleX(1)";

        }

    });


    conn.on("close", function(){

        console.log(
            "Data connection ditutup"
        );

    });

}


// =====================================================
// PANGGILAN MASUK
// =====================================================

peer.on(
    "call",
    function(call){

        console.log(
            "Panggilan masuk:",
            call.peer
        );

        incomingCall = call;

        document.getElementById(
            "incomingBox"
        ).style.display =
            "block";

        startRingtone();

        showNotification();

    }
);


// =====================================================
// TERIMA
// =====================================================

async function acceptCall(){

    if(!incomingCall) return;

    stopRingtone();

    document.getElementById(
        "incomingBox"
    ).style.display =
        "none";

    try{

        localStream =
            await navigator.mediaDevices.getUserMedia({
                video:true,
                audio:true
            });

        document.getElementById(
            "localVideo"
        ).srcObject =
            localStream;


        activeCall =
            incomingCall;

        incomingCall = null;


        activeCall.answer(
            localStream
        );


        activeCall.on(
            "stream",
            function(remoteStream){

                document.getElementById(
                    "remoteVideo"
                ).srcObject =
                    remoteStream;

                document.getElementById(
                    "callScreen"
                ).style.display =
                    "block";

            }
        );


        activeCall.on(
            "close",
            function(){

                endCall();

            }
        );


        activeCall.on(
            "error",
            function(err){

                console.error(err);

                alert(
                    "Panggilan mengalami masalah."
                );

                endCall();

            }
        );

    }

    catch(error){

        console.error(error);

        alert(
            "Kamera/mikrofon tidak bisa digunakan.\n\n" +
            "Berikan izin kamera dan mikrofon pada browser."
        );

        if(activeCall){

            try{
                activeCall.close();
            }catch(e){}

        }

    }

}


// =====================================================
// TOLAK
// =====================================================

function rejectCall(){

    stopRingtone();

    if(incomingCall){

        try{
            incomingCall.close();
        }catch(e){}

    }

    incomingCall = null;

    document.getElementById(
        "incomingBox"
    ).style.display =
        "none";

}


// =====================================================
// MIC
// =====================================================

function toggleMic(){

    if(!localStream) return;

    const track =
        localStream.getAudioTracks()[0];

    if(!track) return;

    micEnabled =
        !micEnabled;

    track.enabled =
        micEnabled;

    const btn =
        document.getElementById(
            "micBtn"
        );

    btn.textContent =
        micEnabled
        ? "🎙️ Mic ON"
        : "🔇 Mic OFF";

    btn.classList.toggle(
        "active",
        micEnabled
    );


    sendData({
        type:"mic",
        enabled:micEnabled
    });

}


// =====================================================
// CAMERA
// =====================================================

function toggleCamera(){

    if(!localStream) return;

    const track =
        localStream.getVideoTracks()[0];

    if(!track) return;

    cameraEnabled =
        !cameraEnabled;

    track.enabled =
        cameraEnabled;

    const btn =
        document.getElementById(
            "cameraBtn"
        );

    btn.textContent =
        cameraEnabled
        ? "📹 Kamera ON"
        : "📷 Kamera OFF";

    btn.classList.toggle(
        "active",
        cameraEnabled
    );


    sendData({
        type:"camera",
        enabled:cameraEnabled
    });

}


// =====================================================
// MIRROR
// =====================================================

function toggleMirror(){

    mirrorEnabled =
        !mirrorEnabled;

    document.getElementById(
        "localVideo"
    ).style.transform =
        mirrorEnabled
        ? "scaleX(-1)"
        : "scaleX(1)";


    document.getElementById(
        "mirrorBtn"
    ).classList.toggle(
        "active",
        mirrorEnabled
    );


    sendData({
        type:"mirror",
        enabled:mirrorEnabled
    });

}


// =====================================================
// DATA
// =====================================================

function sendData(data){

    if(
        dataConn &&
        dataConn.open
    ){

        dataConn.send(data);

    }

}


function sendState(){

    sendData({
        type:"mic",
        enabled:micEnabled
    });

    sendData({
        type:"camera",
        enabled:cameraEnabled
    });

    sendData({
        type:"mirror",
        enabled:mirrorEnabled
    });

}


// =====================================================
// CHAT
// =====================================================

function sendMessage(){

    const input =
        document.getElementById(
            "chatText"
        );

    const text =
        input.value.trim();

    if(!text) return;

    addMessage(
        text,
        true
    );

    sendData({
        type:"chat",
        text:text
    });

    input.value = "";

}


function addMessage(
    text,
    mine
){

    const box =
        document.getElementById(
            "messages"
        );

    const div =
        document.createElement(
            "div"
        );

    div.className =
        "msg " +
        (mine
        ? "mine"
        : "theirs");

    div.textContent =
        text;

    box.appendChild(div);

    box.scrollTop =
        box.scrollHeight;

}


function addEmoji(emoji){

    const input =
        document.getElementById(
            "chatText"
        );

    input.value += emoji;

    input.focus();

}


// =====================================================
// STATUS VIDEO
// =====================================================

function showRemoteStatus(text){

    const status =
        document.getElementById(
            "remoteStatus"
        );

    if(!text){

        status.style.display =
            "none";

        return;

    }

    status.textContent =
        text;

    status.style.display =
        "block";

}


// =====================================================
// NOTIFIKASI
// =====================================================

async function enableNotifications(){

    try{

        if(
            "Notification"
            in window
        ){

            const permission =
                await Notification.requestPermission();

            console.log(
                "Notification:",
                permission
            );

        }

        startAudio();

        alert(
            "Notifikasi dan dering sudah diaktifkan."
        );

    }

    catch(error){

        console.error(error);

    }

}


function showNotification(){

    if(
        "Notification"
        in window &&
        Notification.permission === "granted"
    ){

        try{

            new Notification(
                "Home Call",
                {
                    body:
                    "📞 Ada panggilan video masuk!"
                }
            );

        }

        catch(error){

            console.log(error);

        }

    }

}


// =====================================================
// DERING
// =====================================================

function startAudio(){

    if(!audioContext){

        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

    }

    if(
        audioContext.state ===
        "suspended"
    ){

        audioContext.resume();

    }

}


function beep(){

    if(!audioContext)
        return;

    if(
        audioContext.state ===
        "suspended"
    ){

        audioContext.resume();

    }

    const oscillator =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();

    oscillator.frequency.value =
        700;

    oscillator.type =
        "sine";

    gain.gain.value =
        0.08;

    oscillator.connect(gain);

    gain.connect(
        audioContext.destination
    );

    oscillator.start();

    oscillator.stop(
        audioContext.currentTime + 0.35
    );

}


function startRingtone(){

    stopRingtone();

    startAudio();

    beep();

    ringtoneInterval =
        setInterval(
            beep,
            1200
        );

}


function stopRingtone(){

    if(ringtoneInterval){

        clearInterval(
            ringtoneInterval
        );

        ringtoneInterval =
            null;

    }

}


// =====================================================
// AKHIRI PANGGILAN
// =====================================================

function endCall(){

    stopRingtone();

    if(activeCall){

        try{
            activeCall.close();
