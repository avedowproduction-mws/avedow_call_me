<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>HOMEKALL OWNER</title>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #080b12;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  text-align: center;
  padding: 22px;
}

h1 {
  margin: 0;
}

.status {
  margin-top: 8px;
  color: #8b93a7;
}

#incoming {
  display: none;
  max-width: 450px;
  margin: 20px auto;
  padding: 25px;
  background: #151c2b;
  border-radius: 18px;
  text-align: center;
}

button {
  border: 0;
  border-radius: 12px;
  padding: 13px 18px;
  margin: 5px;
  font-weight: bold;
  font-size: 14px;
}

.accept {
  background: #16a34a;
  color: white;
}

.reject,
.danger {
  background: #dc2626;
  color: white;
}

#callArea {
  display: none;
  max-width: 700px;
  margin: auto;
  padding: 15px;
}

.videoBox {
  position: relative;
}

#remoteVideo {
  width: 100%;
  min-height: 300px;
  background: black;
  border-radius: 18px;
  object-fit: cover;
}

#localVideo {
  position: absolute;
  right: 12px;
  bottom: 12px;
  width: 120px;
  height: 165px;
  object-fit: cover;
  background: #111;
  border: 2px solid white;
  border-radius: 12px;
}

.controls {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 9px;
  margin-top: 15px;
}

.controls button {
  margin: 0;
  background: #182131;
  color: white;
}

.chat {
  margin-top: 15px;
  padding: 12px;
  background: #111722;
  border-radius: 15px;
}

#messages {
  height: 140px;
  overflow-y: auto;
}

.message {
  background: #202938;
  padding: 8px;
  margin: 5px 0;
  border-radius: 10px;
  font-size: 14px;
}

.message.me {
  background: #2563eb;
  text-align: right;
}

.chatInput {
  display: flex;
  gap: 8px;
  margin-top: 10px;
}

.chatInput input {
  flex: 1;
  padding: 12px;
  border: 0;
  border-radius: 10px;
  outline: none;
}

.chatInput button {
  background: #2563eb;
  color: white;
}

#message {
  text-align: center;
  color: #8b93a7;
  margin: 15px;
}

</style>

</head>

<body>

<header>

<h1>🏠 HOMEKALL OWNER</h1>

<div class="status" id="status">
🟡 Menghubungkan...
</div>

</header>


<div id="incoming">

<h2>📞 Panggilan Masuk</h2>

<p>Ada seseorang yang sedang menelepon.</p>

<button
class="accept"
id="acceptBtn">
✅ Terima
</button>

<button
class="reject"
id="rejectBtn">
❌ Tolak
</button>

</div>


<div id="message"></div>


<div id="callArea">

<div class="videoBox">

<video
id="remoteVideo"
autoplay
playsinline>
</video>

<video
id="localVideo"
autoplay
muted
playsinline>
</video>

</div>


<div class="controls">

<button onclick="switchCamera()">
🔄 Ganti Kamera
</button>

<button onclick="toggleMirror()"
        id="mirrorBtn">
↔️ Balik Layar
</button>

<button onclick="toggleMic()"
        id="micBtn">
🎙️ Mic ON
</button>

<button onclick="toggleCamera()"
        id="videoBtn">
📹 Kamera ON
</button>

<button onclick="sendMessage()">
💬 Kirim
</button>

<button onclick="endCall()"
        class="danger">
🔴 Akhiri
</button>

</div>


<div class="chat">

<div id="messages"></div>

<div class="chatInput">

<input
id="messageInput"
type="text"
placeholder="Ketik pesan..."
onkeydown="if(event.key==='Enter') sendMessage()">

<button onclick="sendMessage()">
Kirim
</button>

</div>

</div>

</div>


<script>

const OWNER_ID =
"homecall-owner-2026";

let peer = null;
let incomingCall = null;
let currentCall = null;

let dataConnection = null;

let localStream = null;
let currentVideoTrack = null;
let currentCameraId = null;

let mirrored = false;
let micEnabled = true;
let cameraEnabled = true;


const status =
document.getElementById("status");

const incoming =
document.getElementById("incoming");

const callArea =
document.getElementById("callArea");

const message =
document.getElementById("message");

const remoteVideo =
document.getElementById("remoteVideo");

const localVideo =
document.getElementById("localVideo");


/* =========================
   PEER OWNER
========================= */

peer = new Peer(
  OWNER_ID,
  {
    debug: 2,

    config: {
      iceServers: [
        {
          urls:
          "stun:stun.l.google.com:19302"
        }
      ]
    }
  }
);


peer.on("open", function() {

  status.textContent =
    "🟢 Owner online — menunggu panggilan";

});


/* =========================
   PANGGILAN MASUK
========================= */

peer.on("call", function(call) {

  incomingCall = call;

  incoming.style.display =
    "block";

  status.textContent =
    "📞 Ada panggilan masuk";

});


/* =========================
   DATA MASUK
========================= */

peer.on("connection", function(conn) {

  dataConnection = conn;


  conn.on("open", function() {

    console.log(
      "Koneksi data terbuka"
    );

  });


  conn.on("data", function(data) {

    receiveData(data);

  });

});


/* =========================
   TERIMA PANGGILAN
========================= */

document.getElementById("acceptBtn").onclick =
async function() {

  if (!incomingCall)
    return;


  try {

    localStream =
      await navigator.mediaDevices
      .getUserMedia({

        video: true,
        audio: true

      });


    currentVideoTrack =
      localStream.getVideoTracks()[0];


    if (currentVideoTrack) {

      const settings =
        currentVideoTrack.getSettings();

      currentCameraId =
        settings.deviceId || null;

    }


    localVideo.srcObject =
      localStream;


    currentCall =
      incomingCall;


    currentCall.answer(
      localStream
    );


    incoming.style.display =
      "none";

    callArea.style.display =
      "block";

    status.textContent =
      "🟢 Terhubung";


    currentCall.on(
      "stream",
      function(remoteStream) {

        remoteVideo.srcObject =
          remoteStream;

        remoteVideo.play()
          .catch(() => {});

        message.textContent =
          "🟢 Video terhubung";

      }
    );


    currentCall.on(
      "close",
      function() {

        endCall(false);

      }
    );


  }

  catch(error) {

    console.log(error);

    message.textContent =
      "❌ Kamera/mikrofon tidak bisa digunakan: " +
      error.message;

  }

};


/* =========================
   DATA / CHAT / MIRROR
========================= */

function receiveData(data) {

  if (!data) return;


  /* PESAN */

  if (data.type === "message") {

    addMessage(
      "Penelpon",
      data.text,
      false
    );

  }


  /* MIRROR DARI PENELPON */

  if (data.type === "mirror") {

    remoteVideo.style.transform =
      data.value
      ? "scaleX(-1)"
      : "scaleX(1)";

  }


  /* STATUS MIC PENELPON */

  if (data.type === "mic") {

    if (data.value) {

      message.textContent =
        "🎙️ Mikrofon penelpon aktif";

    }

    else {

      message.textContent =
        "🔇 Mikrofon penelpon dimatikan";

    }

  }


  /* STATUS KAMERA PENELPON */

  if (data.type === "camera") {

    if (data.value) {

      message.textContent =
        "📹 Kamera penelpon aktif";

    }

    else {

      message.textContent =
        "🚫 Kamera penelpon dimatikan";

    }

  }

}


/* =========================
   GANTI KAMERA OWNER
========================= */

async function switchCamera() {

  if (!currentCall || !localStream) {

    alert("Panggilan belum dimulai.");

    return;

  }


  try {

    const devices =
      await navigator.mediaDevices.enumerateDevices();


    const cameras =
      devices.filter(function(device) {

        return device.kind === "videoinput";

      });


    if (cameras.length < 2) {

      alert(
        "Kamera kedua tidak ditemukan."
      );

      return;

    }


    let index =
      cameras.findIndex(function(camera) {

        return camera.deviceId ===
               currentCameraId;

      });


    if (index < 0) {

      index = 0;

    }


    const nextIndex =
      (index + 1) % cameras.length;


    const nextCamera =
      cameras[nextIndex];


    const newStream =
      await navigator.mediaDevices
      .getUserMedia({

        video: {
          deviceId: {
            exact:
            nextCamera.deviceId
          }
        },

        audio: false

      });


    const newTrack =
      newStream.getVideoTracks()[0];


    const sender =
      currentCall.peerConnection
      .getSenders()
      .find(function(sender) {

        return sender.track &&
               sender.track.kind === "video";

      });


    if (!sender) {

      throw new Error(
        "Track video tidak ditemukan."
      );

    }


    await sender.replaceTrack(
      newTrack
    );


    const oldTrack =
      localStream.getVideoTracks()[0];


    if (oldTrack) {

      oldTrack.stop();

      localStream.removeTrack(
        oldTrack
      );

    }


    localStream.addTrack(
      newTrack
    );


    currentVideoTrack =
      newTrack;

    currentCameraId =
      nextCamera.deviceId;


    localVideo.srcObject =
      localStream;


    newTrack.enabled =
      cameraEnabled;


    message.textContent =
      "🔄 Kamera berhasil diganti";

  }

  catch(error) {

    console.error(error);

    alert(
      "Tidak bisa mengganti kamera.\n\n" +
      error.message
    );

  }

}


/* =========================
   MIRROR OWNER
========================= */

function toggleMirror() {

  mirrored =
    !mirrored;


  localVideo.style.transform =
    mirrored
    ? "scaleX(-1)"
    : "scaleX(1)";


  document.getElementById("mirrorBtn").textContent =
    mirrored
    ? "↔️ Layar Normal"
    : "↔️ Balik Layar";

}


/* =========================
   MIC OWNER
========================= */

function toggleMic() {

  if (!localStream)
    return;


  const tracks =
    localStream.getAudioTracks();


  if (tracks.length === 0) {

    alert(
      "Mikrofon tidak ditemukan."
    );

    return;

  }


  micEnabled =
    !micEnabled;


  tracks.forEach(function(track) {

    track.enabled =
      micEnabled;

  });


  if (currentCall) {

    const sender =
      currentCall.peerConnection
      .getSenders()
      .find(function(sender) {

        return sender.track &&
               sender.track.kind === "audio";

      });


    if (sender && sender.track) {

      sender.track.enabled =
        micEnabled;

    }

  }


  document.getElementById("micBtn").textContent =
    micEnabled
    ? "🎙️ Mic ON"
    : "🔇 Mic OFF";

}


/* =========================
   KAMERA OWNER ON / OFF
========================= */

function toggleCamera() {

  if (!localStream)
    return;


  const tracks =
    localStream.getVideoTracks();


  if (tracks.length === 0) {

    alert(
      "Kamera tidak ditemukan."
    );

    return;

  }


  cameraEnabled =
    !cameraEnabled;


  tracks.forEach(function(track) {

    track.enabled =
      cameraEnabled;

  });


  if (currentCall) {

    const sender =
      currentCall.peerConnection
      .getSenders()
      .find(function(sender) {

        return sender.track &&
               sender.track.kind === "video";

      });


    if (sender && sender.track) {

      sender.track.enabled =
        cameraEnabled;

    }

  }


  document.getElementById("videoBtn").textContent =
    cameraEnabled
    ? "📹 Kamera ON"
    : "🚫 Kamera OFF";

}


/* =========================
   CHAT OWNER
========================= */

function sendMessage() {

  const input =
    document.getElementById(
      "messageInput"
    );


  const text =
    input.value.trim();


  if (!text)
    return;


  if (
    dataConnection &&
    dataConnection.open
  ) {

    dataConnection.send({

      type: "message",

      text: text

    });


    addMessage(
      "Saya",
      text,
      true
    );


    input.value = "";

  }

  else {

    alert(
      "Chat belum terhubung."
    );

  }

}


function addMessage(
  name,
  text,
  me
) {

  const box =
    document.getElementById(
      "messages"
    );


  const div =
    document.createElement(
      "div"
    );


  div.className =
    "message" +
    (me ? " me" : "");


  div.textContent =
    name + ": " + text;


  box.appendChild(div);


  box.scrollTop =
    box.scrollHeight;

}


/* =========================
   AKHIRI PANGGILAN
========================= */

function endCall(
  closePeerCall = true
) {

  if (
    closePeerCall &&
    currentCall
  ) {

    try {

      currentCall.close();

    } catch(e) {}

  }


  if (dataConnection) {

    try {

      dataConnection.close();

    } catch(e) {}

    dataConnection = null;

  }


  if (localStream) {

    localStream
    .getTracks()
    .forEach(function(track) {

      track.stop();

    });

    localStream = null;

  }


  currentCall = null;
  incomingCall = null;
  currentVideoTrack = null;
  currentCameraId = null;


  remoteVideo.srcObject =
    null;

  localVideo.srcObject =
    null;


  remoteVideo.style.transform =
    "scaleX(1)";

  localVideo.style.transform =
    "scaleX(1)";


  callArea.style.display =
    "none";

  incoming.style.display =
    "none";


  status.textContent =
    "🟢 Owner online — menunggu panggilan";

  message.textContent =
    "";


  mirrored = false;
  micEnabled = true;
  cameraEnabled = true;


  document.getElementById("micBtn").textContent =
    "🎙️ Mic ON";

  document.getElementById("videoBtn").textContent =
    "📹 Kamera ON";

  document.getElementById("mirrorBtn").textContent =
    "↔️ Balik Layar";

}


document.getElementById("rejectBtn").onclick =
function() {

  if (incomingCall) {

    incomingCall.close();

  }

  incomingCall = null;

  incoming.style.display =
    "none";

  status.textContent =
    "🟢 Owner online — menunggu panggilan";

};


peer.on("error", function(error) {

  console.error(
    "PeerJS Error:",
    error
  );

  status.textContent =
    "❌ PeerJS: " + error.type;

});


peer.on("disconnected", function() {

  status.textContent =
    "🟠 Server terputus...";

  peer.reconnect();

});

</script>

</body>
</html>
