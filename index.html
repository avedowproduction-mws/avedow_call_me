<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Home Call</title>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #080b12;
    color: white;
}

.app {
    width: 100%;
    max-width: 500px;
    margin: auto;
    padding: 18px;
}

/* =========================
   HEADER
========================= */

.top {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 21px;
    font-weight: bold;
}

.online {
    color: #19c37d;
    font-size: 14px;
}

/* =========================
   WELCOME
========================= */

.welcome {
    text-align: center;
    padding: 35px 10px 20px;
}

.welcome h2 {
    margin-bottom: 8px;
}

.welcome p {
    color: #8b9bb4;
    line-height: 1.5;
}

/* =========================
   CALL CARD
========================= */

.callCard {
    background: #111722;
    border-radius: 22px;
    padding: 25px;
    text-align: center;
    border: 1px solid #202a3b;
}

.cameraIcon {
    width: 80px;
    height: 80px;
    background: #05070b;
    border-radius: 20px;

    display: flex;
    align-items: center;
    justify-content: center;

    margin: auto auto 18px;

    font-size: 38px;
}

.callCard p {
    color: #8b9bb4;
    line-height: 1.5;
}

.startBtn {
    width: 100%;
    margin-top: 12px;
    padding: 16px;
    border: 0;
    border-radius: 14px;

    background: #2563eb;
    color: white;

    font-size: 17px;
    font-weight: bold;
}

/* =========================
   FEATURES
========================= */

.features {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;

    margin-top: 15px;
}

.feature {
    background: #111722;
    border-radius: 15px;
    padding: 15px 5px;

    text-align: center;
}

.feature div {
    font-size: 24px;
}

.feature span {
    display: block;
    margin-top: 7px;
    color: #9aa8bd;
    font-size: 12px;
}

/* =========================
   CALL AREA
========================= */

#callArea {
    display: none;
}

.videoBox {
    position: relative;
    width: 100%;
    background: black;
    border-radius: 20px;
    overflow: hidden;
}

#remoteVideo {
    display: block;

    width: 100%;
    height: 65vh;
    min-height: 350px;

    background: black;
    object-fit: cover;

    transition: transform .2s;
}

#localVideo {
    position: absolute;

    right: 12px;
    bottom: 12px;

    width: 115px;
    height: 155px;

    background: #111;

    border: 2px solid white;
    border-radius: 14px;

    object-fit: cover;

    transition: transform .2s;
}

/* =========================
   STATUS
========================= */

.callStatus {
    display: flex;
    justify-content: center;
    gap: 10px;

    margin: 10px 0;

    color: #9aa8bd;
    font-size: 13px;
}

.remoteState {
    display: none;

    position: absolute;

    left: 12px;
    top: 12px;

    background: rgba(0,0,0,.65);

    padding: 7px 10px;

    border-radius: 10px;

    font-size: 13px;
}

/* =========================
   CONTROLS
========================= */

.controls {
    display: grid;
    grid-template-columns: repeat(3, 1fr);

    gap: 10px;

    margin-top: 12px;
}

.control {
    border: 0;
    border-radius: 15px;

    padding: 14px 5px;

    background: #1a2230;
    color: white;

    font-size: 13px;
}

.control .icon {
    display: block;
    font-size: 22px;
    margin-bottom: 4px;
}

.control.active {
    background: #2563eb;
}

.control.off {
    background: #e5484d;
}

.endBtn {
    width: 100%;

    margin-top: 10px;

    padding: 15px;

    border: 0;
    border-radius: 15px;

    background: #e5484d;
    color: white;

    font-size: 16px;
    font-weight: bold;
}

/* =========================
   CHAT
========================= */

.chat {
    display: none;

    margin-top: 12px;

    background: #111722;

    border-radius: 18px;

    overflow: hidden;
}

.chatHeader {
    padding: 12px;

    border-bottom: 1px solid #263044;

    font-weight: bold;
}

.messages {
    height: 190px;

    overflow-y: auto;

    padding: 12px;
}

.message {
    max-width: 78%;

    padding: 9px 12px;

    margin-bottom: 8px;

    border-radius: 14px;

    font-size: 14px;

    line-height: 1.4;

    word-wrap: break-word;
}

.message.me {
    margin-left: auto;

    background: #2563eb;

    border-bottom-right-radius: 4px;
}

.message.other {
    margin-right: auto;

    background: #263044;

    border-bottom-left-radius: 4px;
}

.chatInput {
    display: flex;

    gap: 6px;

    padding: 8px;

    border-top: 1px solid #263044;
}

.chatInput input {
    flex: 1;

    min-width: 0;

    border: 0;
    outline: none;

    background: #1a2230;

    color: white;

    border-radius: 12px;

    padding: 12px;
}

.chatInput button {
    width: 44px;

    border: 0;
    border-radius: 12px;

    background: #2563eb;
    color: white;

    font-size: 18px;
}

/* =========================
   MESSAGE
========================= */

#message {
    text-align: center;

    color: #8b9bb4;

    font-size: 13px;

    min-height: 20px;

    margin: 10px;
}

footer {
    text-align: center;

    color: #536176;

    font-size: 12px;

    padding: 20px;
}

</style>
</head>

<body>

<div class="app">

    <div class="top">

        <div class="logo">
            Home Call
        </div>

        <div class="online">
            🟢 Online
        </div>

    </div>


    <!-- =========================
         WELCOME
    ========================== -->

    <div id="welcome">

        <div class="welcome">

            <h2>
                Selamat datang 👋
            </h2>

            <p>
                Hubungi saya sekarang.<br>
                Tekan tombol di bawah untuk memulai panggilan video.
            </p>

        </div>


        <div class="callCard">

            <div class="cameraIcon">
                📹
            </div>

            <h2>
                Video Call
            </h2>

            <p>
                Mulai panggilan video dengan pemilik.
            </p>

            <button
                class="startBtn"
                id="startBtn">

                📞 Mulai Video Call

            </button>

        </div>


        <div class="features">

            <div class="feature">
                <div>🎥</div>
                <span>Video</span>
            </div>

            <div class="feature">
                <div>🎙️</div>
                <span>Audio</span>
            </div>

            <div class="feature">
                <div>🔒</div>
                <span>Aman</span>
            </div>

        </div>

    </div>


    <!-- =========================
         CALL
    ========================== -->

    <div id="callArea">

        <div class="videoBox">

            <video
                id="remoteVideo"
                autoplay
                playsinline>
            </video>

            <video
                id="localVideo"
                autoplay
                muted
                playsinline>
            </video>

            <div
                class="remoteState"
                id="remoteState">
            </div>

        </div>


        <div class="callStatus">

            <span id="callStatus">
                Menghubungkan...
            </span>

        </div>


        <!-- CONTROLS -->

        <div class="controls">

            <button
                class="control active"
                id="micBtn">

                <span class="icon">
                    🎙️
                </span>

                Mic

            </button>


            <button
                class="control active"
                id="cameraBtn">

                <span class="icon">
                    📹
                </span>

                Kamera

            </button>


            <button
                class="control"
                id="mirrorBtn">

                <span class="icon">
                    🔄
                </span>

                Mirror

            </button>

        </div>


        <button
            class="endBtn"
            id="endBtn">

            🔴 Akhiri Panggilan

        </button>


        <!-- CHAT -->

        <div
            class="chat"
            id="chat">

            <div class="chatHeader">
                💬 Pesan
            </div>

            <div
                class="messages"
                id="messages">
            </div>

            <div class="chatInput">

                <input
                    id="chatText"
                    type="text"
                    placeholder="Tulis pesan...">

                <button
                    id="emojiBtn">
                    😊
                </button>

                <button
                    id="sendBtn">
                    ➤
                </button>

            </div>

        </div>

    </div>


    <div id="message"></div>

    <footer>
        Home Call • Video Communication
    </footer>

</div>


<script>

/* =====================================================
   CONFIG
===================================================== */

const OWNER_ID =
    "homecall-owner-2026";


const PEER_OPTIONS = {

    host: "0.peerjs.com",

    port: 443,

    path: "/",

    secure: true,

    debug: 2,

    config: {

        iceServers: [

            {
                urls:
                    "stun:stun.l.google.com:19302"
            }

        ]

    }

};


/* =====================================================
   VARIABLES
===================================================== */

let peer = null;

let call = null;

let dataConn = null;

let localStream = null;

let audioTrack = null;

let videoTrack = null;

let micOn = true;

let cameraOn = true;

let mirrorOn = false;


/* =====================================================
   ELEMENTS
===================================================== */

const welcome =
    document.getElementById("welcome");

const startBtn =
    document.getElementById("startBtn");

const callArea =
    document.getElementById("callArea");

const remoteVideo =
    document.getElementById("remoteVideo");

const localVideo =
    document.getElementById("localVideo");

const micBtn =
    document.getElementById("micBtn");

const cameraBtn =
    document.getElementById("cameraBtn");

const mirrorBtn =
    document.getElementById("mirrorBtn");

const endBtn =
    document.getElementById("endBtn");

const callStatus =
    document.getElementById("callStatus");

const message =
    document.getElementById("message");

const chat =
    document.getElementById("chat");

const messages =
    document.getElementById("messages");

const chatText =
    document.getElementById("chatText");

const sendBtn =
    document.getElementById("sendBtn");

const emojiBtn =
    document.getElementById("emojiBtn");

const remoteState =
    document.getElementById("remoteState");


/* =====================================================
   CREATE PEER
===================================================== */

peer =
    new Peer(
        undefined,
        PEER_OPTIONS
    );


peer.on(
    "open",
    function(id) {

        console.log(
            "Penelpon online:",
            id
        );

    }
);


/* =====================================================
   START CALL
===================================================== */

startBtn.onclick =
    async function() {

        try {

            message.innerText =
                "Meminta izin kamera dan mikrofon...";


            localStream =
                await navigator.mediaDevices
                    .getUserMedia({

                        video: true,

                        audio: true

                    });


            audioTrack =
                localStream.getAudioTracks()[0];

            videoTrack =
                localStream.getVideoTracks()[0];


            micOn = true;

            cameraOn = true;


            localVideo.srcObject =
                localStream;


            await localVideo
                .play()
                .catch(
                    function() {}
                );


            welcome.style.display =
                "none";

            callArea.style.display =
                "block";

            chat.style.display =
                "block";


            callStatus.innerText =
                "Menghubungkan ke pemilik...";


            message.innerText =
                "";


            /* =========================
               DATA CONNECTION
            ========================== */

            dataConn =
                peer.connect(
                    OWNER_ID,
                    {
                        reliable: true
                    }
                );


            setupDataConnection(
                dataConn
            );


            /* =========================
               VIDEO CALL
            ========================== */

            call =
                peer.call(
                    OWNER_ID,
                    localStream
                );


            call.on(
                "stream",
                function(stream) {

                    remoteVideo.srcObject =
                        stream;

                    remoteVideo
                        .play()
                        .catch(
                            function() {}
                        );

                    callStatus.innerText =
                        "🟢 Terhubung";

                }
            );


            call.on(
                "close",
                function() {

                    endCall();

                }
            );


            call.on(
                "error",
                function(error) {

                    console.error(
                        error
                    );

                    callStatus.innerText =
                        "❌ Panggilan gagal";

                }
            );

        }
        catch(error) {

            console.error(
                error
            );

            message.innerText =
                "❌ Kamera/mikrofon tidak bisa digunakan: " +
                error.message;

        }

    };


/* =====================================================
   DATA CONNECTION
===================================================== */

function setupDataConnection(conn) {

    if (!conn) {
        return;
    }


    conn.on(
        "open",
        function() {

            console.log(
                "💬 Data connection terbuka"
            );

            chat.style.display =
                "block";

        }
    );


    conn.on(
        "data",
        function(data) {

            handleData(
                data
            );

        }
    );


    conn.on(
        "close",
        function() {

            console.log(
                "Data connection ditutup"
            );

        }
    );


    conn.on(
        "error",
        function(error) {

            console.error(
                "Data error:",
                error
            );

        }
    );

}


/* =====================================================
   HANDLE DATA
===================================================== */

function handleData(data) {

    if (!data) {
        return;
    }


    /* =========================
       CHAT
    ========================== */

    if (
        data.type ===
        "chat"
    ) {

        addMessage(
            data.text,
            "other"
        );

        return;

    }


    /* =========================
       REMOTE MIC
    ========================== */

    if (
        data.type ===
        "mic"
    ) {

        showRemoteMic(
            data.enabled
        );

        return;

    }


    /* =========================
       REMOTE CAMERA
    ========================== */

    if (
        data.type ===
        "camera"
    ) {

        showRemoteCamera(
            data.enabled
        );

        return;

    }


    /* =========================
       REMOTE MIRROR
    ========================== */

    if (
        data.type ===
        "mirror"
    ) {

        remoteVideo.style.transform =
            data.enabled
                ? "scaleX(-1)"
                : "scaleX(1)";

        return;

    }

}


/* =====================================================
   MIC
===================================================== */

micBtn.onclick =
    function() {

        if (!audioTrack) {
            return;
        }


        micOn =
            !micOn;


        audioTrack.enabled =
            micOn;


        micBtn.classList.toggle(
            "active",
            micOn
        );

        micBtn.classList.toggle(
            "off",
            !micOn
        );


        micBtn.innerHTML =
            micOn
                ? "🎙️<br>Mic"
                : "🔇<br>Mic";


        sendData({

            type: "mic",

            enabled: micOn

        });

    };


/* =====================================================
   CAMERA
===================================================== */

cameraBtn.onclick =
    function() {

        if (!videoTrack) {
            return;
        }


        cameraOn =
            !cameraOn;


        videoTrack.enabled =
            cameraOn;


        cameraBtn.classList.toggle(
            "active",
            cameraOn
        );

        cameraBtn.classList.toggle(
            "off",
            !cameraOn
        );


        cameraBtn.innerHTML =
            cameraOn
                ? "📹<br>Kamera"
                : "🚫<br>Kamera";


        sendData({

            type: "camera",

            enabled: cameraOn

        });

    };


/* =====================================================
   MIRROR
===================================================== */

mirrorBtn.onclick =
    function() {

        mirrorOn =
            !mirrorOn;


        localVideo.style.transform =
            mirrorOn
                ? "scaleX(-1)"
                : "scaleX(1)";


        mirrorBtn.classList.toggle(
            "active",
            mirrorOn
        );


        sendData({

            type: "mirror",

            enabled: mirrorOn

        });

    };


/* =====================================================
   REMOTE MIC
===================================================== */

function showRemoteMic(enabled) {

    if (enabled) {

        remoteState.style.display =
            "none";

    }
    else {

        remoteState.style.display =
            "block";

        remoteState.innerText =
            "🔇 Mikrofon dimatikan";

    }

}


/* =====================================================
   REMOTE CAMERA
===================================================== */

function showRemoteCamera(enabled) {

    if (enabled) {

        remoteState.style.display =
            "none";

    }
    else {

        remoteState.style.display =
            "block";

        remoteState.innerText =
            "📷 Kamera dimatikan";

    }

}


/* =====================================================
   SEND DATA
===================================================== */

function sendData(data) {

    if (
        dataConn &&
        dataConn.open
    ) {

        dataConn.send(
            data
        );

    }

}


/* =====================================================
   CHAT
===================================================== */

function sendMessage() {

    const text =
        chatText.value.trim();


    if (!text) {
        return;
    }


    addMessage(
        text,
        "me"
    );


    sendData({

        type: "chat",

        text: text

    });


    chatText.value =
        "";

}


sendBtn.onclick =
    sendMessage;


chatText.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key
