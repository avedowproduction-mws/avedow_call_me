<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home Call - Owner</title>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#080b12;
  color:white;
  min-height:100vh;
}

.app{
  width:100%;
  max-width:500px;
  margin:auto;
  padding:18px;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:25px;
}

.logo{
  font-size:21px;
  font-weight:bold;
}

.online{
  background:#102b1b;
  color:#45e878;
  padding:8px 12px;
  border-radius:20px;
  font-size:12px;
}

.owner-card{
  background:#111722;
  border:1px solid #202938;
  border-radius:20px;
  padding:22px;
  text-align:center;
}

.owner-icon{
  width:70px;
  height:70px;
  margin:auto auto 15px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:20px;
  background:#080b12;
  font-size:35px;
}

.owner-card h2{
  font-size:21px;
  margin-bottom:8px;
}

.server-text{
  color:#9aa5b5;
  font-size:14px;
  line-height:1.5;
}

.notify-btn{
  width:100%;
  border:0;
  border-radius:13px;
  padding:13px;
  margin-top:17px;
  background:#1d2635;
  color:white;
  font-size:14px;
  cursor:pointer;
}

.incoming{
  display:none;
  background:#152238;
  border:1px solid #31527d;
  border-radius:20px;
  padding:20px;
  margin-top:18px;
  text-align:center;
}

.incoming h3{
  margin-bottom:8px;
}

.incoming p{
  color:#aab5c5;
  font-size:14px;
  margin-bottom:17px;
}

.incoming-buttons{
  display:flex;
  gap:10px;
}

.accept,
.reject{
  flex:1;
  border:0;
  border-radius:12px;
  padding:13px;
  color:white;
  font-weight:bold;
}

.accept{
  background:#20a95a;
}

.reject{
  background:#d83242;
}

.call-screen{
  display:none;
  margin-top:18px;
}

.call-card{
  background:#111722;
  border:1px solid #202938;
  border-radius:20px;
  padding:15px;
}

.call-title{
  text-align:center;
  font-weight:bold;
  margin-bottom:14px;
}

.video-container{
  position:relative;
  width:100%;
  aspect-ratio:9/16;
  background:#000;
  border-radius:17px;
  overflow:hidden;
}

.remote-video{
  width:100%;
  height:100%;
  object-fit:cover;
  background:#000;
  transition:.25s;
}

.local-video{
  position:absolute;
  right:12px;
  bottom:12px;
  width:115px;
  height:160px;
  object-fit:cover;
  border-radius:12px;
  border:2px solid white;
  background:#111;
  z-index:5;
  transition:.25s;
}

.remote-status{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  background:rgba(0,0,0,.75);
  padding:12px 17px;
  border-radius:12px;
  font-size:14px;
  display:none;
  z-index:10;
  text-align:center;
}

.controls{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-top:15px;
}

.control{
  border:0;
  border-radius:13px;
  padding:13px 8px;
  background:#1b2330;
  color:white;
  cursor:pointer;
  font-size:13px;
}

.control.off{
  background:#7c2630;
}

.end-call{
  width:100%;
  margin-top:12px;
  border:0;
  border-radius:13px;
  padding:14px;
  background:#d83242;
  color:white;
  font-weight:bold;
}

.chat{
  margin-top:15px;
  background:#0e141e;
  border-radius:17px;
  padding:12px;
}

.chat-messages{
  height:150px;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  gap:7px;
  margin-bottom:10px;
}

.message{
  max-width:78%;
  padding:8px 11px;
  border-radius:12px;
  font-size:13px;
  word-break:break-word;
}

.message.me{
  align-self:flex-end;
  background:#075e54;
}

.message.other{
  align-self:flex-start;
  background:#202936;
}

.chat-input-row{
  display:flex;
  gap:7px;
}

.emoji-btn,
.send-btn{
  border:0;
  border-radius:10px;
  background:#202936;
  color:white;
  cursor:pointer;
}

.emoji-btn{
  width:43px;
}

.chat-input{
  flex:1;
  border:0;
  outline:0;
  background:#202936;
  color:white;
  padding:10px;
  border-radius:10px;
}

.send-btn{
  width:55px;
  background:#168aad;
}

.emoji-panel{
  display:none;
  padding:8px 0;
  font-size:22px;
  line-height:1.8;
}

.emoji{
  cursor:pointer;
  margin-right:7px;
}

.footer{
  text-align:center;
  color:#596575;
  font-size:12px;
  margin-top:25px;
  padding-bottom:15px;
}
</style>
</head>

<body>

<div class="app">

  <div class="top">
    <div class="logo">Home Call</div>
    <div class="online" id="onlineStatus">
      🟡 Menghubungkan...
    </div>
  </div>

  <div class="owner-card">

    <div class="owner-icon">🏠</div>

    <h2>Owner</h2>

    <div class="server-text" id="serverText">
      Menghubungkan ke server...
    </div>

    <button class="notify-btn" id="notifyBtn">
      🔔 Aktifkan Notifikasi & Dering
    </button>

  </div>


  <!-- PANGGILAN MASUK -->

  <div class="incoming" id="incomingBox">

    <h3>📞 Panggilan Masuk</h3>

    <p>
      Seseorang sedang mencoba menghubungi Anda.
    </p>

    <div class="incoming-buttons">

      <button class="accept" id="acceptBtn">
        ✅ Terima Panggilan
      </button>

      <button class="reject" id="rejectBtn">
        ❌ Tolak
      </button>

    </div>

  </div>


  <!-- VIDEO CALL -->

  <div class="call-screen" id="callScreen">

    <div class="call-card">

      <div class="call-title">
        🎥 Video Call
      </div>

      <div class="video-container">

        <video
          id="remoteVideo"
          class="remote-video"
          autoplay
          playsinline>
        </video>

        <video
          id="localVideo"
          class="local-video"
          autoplay
          muted
          playsinline>
        </video>

        <div
          class="remote-status"
          id="remoteStatus">
        </div>

      </div>


      <div class="controls">

        <button class="control" id="micBtn">
          🎙️ Mic ON
        </button>

        <button class="control" id="cameraBtn">
          🎥 Kamera ON
        </button>

        <button class="control" id="mirrorBtn">
          🔄 Mirror
        </button>

      </div>


      <button class="end-call" id="endBtn">
        🔴 Akhiri Panggilan
      </button>


      <!-- CHAT -->

      <div class="chat">

        <div
          class="chat-messages"
          id="chatMessages">
        </div>

        <div
          class="emoji-panel"
          id="emojiPanel">

          <span class="emoji">😀</span>
          <span class="emoji">😂</span>
          <span class="emoji">😍</span>
          <span class="emoji">🥰</span>
          <span class="emoji">😎</span>
          <span class="emoji">👍</span>
          <span class="emoji">❤️</span>
          <span class="emoji">🔥</span>
          <span class="emoji">👏</span>
          <span class="emoji">🙏</span>

        </div>

        <div class="chat-input-row">

          <button
            class="emoji-btn"
            id="emojiBtn">
            😊
          </button>

          <input
            type="text"
            id="chatInput"
            class="chat-input"
            placeholder="Ketik pesan...">

          <button
            class="send-btn"
            id="sendBtn">
            ➤
          </button>

        </div>

      </div>

    </div>

  </div>


  <div class="footer">
    Home Call • Video Communication
  </div>

</div>


<script>

/* =========================
   HOME CALL OWNER
   ========================= */

const OWNER_ID = "homecall-owner-2026";

let peer = null;
let incomingCall = null;
let activeCall = null;
let dataConn = null;
let localStream = null;

let micEnabled = true;
let cameraEnabled = true;
let mirrorEnabled = false;

let ringtoneTimer = null;
let audioContext = null;


/* ELEMENT */

const onlineStatus =
  document.getElementById("onlineStatus");

const serverText =
  document.getElementById("serverText");

const incomingBox =
  document.getElementById("incomingBox");

const acceptBtn =
  document.getElementById("acceptBtn");

const rejectBtn =
  document.getElementById("rejectBtn");

const callScreen =
  document.getElementById("callScreen");

const remoteVideo =
  document.getElementById("remoteVideo");

const localVideo =
  document.getElementById("localVideo");

const remoteStatus =
  document.getElementById("remoteStatus");

const micBtn =
  document.getElementById("micBtn");

const cameraBtn =
  document.getElementById("cameraBtn");

const mirrorBtn =
  document.getElementById("mirrorBtn");

const endBtn =
  document.getElementById("endBtn");

const chatMessages =
  document.getElementById("chatMessages");

const chatInput =
  document.getElementById("chatInput");

const sendBtn =
  document.getElementById("sendBtn");

const emojiBtn =
  document.getElementById("emojiBtn");

const emojiPanel =
  document.getElementById("emojiPanel");

const notifyBtn =
  document.getElementById("notifyBtn");


/* STATUS */

function status(statusText, message){

  onlineStatus.textContent = statusText;
  serverText.textContent = message;

}


/* =========================
   CEK PEERJS
   ========================= */

if(typeof Peer === "undefined"){

  status(
    "🔴 PeerJS Error",
    "PeerJS tidak berhasil dimuat. Periksa internet."
  );

}else{

  createPeer();

}


/* =========================
   CONNECT PEER
   ========================= */

function createPeer(){

  status(
    "🟡 Menghubungkan...",
    "Menghubungkan ke server PeerJS..."
  );

  try{

    /*
      PeerJS Cloud default.
      Tidak memakai host/key tambahan.
    */

    peer = new Peer(OWNER_ID);

  }catch(error){

    console.error(error);

    status(
      "🔴 Error",
      "Gagal membuat koneksi PeerJS."
    );

    return;

  }


  /* SERVER TERHUBUNG */

  peer.on("open", function(id){

    console.log(
      "======================"
    );

    console.log(
      "HOME CALL OWNER ONLINE"
    );

    console.log(
      "Peer ID:",
      id
    );

    console.log(
      "======================"
    );


    status(
      "🟢 Owner Online",
      "Terhubung. Owner siap menerima panggilan."
    );

  });


  /* ERROR */

  peer.on("error", function(error){

    console.error(
      "PEERJS ERROR:",
      error
    );


    let message =
      "Terjadi kesalahan koneksi.";


    if(error.type === "unavailable-id"){

      message =
        "ID Owner sedang dipakai. Tutup tab Owner lain.";

    }

    else if(error.type === "network"){

      message =
        "Internet terputus atau jaringan memblokir koneksi.";

    }

    else if(error.type === "server-error"){

      message =
        "Server PeerJS bermasalah. Coba lagi.";

    }

    else if(error.type === "socket-error"){

      message =
        "Koneksi socket ke server gagal.";

    }

    else if(error.type === "socket-closed"){

      message =
        "Koneksi ke server ditutup.";

    }

    else if(error.type === "ssl-unavailable"){

      message =
        "Koneksi HTTPS/SSL bermasalah.";

    }

    else if(error.message){

      message =
        error.message;

    }


    status(
      "🔴 Gagal",
      message
    );

  });


  /* DISCONNECT */

  peer.on("disconnected", function(){

    console.log(
      "PeerJS disconnected"
    );


    status(
      "🟠 Terputus",
      "Koneksi terputus. Mencoba menyambungkan kembali..."
    );


    setTimeout(function(){

      if(
        peer &&
        peer.disconnected &&
        !peer.destroyed
      ){

        try{

          peer.reconnect();

        }catch(error){

          console.error(error);

        }

      }

    },3000);

  });


  /* CLOSE */

  peer.on("close", function(){

    status(
      "🔴 Offline",
      "Koneksi Owner ditutup."
    );

  });


  /* DATA CONNECTION */

  peer.on("connection", function(conn){

    console.log(
      "Data connection masuk:",
      conn.peer
    );

    dataConn = conn;

    setupDataConnection(conn);

  });


  /* PANGGILAN */

  peer.on("call", function(call){

    console.log(
      "Panggilan masuk dari:",
      call.peer
    );


    if(
      activeCall ||
      incomingCall
    ){

      try{
        call.close();
      }catch(e){}

      return;

    }


    incomingCall = call;

    incomingBox.style.display =
      "block";

    startRingtone();

    showNotification();

  });

}


/* =========================
   DATA CONNECTION
   ========================= */

function setupDataConnection(conn){

  conn.on("open", function(){

    console.log(
      "Data connection OPEN"
    );

  });


  conn.on("data", function(data){

    console.log(
      "DATA:",
      data
    );


    if(!data || !data.type){
      return;
    }


    if(data.type === "chat"){

      addMessage(
        data.text,
        "other"
      );

    }


    if(data.type === "mic"){

      showRemoteStatus(
        data.enabled
          ? "🎙️ Mikrofon menyala"
          : "🔇 Mikrofon dimatikan",
        2200
      );

    }


    if(data.type === "camera"){

      showRemoteStatus(
        data.enabled
          ? "🎥 Kamera menyala"
          : "📷 Kamera dimatikan",
        2200
      );

    }


    if(data.type === "mirror"){

      remoteVideo.style.transform =
        data.enabled
          ? "scaleX(-1)"
          : "scaleX(1)";

    }


    if(data.type === "callEnded"){

      endCall(false);

    }

  });


  conn.on("close", function(){

    if(dataConn === conn){

      dataConn = null;

    }

  });


  conn.on("error", function(error){

    console.error(
      "Data error:",
      error
    );

  });

}


/* =========================
   MEDIA
   ========================= */

async function getLocalMedia(){

  if(localStream){

    return localStream;

  }


  if(
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ){

    throw new Error(
      "Browser tidak mendukung kamera/mikrofon."
    );

  }


  localStream =
    await navigator.mediaDevices.getUserMedia({

      video:true,
      audio:true

    });


  localVideo.srcObject =
    localStream;


  return localStream;

}


/* =========================
   TERIMA
   ========================= */

acceptBtn.onclick =
async function(){

  if(!incomingCall){
    return;
  }


  stopRingtone();


  try{

    const stream =
      await getLocalMedia();


    incomingCall.answer(stream);

    activeCall =
      incomingCall;

    incomingCall = null;

    incomingBox.style.display =
      "none";

    callScreen.style.display =
      "block";


    activeCall.on(
      "stream",
      function(stream){

        console.log(
          "Remote stream diterima"
        );

        remoteVideo.srcObject =
          stream;

        remoteVideo.play()
          .catch(function(){});

      }
    );


    activeCall.on(
      "close",
      function(){

        endCall(false);

      }
    );


    activeCall.on(
      "error",
      function(error){

        console.error(
          "CALL ERROR:",
          error
        );

        endCall(false);

      }
    );


    updateButtons();

  }catch(error){

    console.error(error);

    alert(
      "Kamera/mikrofon tidak bisa digunakan.\n\n" +
      "Pastikan izin kamera dan mikrofon diberikan."
    );


    try{

      incomingCall.close();

    }catch(e){}


    incomingCall = null;

    incomingBox.style.display =
      "none";

  }

};


/* =========================
   TOLAK
   ========================= */

rejectBtn.onclick =
function(){

  stopRingtone();


  if(incomingCall){

    try{

      incomingCall.close();

    }catch(e){}

  }


  incomingCall = null;

  incomingBox.style.display =
    "none";

};


/* =========================
   MIC
   ========================= */

micBtn.onclick =
function(){

  if(!localStream){
    return;
  }


  const track =
    localStream.getAudioTracks()[0];


  if(!track){
    return;
  }


  micEnabled =
    !micEnabled;


  track.enabled =
    micEnabled;


  sendData({

    type:"mic",
    enabled:micEnabled

  });


  updateButtons();

};


/* =========================
   CAMERA
   ========================= */

cameraBtn.onclick =
function(){

  if(!localStream){
    return;
  }


  const track =
    localStream.getVideoTracks()[0];


  if(!track){
    return;
  }


  cameraEnabled =
    !cameraEnabled;


  track.enabled =
    cameraEnabled;


  sendData({

    type:"camera",
    enabled:cameraEnabled

  });


  updateButtons();

};


/* =========================
   MIRROR
   ========================= */

mirrorBtn.onclick =
function(){

  mirrorEnabled =
    !mirrorEnabled;


  localVideo.style.transform =
    mirrorEnabled
      ? "scaleX(-1)"
      : "scaleX(1)";


  sendData({

    type:"mirror",
    enabled:mirrorEnabled

  });


  updateButtons();

};


/* =========================
   BUTTON
   ========================= */

function updateButtons(){

  micBtn.textContent =
    micEnabled
      ? "🎙️ Mic ON"
      : "🔇 Mic OFF";


  cameraBtn.textContent =
    cameraEnabled
      ? "🎥 Kamera ON"
      : "📷 Kamera OFF";


  mirrorBtn.textContent =
    mirrorEnabled
      ? "🔄 Mirror ON"
      : "🔄 Mirror";


  micBtn.classList.toggle(
    "off",
    !micEnabled
  );


  cameraBtn.classList.toggle(
    "off",
    !cameraEnabled
  );


  mirrorBtn.classList.toggle(
    "off",
    mirrorEnabled
  );

}


/* =========================
   SEND DATA
   ========================= */

function sendData(data){

  if(
    dataConn &&
    dataConn.open
  ){

    try{

      dataConn.send(data);

    }catch(error){

      console.error(
        "Send data error:",
        error
      );

    }

  }

}


/* =========================
   CHAT
   ========================= */

function sendMessage(){

  const text =
    chatInput.value.trim();


  if(!text){
    return;
  }


  addMessage(
    text,
    "me"
  );


  sendData({

    type:"chat",
    text:text

  });


  chatInput.value = "";

}


sendBtn.onclick =
sendMessage;


chatInput.addEventListener(
  "keydown",
  function(event){

    if(event.key === "Enter"){

      event.preventDefault();

      sendMessage();

    }

  }
);


/* =========================
   MESSAGE
   ========================= */

function addMessage(text,type){

  const message =
    document.createElement("div");


  message.className =
    "message " + type;


  message.textContent =
    text;


  chatMessages.appendChild(
    message
  );


  chatMessages.scrollTop =
    chatMessages.scrollHeight;

}


/* =========================
   EMOJI
   ========================= */

emojiBtn.onclick =
function(){

  emojiPanel.style.display =
    emojiPanel.style.display === "block"
      ? "none"
      : "block";

};


document
.querySelectorAll(".emoji")
.forEach(function(element){

  element.onclick =
  function(){

    chatInput.value +=
      element.textContent;

    chatInput.focus();

  };

});


/* =========================
   REMOTE STATUS
   ========================= */

let remoteStatusTimer = null;

function showRemoteStatus(
  text,
  duration
){

  remoteStatus.textContent =
    text;

  remoteStatus.style.display =
    "block";


  clearTimeout(
    remoteStatusTimer
  );


  remoteStatusTimer =
    setTimeout(function(){

      remoteStatus.style.display =
        "none";

    },duration);

}


/* =========================
   NOTIFICATION
   ========================= */

notifyBtn.onclick =
async function(){

  try{

    const AudioContextClass =
      window.AudioContext ||
      window.webkitAudioContext;


    if(AudioContextClass){

      audioContext =
        audioContext ||
        new AudioContextClass();


      if(
        audioContext.state ===
        "suspended"
      ){

        await audioContext.resume();

      }

    }


    if(
      "Notification" in window
    ){

      const permission =
        await Notification.requestPermission();


      if(permission === "granted"){

        notifyBtn.textContent =
          "✅ Notifikasi Aktif";

      }else{

        notifyBtn.textContent =
          "⚠️ Notifikasi Ditolak";

      }

    }


    playBeep();

  }catch(error){

    console.err
