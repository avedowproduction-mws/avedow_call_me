<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home Call - Pemilik</title>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0b0f14;
  color:white;
}

.header{
  padding:20px;
  text-align:center;
  background:#111821;
  border-bottom:1px solid #222b35;
}

.header h1{margin:0;font-size:25px}

.status{
  margin-top:7px;
  color:#35e27b;
  font-size:14px;
}

.container{
  max-width:480px;
  margin:auto;
  padding:20px;
}

.waiting{
  text-align:center;
  padding:50px 20px;
}

.waitingIcon{
  font-size:60px;
  margin-bottom:15px;
}

#callArea{display:none}

.videoBox{
  position:relative;
  width:100%;
  aspect-ratio:16/10;
  background:#000;
  border-radius:18px;
  overflow:hidden;
}

#remoteVideo{
  width:100%;
  height:100%;
  object-fit:cover;
  background:#000;
}

.localBox{
  position:absolute;
  right:12px;
  bottom:12px;
  width:110px;
  aspect-ratio:3/4;
  border-radius:12px;
  overflow:hidden;
  border:2px solid white;
  background:#111;
}

#localVideo{
  width:100%;
  height:100%;
  object-fit:cover;
}

.controls{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin-top:15px;
}

button{
  border:0;
  border-radius:13px;
  padding:13px 16px;
  color:white;
  background:#26313e;
  font-size:15px;
  cursor:pointer;
}

.end{background:#d83232}

.chat{
  margin-top:20px;
  background:#151c25;
  border-radius:18px;
  padding:15px;
}

.messages{
  height:180px;
  overflow-y:auto;
  margin-bottom:10px;
}

.msg{
  background:#26313e;
  padding:9px 11px;
  border-radius:10px;
  margin-bottom:7px;
  max-width:85%;
}

.mine{
  margin-left:auto;
  background:#168a4a;
}

.chatRow{
  display:flex;
  gap:7px;
}

.chatRow input{
  flex:1;
  border:0;
  outline:0;
  border-radius:10px;
  padding:12px;
  background:#222b35;
  color:white;
}
</style>
</head>

<body>

<div class="header">
  <h1>🏠 Home Call</h1>
  <div class="status" id="status">🟢 Online</div>
</div>

<div class="container">

  <div class="waiting" id="waiting">
    <div class="waitingIcon">📹</div>
    <h2>Menunggu Panggilan</h2>
    <p>Pemilik rumah siap menerima panggilan.</p>
  </div>

  <div id="callArea">

    <div class="videoBox">

      <video id="remoteVideo" autoplay playsinline></video>

      <div class="localBox">
        <video id="localVideo" autoplay muted playsinline></video>
      </div>

    </div>

    <div class="controls">
      <button onclick="toggleMirror()">↔️</button>
      <button onclick="toggleMic()" id="micBtn">🎙️</button>
      <button onclick="toggleCamera()" id="camBtn">📹</button>
      <button class="end" onclick="endCall()">🔴</button>
    </div>

    <div class="chat">

      <h3>💬 Pesan</h3>

      <div class="messages" id="messages"></div>

      <div class="chatRow">
        <input id="messageInput" placeholder="Ketik pesan...">
        <button onclick="sendMessage()">Kirim</button>
      </div>

    </div>

  </div>

</div>

<script>

const OWNER_ID="homecall-owner-2026";

const peer=new Peer(OWNER_ID);

let currentCall=null;
let dataConnection=null;

let localStream=null;
let audioTrack=null;
let videoTrack=null;
let audioSender=null;

let micOn=true;
let cameraOn=true;
let mirrored=false;

const localVideo=document.getElementById("localVideo");
const remoteVideo=document.getElementById("remoteVideo");
const statusEl=document.getElementById("status");

async function getMedia(){

  localStream=await navigator.mediaDevices.getUserMedia({
    video:true,
    audio:true
  });

  audioTrack=localStream.getAudioTracks()[0];
  videoTrack=localStream.getVideoTracks()[0];

  localVideo.srcObject=localStream;
}

peer.on("open",async()=>{
  statusEl.textContent="🟢 Online";

  try{
    await getMedia();
  }catch(e){
    statusEl.textContent="🔴 Kamera/mikrofon tidak tersedia";
    console.log(e);
  }
});

peer.on("call",async call=>{

  try{

    if(!localStream){
      await getMedia();
    }

    currentCall=call;

    call.answer(localStream);

    document.getElementById("waiting").style.display="none";
    document.getElementById("callArea").style.display="block";

    call.on("stream",stream=>{

      remoteVideo.srcObject=stream;

      setTimeout(()=>{

        audioSender =
          currentCall.peerConnection
          .getSenders()
          .find(s => s.track && s.track.kind==="audio");

      },500);

    });

    call.on("close",()=>{
      endCall(false);
    });

  }catch(e){
    console.log(e);
  }

});

peer.on("connection",connection=>{

  dataConnection=connection;

  connection.on("data",handleData);

});

function toggleMirror(){

  mirrored=!mirrored;

  localVideo.style.transform=
    mirrored ? "scaleX(-1)" : "scaleX(1)";

  if(dataConnection && dataConnection.open){

    dataConnection.send({
      type:"mirror",
      value:mirrored
    });

  }
}

function toggleMic(){

  micOn=!micOn;

  if(audioSender){

    if(micOn){
      audioSender.replaceTrack(audioTrack);
    }else{
      audioSender.replaceTrack(null);
    }

  }

  audioTrack.enabled=micOn;

  document.getElementById("micBtn").textContent=
    micOn ? "🎙️" : "🔇";
}

function toggleCamera(){

  cameraOn=!cameraOn;

  videoTrack.enabled=cameraOn;

  document.getElementById("camBtn").textContent=
    cameraOn ? "📹" : "🚫📹";
}

function endCall(sendMessage=true){

  if(sendMessage && dataConnection && dataConnection.open){

    dataConnection.send({
      type:"peer-ended"
    });

  }

  if(currentCall){

    currentCall.close();
    currentCall=null;

  }

  if(localStream){

    localStream.getTracks().forEach(track=>track.stop());
    localStream=null;

  }

  remoteVideo.srcObject=null;
  localVideo.srcObject=null;

  document.getElementById("callArea").style.display="none";
  document.getElementById("waiting").style.display="block";

  micOn=true;
  cameraOn=true;
  mirrored=false;

  document.getElementById("micBtn").textContent="🎙️";
  document.getElementById("camBtn").textContent="📹";
}

function sendMessage(){

  const input=document.getElementById("messageInput");

  const text=input.value.trim();

  if(!text)return;

  if(dataConnection && dataConnection.open){

    dataConnection.send({
      type:"chat",
      message:text
    });

    addMessage(text,true);

    input.value="";
  }
}

function addMessage(text,mine){

  const box=document.getElementById("messages");

  const div=document.createElement("div");

  div.className="msg"+(mine ? " mine":"");

  div.textContent=text;

  box.appendChild(div);

  box.scrollTop=box.scrollHeight;
}

function handleData(data){

  if(data.type==="chat"){

    addMessage(data.message,false);

  }

  if(data.type==="mirror"){

    remoteVideo.style.transform=
      data.value ? "scaleX(-1)" : "scaleX(1)";

  }

  if(data.type==="peer-ended"){

    endCall(false);

  }

}

</script>

</body>
</html>
