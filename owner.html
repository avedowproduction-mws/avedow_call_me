<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HomeKall Owner</title>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#090d14;
  color:#fff;
}
main{
  width:min(480px,100%);
  margin:auto;
  padding:18px;
}
header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}
.brand{
  font-size:23px;
  font-weight:700;
}
.state{
  font-size:12px;
  padding:8px 11px;
  border-radius:20px;
  background:#18202c;
}
.card{
  background:#111824;
  border:1px solid #202b3a;
  border-radius:24px;
  padding:20px;
}
.server{
  text-align:center;
}
.icon{
  font-size:55px;
  margin-bottom:10px;
}
.server h1{
  margin:0 0 8px;
}
.server p{
  color:#98a4b5;
  line-height:1.5;
}
.notify{
  width:100%;
  border:0;
  border-radius:14px;
  padding:14px;
  background:#202a38;
  color:#fff;
  margin-top:14px;
}
.incoming{
  display:none;
  margin-top:15px;
  background:#182538;
  border:1px solid #315b88;
  border-radius:20px;
  padding:18px;
  text-align:center;
}
.incoming h2{
  margin:0 0 8px;
}
.incoming p{
  color:#9eacbd;
}
.incomingButtons{
  display:flex;
  gap:8px;
}
.incomingButtons button{
  flex:1;
  border:0;
  border-radius:13px;
  padding:13px;
  color:#fff;
  font-weight:bold;
}
.accept{
  background:#18a957;
}
.reject{
  background:#d83242;
}
.call{
  display:none;
  margin-top:15px;
}
.videoBox{
  position:relative;
  background:#000;
  border-radius:20px;
  overflow:hidden;
  aspect-ratio:9/16;
}
.remote{
  width:100%;
  height:100%;
  object-fit:cover;
  transition:.25s;
}
.local{
  position:absolute;
  right:12px;
  bottom:12px;
  width:105px;
  height:145px;
  object-fit:cover;
  border:2px solid white;
  border-radius:14px;
  background:#111;
  transition:.25s;
}
.remoteInfo{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  display:none;
  background:#000c;
  border-radius:14px;
  padding:12px 16px;
  white-space:nowrap;
}
.controls{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:12px;
}
.ctrl{
  border:0;
  border-radius:13px;
  padding:13px 5px;
  background:#202a38;
  color:#fff;
  font-size:12px;
}
.ctrl.off{
  background:#8d2935;
}
.end{
  width:100%;
  border:0;
  border-radius:14px;
  padding:14px;
  margin-top:10px;
  background:#d83242;
  color:#fff;
  font-weight:bold;
}
.chat{
  margin-top:12px;
  background:#0c121b;
  border-radius:17px;
  padding:10px;
}
.messages{
  height:135px;
  overflow:auto;
  display:flex;
  flex-direction:column;
  gap:7px;
  margin-bottom:9px;
}
.msg{
  max-width:80%;
  padding:8px 10px;
  border-radius:12px;
  font-size:13px;
}
.mine{
  align-self:flex-end;
  background:#075e54;
}
.theirs{
  align-self:flex-start;
  background:#26303d;
}
.chatrow{
  display:flex;
  gap:6px;
}
.chatrow input{
  min-width:0;
  flex:1;
  border:0;
  outline:0;
  background:#202a38;
  color:#fff;
  padding:11px;
  border-radius:11px;
}
.chatrow button{
  width:44px;
  border:0;
  border-radius:11px;
  background:#202a38;
  color:#fff;
}
.send{
  background:#168aad!important;
}
.emojis{
  display:none;
  padding:8px 2px;
  font-size:22px;
  line-height:1.8;
}
.emojis span{
  cursor:pointer;
  margin-right:6px;
}
.footer{
  text-align:center;
  color:#596779;
  font-size:11px;
  margin-top:18px;
}
</style>
</head>

<body>

<main>

<header>
  <div class="brand">HomeKall</div>
  <div class="state" id="state">
    🟡 Memulai
  </div>
</header>


<section class="card server">

  <div class="icon">🏠</div>

  <h1>Owner</h1>

  <p id="serverInfo">
    Menyiapkan koneksi...
  </p>

  <button class="notify" id="notifyButton">
    🔔 Aktifkan Notifikasi & Dering
  </button>

</section>


<section class="incoming" id="incoming">

  <h2>📞 Panggilan Masuk</h2>

  <p>
    Ada seseorang yang ingin melakukan video call.
  </p>

  <div class="incomingButtons">

    <button class="accept" id="accept">
      ✅ Terima
    </button>

    <button class="reject" id="reject">
      ❌ Tolak
    </button>

  </div>

</section>


<section class="card call" id="callArea">

  <div class="videoBox">

    <video
      id="remoteVideo"
      class="remote"
      autoplay
      playsinline>
    </video>

    <video
      id="localVideo"
      class="local"
      autoplay
      muted
      playsinline>
    </video>

    <div
      id="remoteInfo"
      class="remoteInfo">
    </div>

  </div>


  <div class="controls">

    <button class="ctrl" id="micButton">
      🎙️ Mic ON
    </button>

    <button class="ctrl" id="cameraButton">
      📷 Kamera ON
    </button>

    <button class="ctrl" id="mirrorButton">
      🔄 Mirror
    </button>

  </div>


  <button class="end" id="endButton">
    🔴 Akhiri Panggilan
  </button>


  <div class="chat">

    <div id="messages" class="messages"></div>

    <div id="emojis" class="emojis">
      <span>😀</span>
      <span>😂</span>
      <span>😍</span>
      <span>🥰</span>
      <span>😎</span>
      <span>👍</span>
      <span>❤️</span>
      <span>🔥</span>
      <span>👏</span>
      <span>🙏</span>
    </div>

    <div class="chatrow">

      <button id="emojiButton">
        😊
      </button>

      <input
        id="messageInput"
        placeholder="Ketik pesan...">

      <button
        id="sendButton"
        class="send">
        ➤
      </button>

    </div>

  </div>

</section>


<div class="footer">
  HomeKall • Video Communication
</div>

</main>


<script>

const OWNER_ID =
  "homecall-owner-2026";

let peer;
let incomingCall = null;
let activeCall = null;
let connection = null;
let localStream = null;

let micOn = true;
let cameraOn = true;
let mirrorOn = false;

let ringtone = null;
let audioContext = null;


/* ELEMENT */

const state =
  document.getElementById("state");

const serverInfo =
  document.getElementById("serverInfo");

const incoming =
  document.getElementById("incoming");

const accept =
  document.getElementById("accept");

const reject =
  document.getElementById("reject");

const callArea =
  document.getElementById("callArea");

const remoteVideo =
  document.getElementById("remoteVideo");

const localVideo =
  document.getElementById("localVideo");

const remoteInfo =
  document.getElementById("remoteInfo");

const micButton =
  document.getElementById("micButton");

const cameraButton =
  document.getElementById("cameraButton");

const mirrorButton =
  document.getElementById("mirrorButton");

const endButton =
  document.getElementById("endButton");

const messages =
  document.getElementById("messages");

const messageInput =
  document.getElementById("messageInput");

const sendButton =
  document.getElementById("sendButton");

const emojiButton =
  document.getElementById("emojiButton");

const emojis =
  document.getElementById("emojis");

const notifyButton =
  document.getElementById("notifyButton");


function status(text,detail){

  state.textContent = text;
  serverInfo.textContent = detail;

}


/* START */

if(typeof Peer === "undefined"){

  status(
    "🔴 Error",
    "PeerJS gagal dimuat."
  );

}else{

  createOwner();

}


/* OWNER */

function createOwner(){

  status(
    "🟡 Menghubungkan",
    "Menghubungkan ke PeerJS Cloud..."
  );


  try{

    peer =
      new Peer(
        OWNER_ID
      );

  }catch(error){

    peerError(error);

    return;

  }


  peer.on("open",function(id){

    console.log(
      "OWNER ONLINE:",
      id
    );


    status(
      "🟢 Owner Online",
      "Owner siap menerima panggilan."
    );

  });


  peer.on("error",function(error){

    console.error(
      "PeerJS:",
      error
    );

    peerError(error);

  });


  peer.on("disconnected",function(){

    status(
      "🟠 Terputus",
      "Mencoba menyambung kembali..."
    );


    setTimeout(function(){

      if(
        peer &&
        peer.disconnected &&
        !peer.destroyed
      ){

        peer.reconnect();

      }

    },2000);

  });


  peer.on("call",function(call){

    if(
      incomingCall ||
      activeCall
    ){

      call.close();

      return;

    }


    incomingCall =
      call;


    incoming.style.display =
      "block";


    ring();

    notify();

  });


  peer.on("connection",function(conn){

    connection =
      conn;

    setupConnection(conn);

  });

}


function peerError(error){

  let message =
    error.message ||
    error.type ||
    "Koneksi gagal.";


  if(error.type === "unavailable-id"){

    message =
      "ID Owner sedang dipakai. Tutup Owner lain.";

  }

  else if(error.type === "network"){

    message =
      "Jaringan gagal menghubungi PeerJS.";

  }

  else if(error.type === "server-error"){

    message =
      "PeerJS Cloud tidak dapat dihubungi.";

  }

  else if(error.type === "browser-incompatible"){

    message =
      "Browser tidak mendukung WebRTC.";

  }


  status(
    "🔴 Gagal",
    message
  );

}


/* CONNECTION */

function setupConnection(conn){

  conn.on("open",function(){

    console.log(
      "Data connection terbuka"
    );

  });


  conn.on("data",function(data){

    if(!data || !data.type){
      return;
    }


    if(data.type === "chat"){

      addMessage(
        data.text,
        false
      );

    }


    if(data.type === "mic"){

      showRemote(
        data.enabled
        ? "🎙️ Mikrofon menyala"
        : "🔇 Mikrofon dimatikan"
      );

    }


    if(data.type === "camera"){

      showRemote(
        data.enabled
        ? "📷 Kamera menyala"
        : "📷 Kamera dimatikan"
      );

    }


    if(data.type === "mirror"){

      remoteVideo.style.transform =
        data.enabled
        ? "scaleX(-1)"
        : "scaleX(1)";

    }


    if(data.type === "end"){

      finish(false);

    }

  });

}


/* ACCEPT */

accept.onclick =
async function(){

  if(!incomingCall){
    return;
  }


  stopRing();


  try{

    localStream =
      await navigator.mediaDevices
      .getUserMedia({
        video:true,
        audio:true
      });


    localVideo.srcObject =
      localStream;


    incomingCall.answer(
      localStream
    );


    activeCall =
      incomingCall;

    incomingCall = null;


    incoming.style.display =
      "none";

    callArea.style.display =
      "block";


    activeCall.on(
      "stream",
      function(stream){

        remoteVideo.srcObject =
          stream;

        remoteVideo.play()
          .catch(function(){});


        status(
          "🟢 Panggilan Aktif",
          "Video call sedang berlangsung."
        );

      }
    );


    activeCall.on(
      "close",
      function(){

        finish(false);

      }
    );


    activeCall.on(
      "error",
      function(error){

        console.error(
          error
        );

        finish(false);

      }
    );


    updateButtons();

  }catch(error){

    console.error(error);

    alert(
      "Kamera atau mikrofon tidak bisa digunakan."
    );

    incomingCall = null;

    incoming.style.display =
      "none";

  }

};


/* REJECT */

reject.onclick =
function(){

  stopRing();


  if(incomingCall){

    incomingCall.close();

  }


  incomingCall = null;

  incoming.style.display =
    "none";

};


/* CONTROLS */

micButton.onclick =
function(){

  if(!localStream)return;

  const track =
    localStream.getAudioTracks()[0];

  if(!track)return;

  micOn =
    !micOn;

  track.enabled =
    micOn;

  send({
    type:"mic",
    enabled:micOn
  });

  updateButtons();

};


cameraButton.onclick =
function(){

  if(!localStream)return;

  const track =
    localStream.getVideoTracks()[0];

  if(!track)return;

  cameraOn =
    !cameraOn;

  track.enabled =
    cameraOn;

  send({
    type:"camera",
    enabled:cameraOn
  });

  updateButtons();

};


mirrorButton.onclick =
function(){

  mirrorOn =
    !mirrorOn;

  localVideo.style.transform =
    mirrorOn
    ? "scaleX(-1)"
    : "scaleX(1)";

  send({
    type:"mirror",
    enabled:mirrorOn
  });

  updateButtons();

};


function updateButtons(){

  micButton.textContent =
    micOn
    ? "🎙️ Mic ON"
    : "🔇 Mic OFF";

  cameraButton.textContent =
    cameraOn
    ? "📷 Kamera ON"
    : "🚫 Kamera OFF";

  mirrorButton.textContent =
    mirrorOn
    ? "🔄 Mirror ON"
    : "🔄 Mirror";


  micButton.classList.toggle(
    "off",
    !micOn
  );

  cameraButton.classList.toggle(
    "off",
    !cameraOn
  );

  mirrorButton.classList.toggle(
    "off",
    mirrorOn
  );

}


/* SEND */

function send(data){

  if(
    connection &&
    connection.open
  ){

    connection.send(data);

  }

}


/* REMOTE STATUS */

let remoteTimer;

function showRemote(text){

  remoteInfo.textContent =
    text;

  remoteInfo.style.display =
    "block";

  clearTimeout(remoteTimer);

  remoteTimer =
    setTimeout(function(){

      remoteInfo.style.display =
        "none";

    },2200);

}


/* CHAT */

sendButton.onclick =
sendMessage;


messageInput.onkeydown =
function(e){

  if(e.key === "Enter"){

    sendMessage();

  }

};


function sendMessage(){

  const text =
    messageInput.value.trim();

  if(!text)return;

  addMessage(
    text,
    true
  );

  send({
    type:"chat",
    text:text
  });

  messageInput.value = "";

}


function addMessage(text,mine){

  const el =
    document.createElement("div");

  el.className =
    "msg " +
    (mine ? "mine" : "theirs");

  el.textContent =
    text;

  messages.appendChild(el);

  messages.scrollTop =
    messages.scrollHeight;

}


/* EMOJI */

emojiButton.onclick =
function(){

  emojis.style.display =
    emojis.style.display === "block"
    ? "none"
    : "block";

};


document
.querySelectorAll("#emojis span")
.forEach(function(el){

  el.onclick =
  function(){

    messageInput.value +=
      el.textContent;

    messageInput.focus();

  };

});


/* NOTIFICATION */

notifyButton.onclick =
async function(){

  try{

    if(
      "Notification" in window
    ){

      const permission =
        await Notification
        .requestPermission();


      if(permission === "granted"){

        notifyButton.textContent =
          "✅ Notifikasi Aktif";

      }else{

        notifyButton.textContent =
          "⚠️ Notifikasi Ditolak";

      }

    }


    unlockAudio();

  }catch(error){

    console.error(error);

  }

};


function notify(){

  if(
    "Notification" in window &&
    Notification.permission === "granted"
  ){

    new Notification(
      "📞 HomeKall",
      {
        body:
          "Ada panggilan video masuk."
      }
    );

  }

}


/* AUDIO */

function unlockAudio(){

  const AudioClass =
    window.AudioContext ||
    window.webkitAudioContext;

  if(!AudioClass)return;

  audioContext =
    audioContext ||
    new AudioClass();

  if(
    audioContext.state === "suspended"
  ){

    audioContext.resume();

  }

}


function beep(){

  try{

    unlockAudio();

    if(!audioContext)return;

    const oscillator =
      audioContext.createOscillator();

    const gain =
      audioContext.createGain();

    oscillator.frequency.value =
      880;

    gain.gain.value =
      .12;

    oscillator.connect(gain);

    gain.connect(
      audioContext.destination
    );

    oscillator.start();

    oscillator.stop(
      audioContext.currentTime+.18
    );

  }catch(e){

    console.error(e);

  }

}


function ring(){

  stopRing();

  beep();

  ringtone =
    setInterval(
      beep,
      1200
    );

}


function stopRing(){

  if(ringtone){

    clearInterval(
      ringtone
    );

    ringtone = null;

  }

}


/* END */

endButton.onclick =
function(){

  finish(true);

};


function finish(sendEnd){

  stopRing();


  if(
    sendEnd &&
    connection &&
    connection.open
  ){

    connection.send({
      type:"end"
    });

  }


  if(activeCall){

    try{
      activeCall.close();
    }catch(e){}

  }


  if(localStream){

    localStream
    .getTracks()
    .forEach(function(track){
      track.stop();
    });

  }


  activeCall = null;
  incomingCall = null;
  localStream = null;

  remoteVideo.srcObject = null;
  localVideo.srcObject = null;

  callArea.style.display =
    "none";

  incoming.style.display =
    "none";


  micOn = true;
  cameraOn = true;
  mirrorOn = false;


  localVideo.style.transform =
    "scaleX(1)";

  remoteVideo.style.transform =
    "scaleX(1)";


  updateButtons();


  status(
    "🟢 Owner Online",
    "Owner siap menerima panggilan."
  );

}


updateButtons();

</script>

</body>
  </html>
