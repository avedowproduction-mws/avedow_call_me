<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>HOMEKALL OWNER</title>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #080b12;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  text-align: center;
  padding: 22px;
}

h1 {
  margin: 0;
}

.status {
  margin-top: 8px;
  color: #8b93a7;
}

#incoming {
  display: none;
  max-width: 450px;
  margin: 20px auto;
  padding: 25px;
  background: #151c2b;
  border-radius: 18px;
  text-align: center;
}

button {
  border: 0;
  border-radius: 12px;
  padding: 13px 18px;
  margin: 5px;
  font-weight: bold;
  font-size: 14px;
}

.accept {
  background: #16a34a;
  color: white;
}

.reject,
.danger {
  background: #dc2626;
  color: white;
}

#callArea {
  display: none;
  max-width: 700px;
  margin: auto;
  padding: 15px;
}

.videoBox {
  position: relative;
}

#remoteVideo {
  width: 100%;
  min-height: 300px;
  background: black;
  border-radius: 18px;
  object-fit: cover;
}

#localVideo {
  position: absolute;
  right: 12px;
  bottom: 12px;
  width: 120px;
  height: 165px;
  object-fit: cover;
  background: #111;
  border: 2px solid white;
  border-radius: 12px;
}

.controls {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-top: 15px;
}

.controls button {
  margin: 0;
  background: #182131;
  color: white;
}

.chat {
  margin-top: 15px;
  padding: 12px;
  background: #111722;
  border-radius: 15px;
}

#messages {
  height: 140px;
  overflow-y: auto;
}

.message {
  background: #202938;
  padding: 8px;
  margin: 5px 0;
  border-radius: 10px;
  font-size: 14px;
}

.message.me {
  background: #2563eb;
  text-align: right;
}

.chatInput {
  display: flex;
  gap: 8px;
  margin-top: 10px;
}

.chatInput input {
  flex: 1;
  padding: 12px;
  border: 0;
  border-radius: 10px;
  outline: none;
}

.chatInput button {
  background: #2563eb;
  color: white;
}

#message {
  text-align: center;
  color: #8b93a7;
  margin: 15px;
}

</style>

</head>

<body>

<header>

<h1>🏠 HOMEKALL OWNER</h1>

<div class="status" id="status">
🟡 Menghubungkan...
</div>

</header>


<div id="incoming">

<h2>📞 Panggilan Masuk</h2>

<p>Ada seseorang yang sedang menelepon.</p>

<button
class="accept"
id="acceptBtn">
✅ Terima
</button>

<button
class="reject"
id="rejectBtn">
❌ Tolak
</button>

</div>


<div id="message"></div>


<div id="callArea">

<div class="videoBox">

<video
id="remoteVideo"
autoplay
playsinline>
</video>

<video
id="localVideo"
autoplay
muted
playsinline>
</video>

</div>


<div class="controls">

<button onclick="switchCamera()">
🔄 Kamera
</button>

<button onclick="toggleMirror()">
↔️ Balik Layar
</button>

<button onclick="toggleMic()" id="micBtn">
🎙️ Mic ON
</button>

<button onclick="toggleCamera()" id="videoBtn">
📹 Kamera ON
</button>

<button onclick="sendMessage()">
💬 Kirim
</button>

<button
class="danger"
onclick="endCall()">
🔴 Akhiri
</button>

</div>


<div class="chat">

<div id="messages"></div>

<div class="chatInput">

<input
id="messageInput"
type="text"
placeholder="Ketik pesan..."
onkeydown="if(event.key==='Enter') sendMessage()">

<button onclick="sendMessage()">
Kirim
</button>

</div>

</div>

</div>


<script>

const OWNER_ID =
"homecall-owner-2026";

let peer;
let incomingCall = null;
let currentCall = null;

let dataConnection = null;

let localStream = null;
let currentVideoTrack = null;

let usingFrontCamera = true;
let mirrored = false;
let micEnabled = true;
let cameraEnabled = true;


const status =
document.getElementById("status");

const incoming =
document.getElementById("incoming");

const callArea =
document.getElementById("callArea");

const message =
document.getElementById("message");

const acceptBtn =
document.getElementById("acceptBtn");

const rejectBtn =
document.getElementById("rejectBtn");

const remoteVideo =
document.getElementById("remoteVideo");

const localVideo =
document.getElementById("localVideo");


/* =========================
   PEER OWNER
========================= */

peer = new Peer(
  OWNER_ID,
  {
    debug: 2,

    config: {
      iceServers: [
        {
          urls:
          "stun:stun.l.google.com:19302"
        }
      ]
    }
  }
);


peer.on("open", function(id) {

  console.log(
    "Owner online:",
    id
  );

  status.textContent =
    "🟢 Owner online — menunggu panggilan";

});


/* =========================
   PANGGILAN MASUK
========================= */

peer.on("call", function(call) {

  incomingCall = call;

  incoming.style.display =
    "block";

  status.textContent =
    "📞 Ada panggilan masuk";

});


/* =========================
   DATA CHAT MASUK
========================= */

peer.on("connection", function(conn) {

  dataConnection = conn;

  conn.on("open", function() {

    console.log(
      "Chat terhubung"
    );

  });


  conn.on("data", function(data) {

    if (
      data &&
      data.type === "message"
    ) {

      addMessage(
        "Penelpon",
        data.text,
        false
      );

    }

  });

});


/* =========================
   TERIMA PANGGILAN
========================= */

acceptBtn.onclick =
async function() {

  if (!incomingCall)
    return;


  try {

    message.textContent =
      "Meminta izin kamera dan mikrofon...";


    localStream =
      await navigator.mediaDevices
      .getUserMedia({

        video: true,
        audio: true

      });


    currentCall =
      incomingCall;


    currentVideoTrack =
      localStream.getVideoTracks()[0];


    localVideo.srcObject =
      localStream;


    await localVideo
      .play()
      .catch(() => {});


    currentCall.answer(
      localStream
    );


    incoming.style.display =
      "none";

    callArea.style.display =
      "block";

    status.textContent =
      "🟢 Terhubung";

    message.textContent =
      "Menunggu video penelpon...";


    currentCall.on(
      "stream",
      function(remoteStream) {

        remoteVideo.srcObject =
          remoteStream;

        remoteVideo.play()
          .catch(() => {});

        message.textContent =
          "🟢 Video terhubung";

      }
    );


    currentCall.on(
      "close",
      function() {

        endCall(false);

      }
    );


    currentCall.on(
      "error",
      function(error) {

        console.log(error);

        message.textContent =
          "❌ Koneksi video gagal";

      }
    );

  }

  catch(error) {

    console.log(error);

    message.textContent =
      "❌ Kamera/mikrofon tidak bisa digunakan: " +
      error.message;

  }

};


/* =========================
   TOLAK
========================= */

rejectBtn.onclick =
function() {

  if (incomingCall) {

    incomingCall.close();

  }

  incomingCall = null;

  incoming.style.display =
    "none";

  status.textContent =
    "🟢 Owner online — menunggu panggilan";

};


/* =========================
   GANTI KAMERA
========================= */

async function switchCamera() {

  if (!currentCall) {

    alert(
      "Panggilan belum dimulai."
    );

    return;
  }


  try {

    usingFrontCamera =
      !usingFrontCamera;


    const facing =
      usingFrontCamera
      ? "user"
      : "environment";


    const newStream =
      await navigator.mediaDevices
      .getUserMedia({

        video: {
          facingMode: {
            ideal: facing
          }
        },

        audio: false

      });


    const newTrack =
      newStream.getVideoTracks()[0];


    const sender =
      currentCall.peerConnection
      .getSenders()
      .find(function(s) {

        return s.track &&
               s.track.kind === "video";

      });


    if (sender) {

      await sender.replaceTrack(
        newTrack
      );

    }


    if (currentVideoTrack) {

      currentVideoTrack.stop();

    }


    const oldTrack =
      localStream.getVideoTracks()[0];


    if (oldTrack) {

      localStream.removeTrack(
        oldTrack
      );

    }


    localStream.addTrack(
      newTrack
    );


    currentVideoTrack =
      newTrack;


    localVideo.srcObject =
      localStream;


  }

  catch(error) {

    usingFrontCamera =
      !usingFrontCamera;

    alert(
      "Tidak bisa mengganti kamera.\n\n" +
      error.message
    );

  }

}


/* =========================
   BALIK LAYAR
========================= */

function toggleMirror() {

  mirrored =
    !mirrored;


  localVideo.style.transform =
    mirrored
    ? "scaleX(-1)"
    : "scaleX(1)";

}


/* =========================
   MUTE
========================= */

function toggleMic() {

  if (!localStream)
    return;


  const tracks =
    localStream.getAudioTracks();


  if (tracks.length === 0) {

    alert(
      "Mikrofon tidak ditemukan."
    );

    return;
  }


  micEnabled =
    !micEnabled;


  tracks.forEach(
    function(track) {

      track.enabled =
        micEnabled;

    }
  );


  document.getElementById(
    "micBtn"
  ).textContent =
    micEnabled
    ? "🎙️ Mic ON"
    : "🔇 Mic OFF";

}


/* =========================
   KAMERA ON/OFF
========================= */

function toggleCamera() {

  if (!localStream)
    return;


  const tracks =
    localStream.getVideoTracks();


  if (tracks.length === 0) {

    alert(
      "Kamera tidak ditemukan."
    );

    return;
  }


  cameraEnabled =
    !cameraEnabled;


  tracks.forEach(
    function(track) {

      track.enabled =
        cameraEnabled;

    }
  );


  document.getElementById(
    "videoBtn"
  ).textContent =
    cameraEnabled
    ? "📹 Kamera ON"
    : "🚫 Kamera OFF";

}


/* =========================
   CHAT
========================= */

function sendMessage() {

  const input =
    document.getElementById(
      "messageInput"
    );


  const text =
    input.value.trim();


  if (!text)
    return;


  if (
    dataConnection &&
    dataConnection.open
  ) {

    dataConnection.send({

      type: "message",
      text: text

    });


    addMessage(
      "Saya",
      text,
      true
    );


    input.value = "";

  }

  else {

    alert(
      "Chat belum terhubung."
    );

  }

}


function addMessage(
  name,
  text,
  me
) {

  const box =
    document.getElementById(
      "messages"
    );


  const div =
    document.createElement(
      "div"
    );


  div.className =
    "message" +
    (me ? " me" : "");


  div.textContent =
    name + ": " + text;


  box.appendChild(div);


  box.scrollTop =
    box.scrollHeight;

}


/* =========================
   AKHIRI
========================= */

function endCall(
  closePeerCall = true
) {

  if (
    closePeerCall &&
    currentCall
  ) {

    try {

      currentCall.close();

    } catch(e) {}

  }


  if (localStream) {

    localStream
      .getTracks()
      .forEach(
        function(track) {

          track.stop();

        }
      );

    localStream = null;

  }


  if (dataConnection) {

    try {

      dataConnection.close();

    } catch(e) {}

    dataConnection = null;

  }


  currentCall = null;
  incomingCall = null;
  currentVideoTrack = null;


  remoteVideo.srcObject =
    null;

  localVideo.srcObject =
    null;


  callArea.style.display =
    "none";

  incoming.style.display =
    "none";


  status.textContent =
    "🟢 Owner online — menunggu panggilan";

  message.textContent =
    "";


  micEnabled = true;
  cameraEnabled = true;
  mirrored = false;
  usingFrontCamera = true;


  localVideo.style.transform =
    "scaleX(1)";

}

</script>

</body>
</html>
