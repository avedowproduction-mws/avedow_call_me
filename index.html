<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HOMEKALL</title>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #080b12;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  padding: 16px;
  text-align: center;
  font-size: 22px;
  font-weight: bold;
  background: #111827;
}

.status {
  text-align: center;
  padding: 10px;
  color: #aaa;
}

.container {
  max-width: 900px;
  margin: auto;
  padding: 12px;
}

.videos {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.videoBox {
  position: relative;
  background: #111827;
  border-radius: 16px;
  overflow: hidden;
  min-height: 230px;
}

video {
  width: 100%;
  height: 100%;
  min-height: 230px;
  object-fit: cover;
  background: black;
  display: block;
}

.label {
  position: absolute;
  top: 10px;
  left: 10px;
  background: #000b;
  padding: 6px 10px;
  border-radius: 20px;
  font-size: 12px;
}

.controls {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 9px;
  margin-top: 12px;
}

button {
  border: none;
  border-radius: 12px;
  padding: 13px;
  font-size: 15px;
  font-weight: bold;
  background: #263244;
  color: white;
}

button.active {
  background: #2563eb;
}

button.danger {
  background: #b91c1c;
}

.chat {
  margin-top: 12px;
  background: #111827;
  padding: 12px;
  border-radius: 16px;
}

.messages {
  height: 150px;
  overflow-y: auto;
  background: #080b12;
  padding: 10px;
  border-radius: 12px;
  margin-bottom: 9px;
}

.message {
  padding: 8px 10px;
  background: #1f2937;
  border-radius: 10px;
  margin: 6px 0;
  word-break: break-word;
}

.message.me {
  background: #1d4ed8;
}

.chatRow {
  display: flex;
  gap: 8px;
}

input {
  flex: 1;
  min-width: 0;
  padding: 12px;
  border: none;
  border-radius: 10px;
  font-size: 15px;
}

.start {
  display: block;
  margin: 10px auto;
  background: #16a34a;
}

@media (max-width: 600px) {
  .videos {
    grid-template-columns: 1fr;
  }

  .videoBox,
  video {
    min-height: 210px;
  }
}
</style>
</head>

<body>

<header>🏠 HOMEKALL</header>

<div id="status" class="status">
  🟡 Memulai...
</div>

<div class="container">

  <div class="videos">

    <div class="videoBox">
      <video id="localVideo" autoplay muted playsinline></video>
      <div class="label">Penelpon</div>
    </div>

    <div class="videoBox">
      <video id="remoteVideo" autoplay playsinline></video>
      <div class="label">Pemilik</div>
    </div>

  </div>

  <div class="controls">

    <button id="mirrorBtn">
      ↔️ Balik Layar
    </button>

    <button id="micBtn">
      🎙️ Matikan Mikrofon
    </button>

    <button id="camBtn">
      📹 Matikan Kamera
    </button>

    <button id="endBtn" class="danger">
      🔴 Akhiri Panggilan
    </button>

  </div>

  <div class="chat">

    <div id="messages" class="messages"></div>

    <div class="chatRow">

      <input
        id="messageInput"
        maxlength="500"
        placeholder="Ketik pesan..."
      >

      <button id="sendBtn">
        💬 Kirim
      </button>

    </div>

  </div>

</div>

<script>

const OWNER_ID = "homecall-owner-2026";

const peer = new Peer(undefined, {
  host: "0.peerjs.com",
  port: 443,
  secure: true,
  path: "/"
});

let localStream = null;
let currentCall = null;
let dataConnection = null;

let mirrorState = false;
let microphoneOn = true;
let cameraOn = true;

const localVideo = document.getElementById("localVideo");
const remoteVideo = document.getElementById("remoteVideo");

const statusText = document.getElementById("status");

const mirrorBtn = document.getElementById("mirrorBtn");
const micBtn = document.getElementById("micBtn");
const camBtn = document.getElementById("camBtn");
const endBtn = document.getElementById("endBtn");

const messageInput = document.getElementById("messageInput");
const sendBtn = document.getElementById("sendBtn");
const messages = document.getElementById("messages");


function setStatus(text) {
  statusText.textContent = text;
}


function addMessage(text, mine) {

  const div = document.createElement("div");

  div.className = "message";

  if (mine) {
    div.classList.add("me");
  }

  div.textContent =
    (mine ? "Saya: " : "Pemilik: ") + text;

  messages.appendChild(div);

  messages.scrollTop = messages.scrollHeight;
}


function sendData(data) {

  if (
    dataConnection &&
    dataConnection.open
  ) {
    dataConnection.send(data);
  }

}


function updateButtons() {

  mirrorBtn.textContent =
    mirrorState
      ? "↔️ Balik Layar: ON"
      : "↔️ Balik Layar";

  micBtn.textContent =
    microphoneOn
      ? "🎙️ Matikan Mikrofon"
      : "🎙️ Nyalakan Mikrofon";

  camBtn.textContent =
    cameraOn
      ? "📹 Matikan Kamera"
      : "📹 Nyalakan Kamera";

  micBtn.classList.toggle(
    "active",
    !microphoneOn
  );

  camBtn.classList.toggle(
    "active",
    !cameraOn
  );
}


function applyLocalMirror() {

  localVideo.style.transform =
    mirrorState
      ? "scaleX(-1)"
      : "scaleX(1)";

}


function applyRemoteMirror(value) {

  remoteVideo.style.transform =
    value
      ? "scaleX(-1)"
      : "scaleX(1)";

}


async function getMedia() {

  localStream =
    await navigator.mediaDevices.getUserMedia({
      video: true,
      audio: true
    });

  localVideo.srcObject = localStream;

  updateButtons();
}


function changeSender(kind, enabled) {

  if (
    !currentCall ||
    !currentCall.peerConnection
  ) {
    return;
  }

  const senders =
    currentCall.peerConnection.getSenders();

  senders.forEach(sender => {

    if (
      sender.track &&
      sender.track.kind === kind
    ) {
      sender.track.enabled = enabled;
    }

  });

}


function receiveData(data) {

  if (!data || !data.type) {
    return;
  }


  if (data.type === "chat") {

    addMessage(
      String(data.text),
      false
    );

  }


  if (data.type === "mirror") {

    applyRemoteMirror(
      !!data.value
    );

  }


  if (data.type === "state") {

    applyRemoteMirror(
      !!data.mirror
    );

  }


  if (data.type === "peer-ended") {

    endCall(false);

  }

}


function setupDataConnection(connection) {

  dataConnection = connection;

  connection.on("open", () => {

    sendData({
      type: "state",
      mirror: mirrorState,
      mic: microphoneOn,
      cam: cameraOn
    });

  });

  connection.on("data", receiveData);

  connection.on("close", () => {

    if (dataConnection === connection) {
      dataConnection = null;
    }

  });

}


peer.on("open", async () => {

  try {

    await getMedia();

    setStatus(
      "🟢 Siap. Tekan Mulai Video Call."
    );

  } catch (error) {

    console.error(error);

    setStatus(
      "🔴 Kamera/mikrofon tidak mendapat izin."
    );

  }

});


peer.on("connection", connection => {

  setupDataConnection(connection);

});


peer.on("error", error => {

  console.error(error);

  setStatus(
    "🔴 Error koneksi: " + error.type
  );

});


async function startCall() {

  if (!localStream) {

    try {
      await getMedia();
    } catch (error) {
      return;
    }

  }

  if (currentCall) {
    return;
  }


  dataConnection =
    peer.connect(
      OWNER_ID,
      {
        reliable: true
      }
    );


  setupDataConnection(
    dataConnection
  );


  currentCall =
    peer.call(
      OWNER_ID,
      localStream
    );


  currentCall.on(
    "stream",
    remoteStream => {

      remoteVideo.srcObject =
        remoteStream;

      setStatus(
        "🟢 Terhubung dengan pemilik."
      );

    }
  );


  currentCall.on(
    "close",
    () => {

      currentCall = null;

      remoteVideo.srcObject = null;

      setStatus(
        "⚪ Panggilan berakhir."
      );

    }
  );


  currentCall.on(
    "error",
    error => {

      console.error(error);

      setStatus(
        "🔴 Panggilan gagal."
      );

    }
  );

}


mirrorBtn.onclick = () => {

  mirrorState = !mirrorState;

  applyLocalMirror();

  updateButtons();

  sendData({
    type: "mirror",
    value: mirrorState
  });

};


micBtn.onclick = () => {

  microphoneOn = !microphoneOn;

  if (localStream) {

    localStream
      .getAudioTracks()
      .forEach(track => {

        track.enabled =
          microphoneOn;

      });

  }


  changeSender(
    "audio",
    microphoneOn
  );


  updateButtons();


  sendData({
    type: "mic",
    value: microphoneOn
  });

};


camBtn.onclick = () => {

  cameraOn = !cameraOn;

  if (localStream) {

    localStream
      .getVideoTracks()
      .forEach(track => {

        track.enabled =
          cameraOn;

      });

  }


  changeSender(
    "video",
    cameraOn
  );


  updateButtons();


  sendData({
    type: "cam",
    value: cameraOn
  });

};


function endCall(notify = true) {

  if (notify) {

    sendData({
      type: "peer-ended"
    });

  }


  try {

    if (currentCall) {
      currentCall.close();
    }

  } catch (error) {}


  currentCall = null;

  remoteVideo.srcObject = null;

  setStatus(
    "⚪ Panggilan diakhiri."
  );

}


endBtn.onclick = () => {

  endCall(true);

};


function sendMessage() {

  const text =
    messageInput.value.trim();

  if (!text) {
    return;
  }


  addMessage(
    text,
    true
  );


  sendData({
    type: "chat",
    text: text
  });


  messageInput.value = "";

}


sendBtn.onclick = sendMessage;


messageInput.addEventListener(
  "keydown",
  event => {

    if (event.key === "Enter") {
      sendMessage();
    }

  }
);


document
  .querySelector(".container")
  .insertAdjacentHTML(
    "afterbegin",
    '<button id="startBtn" class="start">📞 Mulai Video Call</button>'
  );


document
  .getElementById("startBtn")
  .onclick = startCall;


updateButtons();

</script>

</body>
  </html>
