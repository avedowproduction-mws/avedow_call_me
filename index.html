<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Home Call</title>

  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #080b12;
      color: white;
      font-family: Arial, sans-serif;
    }

    .app {
      width: 100%;
      max-width: 500px;
      min-height: 100vh;
      margin: auto;
      padding: 25px 20px;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 25px;
      font-weight: bold;
    }

    .status {
      color: #22c55e;
      font-size: 13px;
    }

    .welcome {
      margin-top: 70px;
    }

    .welcome small {
      color: #8b93a7;
      font-size: 15px;
    }

    .welcome h1 {
      margin-top: 10px;
      font-size: 38px;
      line-height: 1.1;
    }

    .welcome p {
      margin-top: 15px;
      color: #8b93a7;
      line-height: 1.6;
    }

    .call-card {
      margin-top: 45px;
      padding: 25px;
      background: #111722;
      border: 1px solid #202938;
      border-radius: 25px;
    }

    .icon {
      height: 180px;
      background: #080b12;
      border-radius: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 65px;
      margin-bottom: 22px;
    }

    .call-card h2 {
      font-size: 21px;
    }

    .call-card p {
      color: #7f899d;
      margin-top: 8px;
      font-size: 14px;
      line-height: 1.5;
    }

    .call-button {
      width: 100%;
      padding: 17px;
      margin-top: 22px;
      border: none;
      border-radius: 15px;
      background: #2563eb;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .call-button:active {
      transform: scale(0.97);
    }

    .features {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 20px;
    }

    .feature {
      padding: 15px 8px;
      text-align: center;
      background: #111722;
      border: 1px solid #202938;
      border-radius: 16px;
    }

    .feature span {
      font-size: 23px;
    }

    .feature p {
      margin-top: 7px;
      font-size: 11px;
      color: #8b93a7;
    }

    #callArea {
      display: none;
    }

    .video-container {
      position: relative;
      width: 100%;
    }

    #remoteVideo {
      width: 100%;
      height: 330px;
      object-fit: cover;
      background: #000;
      border-radius: 15px;
      margin-top: 10px;
    }

    #localVideo {
      position: absolute;
      width: 105px;
      height: 140px;
      object-fit: cover;
      right: 12px;
      bottom: 12px;
      background: #000;
      border: 2px solid white;
      border-radius: 12px;
      z-index: 2;
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 15px;
    }

    .control-button {
      padding: 13px 5px;
      border: none;
      border-radius: 13px;
      background: #202938;
      color: white;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
    }

    .control-button:active {
      transform: scale(0.96);
    }

    .mic-off {
      background: #7f1d1d;
    }

    .end-button {
      width: 100%;
      padding: 16px;
      margin-top: 10px;
      border: none;
      border-radius: 15px;
      background: #dc2626;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .footer {
      margin-top: 35px;
      text-align: center;
      color: #596275;
      font-size: 12px;
    }
  </style>
</head>

<body>

<div class="app">

  <div class="top">

    <div class="logo">
      Home Call
    </div>

    <div class="status" id="status">
      🟢 Online
    </div>

  </div>

  <div id="home">

    <section class="welcome">

      <small>
        Selamat datang 👋
      </small>

      <h1>
        Hubungi<br>
        saya sekarang.
      </h1>

      <p>
        Tekan tombol di bawah untuk
        memulai panggilan video.
      </p>

    </section>

    <section class="call-card">

      <div class="icon">
        📹
      </div>

      <h2>
        Video Call
      </h2>

      <p>
        Hubungkan kamera dan mikrofon
        untuk melakukan panggilan video.
      </p>

      <button
        class="call-button"
        onclick="startCall()">

        📞 Mulai Video Call

      </button>

    </section>

    <section class="features">

      <div class="feature">
        <span>🎥</span>
        <p>Video</p>
      </div>

      <div class="feature">
        <span>🎙️</span>
        <p>Audio</p>
      </div>

      <div class="feature">
        <span>🔒</span>
        <p>Aman</p>
      </div>

    </section>

  </div>

  <div class="call-card" id="callArea">

    <h2>
      🎥 Video Call
    </h2>

    <div class="video-container">

      <video
        id="remoteVideo"
        autoplay
        playsinline>
      </video>

      <video
        id="localVideo"
        autoplay
        muted
        playsinline>
      </video>

    </div>

    <div class="controls">

      <button
        class="control-button"
        id="micButton"
        onclick="toggleMicrophone()">

        🎙️ Mikrofon

      </button>

      <button
        class="control-button"
        id="cameraButton"
        onclick="toggleCamera()">

        📹 Kamera

      </button>

      <button
        class="control-button"
        onclick="toggleMirror()">

        ↔️ Balik Layar

      </button>

    </div>

    <button
      class="end-button"
      onclick="endCall()">

      🔴 Akhiri Panggilan

    </button>

  </div>

  <div class="footer">
    Home Call • Video Communication
  </div>

</div>

<script>

  let peer;
  let currentCall = null;
  let localStream = null;

  // Track asli kamera dan mikrofon
  let audioTrack = null;
  let videoTrack = null;

  // Sender mikrofon WebRTC
  let audioSender = null;

  // Status
  let microphoneOn = true;
  let cameraOn = true;
  let mirrored = false;

  // Membuat ID penelpon otomatis
  peer = new Peer({

    debug: 3,

    config: {

      iceServers: [
        {
          urls: "stun:stun.l.google.com:19302"
        }
      ]

    }

  });

  peer.on("open", function(id) {

    document.getElementById("status").textContent =
      "🟢 Online";

  });

  peer.on("error", function(error) {

    console.log(error);

    document.getElementById("status").textContent =
      "🔴 Koneksi bermasalah";

    alert(
      "Koneksi gagal: " + error.type
    );

  });

  async function startCall() {

    try {

      // Meminta kamera + mikrofon
      localStream =
        await navigator.mediaDevices.getUserMedia({

          video: true,
          audio: true

        });

      // Simpan track kamera
      videoTrack =
        localStream.getVideoTracks()[0];

      // Simpan track mikrofon
      audioTrack =
        localStream.getAudioTracks()[0];

      // Tampilkan kamera sendiri
      document.getElementById("localVideo").srcObject =
        localStream;

      /*
        ID PEMILIK
        Harus sama dengan owner.html
      */

      currentCall =
        peer.call(
          "homecall-owner-2026",
          localStream
        );

      document.getElementById("home").style.display =
        "none";

      document.getElementById("callArea").style.display =
        "block";

      document.getElementById("status").textContent =
        "📞 Memanggil...";

      /*
        Ambil sender mikrofon dari koneksi WebRTC.

        Kita simpan sender-nya supaya ketika
        mikrofon dimatikan, kita bisa benar-benar
        melepas track audio dari pengiriman.
      */

      setTimeout(function() {

        if (
          currentCall &&
          currentCall.peerConnection
        ) {

          audioSender =
            currentCall.peerConnection
              .getSenders()
              .find(function(sender) {

                return sender.track &&
                       sender.track.kind === "audio";

              });

        }

      }, 500);

      currentCall.on("stream", function(remoteStream) {

        document.getElementById("remoteVideo").srcObject =
          remoteStream;

        document.getElementById("status").textContent =
          "🟢 Terhubung";

      });

      currentCall.on("close", function() {

        endCall();

      });

      currentCall.on("error", function(error) {

        console.log(error);

        alert("Panggilan gagal.");

        endCall();

      });

    } catch (error) {

      console.log(error);

      alert(
        "Kamera atau mikrofon tidak bisa digunakan.\n\n" +
        error.message
      );

    }

  }

  /*
    MIKROFON NYATA

    ON:
    Track mikrofon dikirim kembali.

    OFF:
    Track mikrofon dilepas dari WebRTC
    menggunakan replaceTrack(null).

    Jadi bukan cuma mengganti gambar tombol.
  */

  async function toggleMicrophone() {

    if (!audioTrack || !currentCall) {
      return;
    }

    try {

      if (microphoneOn) {

        // MATIKAN mikrofon
        audioTrack.enabled = false;

        if (audioSender) {

          await audioSender.replaceTrack(null);

        }

        microphoneOn = false;

        document.getElementById("micButton").textContent =
          "🔇 Mikrofon";

        document.getElementById("micButton")
          .classList.add("mic-off");

      } else {

        // NYALAKAN mikrofon
        audioTrack.enabled = true;

        if (audioSender) {

          await audioSender.replaceTrack(audioTrack);

        }

        microphoneOn = true;

        document.getElementById("micButton").textContent =
          "🎙️ Mikrofon";

        document.getElementById("micButton")
          .classList.remove("mic-off");

      }

    } catch (error) {

      console.log(
        "Gagal mengubah mikrofon:",
        error
      );

      alert(
        "Mikrofon tidak dapat diubah."
      );

    }

  }

  /*
    MATIKAN / NYALAKAN KAMERA
  */

  function toggleCamera() {

    if (!videoTrack) {
      return;
    }

    cameraOn = !cameraOn;

    videoTrack.enabled = cameraOn;

    document.getElementById("cameraButton").textContent =
      cameraOn
        ? "📹 Kamera"
        : "🚫 Kamera";

  }

  /*
    BALIK LAYAR
  */

  function toggleMirror() {

    mirrored = !mirrored;

    document.getElementById("localVideo").style.transform =
      mirrored
        ? "scaleX(-1)"
        : "scaleX(1)";

    document.getElementById("remoteVideo").style.transform =
      mirrored
        ? "scaleX(-1)"
        : "scaleX(1)";

  }

  /*
    AKHIRI PANGGILAN
  */

  function endCall() {

    if (currentCall) {

      currentCall.close();

      currentCall = null;

    }

    if (localStream) {

      localStream
        .getTracks()
        .forEach(function(track) {

          track.stop();

        });

      localStream = null;

    }

    audioTrack = null;
    videoTrack = null;
    audioSender = null;

    document.getElementById("localVideo").srcObject =
      null;

    document.getElementById("remoteVideo").srcObject =
      null;

    document.getElementById("callArea").style.display =
      "none";

    document.getElementById("home").style.display =
      "block";

    document.getElementById("status").textContent =
      "🟢 Online";

    microphoneOn = true;
    cameraOn = true;
    mirrored = false;

    document.getElementById("micButton").textContent =
      "🎙️ Mikrofon";

    document.getElementById("micButton")
      .classList.remove("mic-off");

    document.getElementById("cameraButton").textContent =
      "📹 Kamera";

    document.getElementById("localVideo").style.transform =
      "scaleX(1)";

    document.getElementById("remoteVideo").style.transform =
      "scaleX(1)";

  }

</script>

</body>
</html>
