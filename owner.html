<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Home Call - Owner</title>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0b0f19;
    color: white;
    text-align: center;
}

header {
    padding: 25px 15px 15px;
}

h1 {
    margin: 0;
    font-size: 28px;
}

.status {
    margin-top: 10px;
    color: #8b9bb4;
    line-height: 1.5;
}

#enableAlertsBtn {
    margin-top: 15px;
    background: #2563eb;
    color: white;
    border: 0;
    border-radius: 12px;
    padding: 13px 18px;
    font-size: 15px;
    font-weight: bold;
}

#enableAlertsBtn.active {
    background: #19c37d;
}

#incoming {
    display: none;
    margin: 20px auto;
    padding: 20px;
    max-width: 400px;
    background: #151c2b;
    border-radius: 18px;
    border: 1px solid #26324a;
}

.incoming-icon {
    font-size: 48px;
    animation: ringIcon 1s infinite;
}

@keyframes ringIcon {
    0% { transform: rotate(0deg); }
    10% { transform: rotate(-12deg); }
    20% { transform: rotate(12deg); }
    30% { transform: rotate(-12deg); }
    40% { transform: rotate(12deg); }
    50% { transform: rotate(0deg); }
    100% { transform: rotate(0deg); }
}

button {
    border: 0;
    border-radius: 12px;
    padding: 14px 22px;
    margin: 7px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.accept {
    background: #19c37d;
    color: white;
}

.reject,
.end {
    background: #e5484d;
    color: white;
}

#callArea {
    display: none;
    padding: 10px;
}

.videoBox {
    position: relative;
    width: 100%;
    max-width: 700px;
    margin: auto;
}

#remoteVideo {
    width: 100%;
    min-height: 250px;
    background: black;
    border-radius: 18px;
    object-fit: cover;
}

#localVideo {
    position: absolute;
    right: 15px;
    bottom: 15px;
    width: 140px;
    height: 190px;
    background: #111;
    border: 2px solid white;
    border-radius: 12px;
    object-fit: cover;
}

#message {
    margin: 15px;
    color: #8b9bb4;
    min-height: 20px;
}
</style>
</head>

<body>

<header>

    <h1>🏠 Home Call</h1>

    <div class="status" id="status">
        Menghubungkan ke server...
    </div>

    <button id="enableAlertsBtn">
        🔔 Aktifkan Notifikasi & Dering
    </button>

</header>

<div id="incoming">

    <div class="incoming-icon">
        📞
    </div>

    <h2>📞 Panggilan Masuk</h2>

    <p>Seseorang sedang menelepon.</p>

    <button class="accept" id="acceptBtn">
        ✅ Terima Panggilan
    </button>

    <button class="reject" id="rejectBtn">
        ❌ Tolak
    </button>

</div>

<div id="message"></div>

<div id="callArea">

    <div class="videoBox">

        <video
            id="remoteVideo"
            autoplay
            playsinline>
        </video>

        <video
            id="localVideo"
            autoplay
            muted
            playsinline>
        </video>

    </div>

    <button class="end" id="endBtn">
        🔴 Akhiri Panggilan
    </button>

</div>

<script>

/* ==========================================
   KONFIGURASI
========================================== */

const OWNER_ID = "homecall-owner-2026";

const PEER_CONFIG = {

    host: "0.peerjs.com",

    port: 443,

    path: "/",

    secure: true,

    debug: 2,

    config: {

        iceServers: [

            {
                urls: "stun:stun.l.google.com:19302"
            }

        ]

    }

};


/* ==========================================
   VARIABEL
========================================== */

let peer = null;

let incomingCall = null;

let localStream = null;

let callNotification = null;

let audioContext = null;

let ringtoneTimer = null;

let audioUnlocked = false;

let peerReady = false;


/* ==========================================
   ELEMENT
========================================== */

const status =
    document.getElementById("status");

const incoming =
    document.getElementById("incoming");

const callArea =
    document.getElementById("callArea");

const acceptBtn =
    document.getElementById("acceptBtn");

const rejectBtn =
    document.getElementById("rejectBtn");

const endBtn =
    document.getElementById("endBtn");

const remoteVideo =
    document.getElementById("remoteVideo");

const localVideo =
    document.getElementById("localVideo");

const message =
    document.getElementById("message");

const enableAlertsBtn =
    document.getElementById("enableAlertsBtn");


/* ==========================================
   BUAT PEER
========================================== */

function createPeer() {

    peerReady = false;

    status.innerText =
        "🔄 Menghubungkan ke server Home Call...";

    console.log(
        "Membuat Peer:",
        OWNER_ID
    );

    peer = new Peer(
        OWNER_ID,
        PEER_CONFIG
    );


    /* ======================================
       PEER BERHASIL TERHUBUNG
    ====================================== */

    peer.on(
        "open",
        function(id) {

            peerReady = true;

            console.log(
                "✅ PeerJS connected:",
                id
            );

            status.innerText =
                "🟢 Owner online — siap menerima panggilan";

            message.innerText =
                "";

        }
    );


    /* ======================================
       PANGGILAN MASUK
    ====================================== */

    peer.on(
        "call",
        function(call) {

            console.log(
                "📞 Panggilan masuk:",
                call.peer
            );

            incomingCall = call;

            incoming.style.display =
                "block";

            status.innerText =
                "📞 Ada panggilan masuk";

            message.innerText =
                "🔔 Seseorang sedang menelepon.";

            startRingtone();

            showCallNotification();


            call.on(
                "close",
                function() {

                    stopRingtone();

                    closeCallNotification();

                    if (
                        incomingCall === call
                    ) {

                        incomingCall = null;

                    }

                    if (
                        callArea.style.display !==
                        "block"
                    ) {

                        incoming.style.display =
                            "none";

                        status.innerText =
                            "🟢 Owner online — siap menerima panggilan";

                    }

                }
            );

        }
    );


    /* ======================================
       ERROR
    ====================================== */

    peer.on(
        "error",
        function(error) {

            console.error(
                "❌ PEER ERROR:",
                error
            );

            peerReady = false;

            stopRingtone();

            closeCallNotification();


            let errorText =
                "❌ Gagal terhubung.";


            if (
                error.type ===
                "unavailable-id"
            ) {

                errorText =
                    "⚠️ ID Owner sedang dipakai. Tutup halaman Owner lain.";

            }

            else if (
                error.type ===
                "network"
            ) {

                errorText =
                    "❌ Jaringan/PeerJS Server bermasalah.";

            }

            else if (
                error.type ===
                "server-error"
            ) {

                errorText =
                    "❌ PeerJS Server tidak dapat dihubungi.";

            }

            else if (
                error.type ===
                "socket-error"
            ) {

                errorText =
                    "❌ Koneksi server terputus.";

            }

            else if (
                error.type ===
                "peer-unavailable"
            ) {

                errorText =
                    "❌ Owner belum tersedia.";

            }

            else {

                errorText =
                    "❌ PeerJS: " +
                    error.type;

            }


            status.innerText =
                errorText;

            message.innerText =
                "Silakan tunggu sebentar lalu coba lagi.";

        }
    );


    /* ======================================
       DISCONNECT
    ====================================== */

    peer.on(
        "disconnected",
        function() {

            console.log(
                "⚠️ Peer disconnected"
            );

            peerReady = false;

            status.innerText =
                "🟠 Server terputus — mencoba menyambung...";


            setTimeout(
                function() {

                    if (
                        peer &&
                        peer.disconnected &&
                        !peer.destroyed
                    ) {

                        peer.reconnect();

                    }

                },
                2000
            );

        }
    );


    /* ======================================
       CLOSE
    ====================================== */

    peer.on(
        "close",
        function() {

            peerReady = false;

            status.innerText =
                "🔴 Koneksi Owner ditutup.";

        }
    );

}


/* ==========================================
   AKTIFKAN NOTIFIKASI + AUDIO
========================================== */

enableAlertsBtn.onclick =
    async function() {

        try {

            if (!audioContext) {

                audioContext =
                    new (
                        window.AudioContext ||
                        window.webkitAudioContext
                    )();

            }

            if (
                audioContext.state ===
                "suspended"
            ) {

                await audioContext.resume();

            }

            audioUnlocked = true;

        }
        catch(error) {

            console.error(
                error
            );

        }


        if (
            "Notification" in window
        ) {

            try {

                await Notification.requestPermission();

            }
            catch(error) {

                console.error(
                    error
                );

            }

        }


        if (
            audioUnlocked &&
            "Notification" in window &&
            Notification.permission ===
            "granted"
        ) {

            enableAlertsBtn.innerText =
                "✅ Notifikasi & Dering Aktif";

            enableAlertsBtn.classList.add(
                "active"
            );

            message.innerText =
                "🔔 Notifikasi dan dering aktif.";

        }

        else if (
            audioUnlocked
        ) {

            enableAlertsBtn.innerText =
                "🔊 Dering Aktif";

            message.innerText =
                "🔊 Dering aktif. Izin notifikasi belum diberikan.";

        }

    };


/* ==========================================
   SUARA
========================================== */

function playTone(
    frequency,
    duration
) {

    if (
        !audioContext ||
        !audioUnlocked
    ) {
        return;
    }

    try {

        const oscillator =
            audioContext.createOscillator();

        const gain =
            audioContext.createGain();


        oscillator.type =
            "sine";

        oscillator.frequency.value =
            frequency;


        gain.gain.setValueAtTime(
            0.0001,
            audioContext.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            0.25,
            audioContext.currentTime + 0.03
        );

        gain.gain.exponentialRampToValueAtTime(
            0.0001,
            audioContext.currentTime + duration
        );


        oscillator.connect(gain);

        gain.connect(
            audioContext.destination
        );


        oscillator.start();

        oscillator.stop(
            audioContext.currentTime +
            duration
        );

    }
    catch(error) {

        console.error(
            "Audio:",
            error
        );

    }

}


/* ==========================================
   MULAI DERING
========================================== */

function startRingtone() {

    stopRingtone();

    if (!audioUnlocked) {

        console.log(
            "Audio belum dibuka oleh user."
        );

        return;

    }


    function ring() {

        playTone(
            880,
            0.35
        );

        setTimeout(
            function() {

                playTone(
                    660,
                    0.35
                );

            },
            400
        );

    }


    ring();

    ringtoneTimer =
        setInterval(
            ring,
            1800
        );

}


/* ==========================================
   STOP DERING
========================================== */

function stopRingtone() {

    if (ringtoneTimer) {

        clearInterval(
            ringtoneTimer
        );

        ringtoneTimer = null;

    }

}


/* ==========================================
   NOTIFIKASI
========================================== */

function showCallNotification() {

    if (
        !("Notification" in window)
    ) {
        return;
    }

    if (
        Notification.permission !==
        "granted"
    ) {
        return;
    }


    try {

        callNotification =
            new Notification(
                "📞 Home Call",
                {
                    body:
                        "Ada panggilan masuk. Tekan untuk membuka Home Call.",

                    tag:
                        "homecall-incoming",

                    renotify:
                        true,

                    requireInteraction:
                        true,

                    silent:
                        false
                }
            );


        callNotification.onclick =
            function() {

                window.focus();

                closeCallNotification();

            };

    }
    catch(error) {

        console.error(
            error
        );

    }

}


/* ==========================================
   TUTUP NOTIFIKASI
========================================== */

function closeCallNotification() {

    if (callNotification) {

        try {

            callNotification.close();

        }
        catch(error) {}

        callNotification =
            null;

    }

}


/* ==========================================
   TERIMA PANGGILAN
========================================== */

acceptBtn.onclick =
    async function() {

        if (!incomingCall) {
            return;
        }


        stopRingtone();

        closeCallNotification();


        try {

            message.innerText =
                "Meminta izin kamera dan mikrofon...";


            localStream =
                await navigator.mediaDevices
                    .getUserMedia(
                        {
                            video: true,
                            audio: true
                        }
                    );


            localVideo.srcObject =
                localStream;


            await localVideo
                .play()
                .catch(
                    function() {}
                );


            incomingCall.answer(
                localStream
            );


            incoming.style.display =
                "none";

            callArea.style.display =
                "block";

            status.innerText =
                "🟢 Terhubung";

            message.innerText =
                "Menunggu video dari penelpon...";


            incomingCall.on(
                "stream",
                function(remoteStream) {

                    remoteVideo.srcObject =
                        remoteStream;

                    remoteVideo
                        .play()
                        .catch(
                            function() {}
                        );

                    message.innerText =
                        "🟢 Video terhubung";

                }
            );


            incomingCall.on(
                "close",
                function() {

                    endCall();

                }
            );


            incomingCall.on(
                "error",
                function(error) {

                    console.error(
                        error
                    );

                    message.innerText =
                        "❌ Koneksi video gagal: " +
                        error.type;

                }
            );

        }
        catch(error) {

            console.error(
                error
            );

            message.innerText =
                "❌ Kamera/mikrofon gagal: " +
                error.message;

        }

    };


/* ==========================================
   TOLAK
========================================== */

rejectBtn.onclick =
    function() {

        stopRingtone();

        closeCallNotification();


        if (incomingCall) {

            incomingCall.close();

        }


        incomingCall = null;

        incoming.style.display =
            "none";

        status.innerText =
            "🟢 Owner online — siap menerima panggilan";

        message.innerText =
            "";

    };


/* ==========================================
   AKHIRI
========================================== */

endBtn.onclick =
    function() {

        if (incomingCall) {

            incomingCall.close();

        }

        endCall();

    };


/* ==========================================
   END CALL
========================================== */

function endCall() {

    stopRingtone();

    closeCallNotification();


    if (localStream) {

        localStream
            .getTracks()
            .forEach(
                function(track) {

                    track.stop();

                }
            );

        localStream = null;

    }


    remoteVideo.srcObject =
        null;

    localVideo.srcObject =
        null;


    callArea.style.display =
        "none";

    incoming.style.display =
        "none";


    incomingCall =
        null;


    status.innerText =
        "🟢 Owner online — siap menerima panggilan";

    message.innerText =
        "";

}


/* ==========================================
   MULAI
========================================== */

createPeer();

</script>

</body>
</html>
