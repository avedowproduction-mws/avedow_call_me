<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HomeKall</title>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#090d14;
  color:#fff;
}
main{
  width:min(480px,100%);
  margin:auto;
  padding:18px;
}
header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}
.brand{
  font-size:23px;
  font-weight:700;
}
.state{
  font-size:12px;
  padding:8px 11px;
  border-radius:20px;
  background:#18202c;
}
.card{
  background:#111824;
  border:1px solid #202b3a;
  border-radius:24px;
  padding:20px;
}
.hero{
  text-align:center;
  padding:20px 5px 25px;
}
.hero-icon{
  font-size:55px;
  margin-bottom:12px;
}
.hero h1{
  margin:0 0 8px;
  font-size:26px;
}
.hero p{
  color:#98a4b5;
  line-height:1.5;
  margin:0;
}
.primary{
  width:100%;
  border:0;
  border-radius:15px;
  padding:16px;
  background:#1976d2;
  color:#fff;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}
.primary:disabled{
  opacity:.45;
}
#connectionInfo{
  text-align:center;
  color:#9ba7b8;
  font-size:13px;
  margin:13px 0 0;
}
.call{
  display:none;
}
.videoBox{
  position:relative;
  background:#000;
  border-radius:20px;
  overflow:hidden;
  aspect-ratio:9/16;
}
.remote{
  width:100%;
  height:100%;
  object-fit:cover;
  transition:.25s;
}
.local{
  position:absolute;
  right:12px;
  bottom:12px;
  width:105px;
  height:145px;
  object-fit:cover;
  border:2px solid #fff;
  border-radius:14px;
  background:#111;
  transition:.25s;
}
.remoteInfo{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  display:none;
  background:#000c;
  border-radius:14px;
  padding:12px 16px;
  z-index:3;
  white-space:nowrap;
}
.buttons{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:12px;
}
.btn{
  border:0;
  border-radius:13px;
  padding:13px 5px;
  background:#202a38;
  color:#fff;
  cursor:pointer;
  font-size:12px;
}
.btn.off{
  background:#8d2935;
}
.end{
  width:100%;
  border:0;
  border-radius:14px;
  padding:14px;
  margin-top:10px;
  background:#d93445;
  color:#fff;
  font-weight:bold;
}
.chat{
  margin-top:12px;
  background:#0c121b;
  border-radius:17px;
  padding:10px;
}
.messages{
  height:135px;
  overflow:auto;
  display:flex;
  flex-direction:column;
  gap:7px;
  margin-bottom:9px;
}
.msg{
  max-width:80%;
  padding:8px 10px;
  border-radius:12px;
  font-size:13px;
}
.mine{
  align-self:flex-end;
  background:#075e54;
}
.theirs{
  align-self:flex-start;
  background:#26303d;
}
.chatrow{
  display:flex;
  gap:6px;
}
.chatrow input{
  min-width:0;
  flex:1;
  border:0;
  outline:0;
  background:#202a38;
  color:#fff;
  padding:11px;
  border-radius:11px;
}
.chatrow button{
  width:44px;
  border:0;
  border-radius:11px;
  background:#202a38;
  color:#fff;
}
.send{
  background:#168aad!important;
}
.emojis{
  display:none;
  padding:8px 2px;
  font-size:22px;
  line-height:1.8;
}
.emojis span{
  cursor:pointer;
  margin-right:6px;
}
.note{
  text-align:center;
  color:#596779;
  font-size:11px;
  margin-top:18px;
}
</style>
</head>

<body>

<main>

<header>
  <div class="brand">HomeKall</div>
  <div class="state" id="state">🟡 Offline</div>
</header>

<section class="card" id="homeCard">

  <div class="hero">
    <div class="hero-icon">📹</div>
    <h1>Video Call</h1>
    <p>
      Hubungi pemilik rumah secara langsung
      menggunakan kamera dan mikrofon.
    </p>
  </div>

  <button class="primary" id="callButton" disabled>
    📞 Mulai Panggilan
  </button>

  <div id="connectionInfo">
    Menyiapkan koneksi...
  </div>

</section>


<section class="card call" id="callArea">

  <div class="videoBox">

    <video
      id="remoteVideo"
      class="remote"
      autoplay
      playsinline>
    </video>

    <video
      id="localVideo"
      class="local"
      autoplay
      muted
      playsinline>
    </video>

    <div
      id="remoteInfo"
      class="remoteInfo">
    </div>

  </div>


  <div class="buttons">

    <button class="btn" id="micButton">
      🎙️ Mic ON
    </button>

    <button class="btn" id="cameraButton">
      📷 Kamera ON
    </button>

    <button class="btn" id="mirrorButton">
      🔄 Mirror
    </button>

  </div>


  <button class="end" id="endButton">
    🔴 Akhiri Panggilan
  </button>


  <div class="chat">

    <div id="messages" class="messages"></div>

    <div id="emojis" class="emojis">
      <span>😀</span>
      <span>😂</span>
      <span>😍</span>
      <span>🥰</span>
      <span>😎</span>
      <span>👍</span>
      <span>❤️</span>
      <span>🔥</span>
      <span>👏</span>
      <span>🙏</span>
    </div>

    <div class="chatrow">

      <button id="emojiButton">😊</button>

      <input
        id="messageInput"
        placeholder="Ketik pesan...">

      <button class="send" id="sendButton">
        ➤
      </button>

    </div>

  </div>

</section>

<div class="note">
  HomeKall • Secure Video Communication
</div>

</main>


<script>

const OWNER_ID = "homecall-owner-2026";

let peer;
let call;
let connection;
let localStream;

let micOn = true;
let cameraOn = true;
let mirrorOn = false;

const state =
  document.getElementById("state");

const info =
  document.getElementById("connectionInfo");

const callButton =
  document.getElementById("callButton");

const homeCard =
  document.getElementById("homeCard");

const callArea =
  document.getElementById("callArea");

const remoteVideo =
  document.getElementById("remoteVideo");

const localVideo =
  document.getElementById("localVideo");

const remoteInfo =
  document.getElementById("remoteInfo");

const micButton =
  document.getElementById("micButton");

const cameraButton =
  document.getElementById("cameraButton");

const mirrorButton =
  document.getElementById("mirrorButton");

const endButton =
  document.getElementById("endButton");

const messages =
  document.getElementById("messages");

const messageInput =
  document.getElementById("messageInput");

const sendButton =
  document.getElementById("sendButton");

const emojiButton =
  document.getElementById("emojiButton");

const emojis =
  document.getElementById("emojis");


function setStatus(text,detail){

  state.textContent = text;
  info.textContent = detail;

}


/* PEERJS */

if(typeof Peer === "undefined"){

  setStatus(
    "🔴 Error",
    "PeerJS gagal dimuat."
  );

}else{

  startPeer();

}


function startPeer(){

  setStatus(
    "🟡 Online...",
    "Menghubungkan ke PeerJS Cloud..."
  );

  try{

    peer = new Peer();

  }catch(error){

    showPeerError(error);

    return;

  }


  peer.on("open",function(id){

    console.log("Caller ID:",id);

    setStatus(
      "🟢 Siap",
      "Server terhubung. Siap melakukan panggilan."
    );

    callButton.disabled = false;

  });


  peer.on("error",function(error){

    console.error(error);

    showPeerError(error);

  });


  peer.on("disconnected",function(){

    setStatus(
      "🟠 Terputus",
      "Mencoba menyambung kembali..."
    );

    callButton.disabled = true;

    setTimeout(function(){

      if(
        peer &&
        peer.disconnected &&
        !peer.destroyed
      ){

        peer.reconnect();

      }

    },2000);

  });

}


function showPeerError(error){

  let message =
    error.message ||
    error.type ||
    "Koneksi gagal.";

  if(error.type === "network"){
    message =
      "Jaringan tidak dapat terhubung ke PeerJS.";
  }

  if(error.type === "server-error"){
    message =
      "PeerJS Cloud tidak dapat dihubungi.";
  }

  if(error.type === "browser-incompatible"){
    message =
      "Browser tidak mendukung WebRTC.";
  }

  setStatus(
    "🔴 Gagal",
    message
  );

  callButton.disabled = true;

}


/* MEDIA */

async function getMedia(){

  if(localStream){
    return localStream;
  }

  localStream =
    await navigator.mediaDevices
    .getUserMedia({
      video:true,
      audio:true
    });

  localVideo.srcObject =
    localStream;

  return localStream;

}


/* CALL */

callButton.onclick =
async function(){

  callButton.disabled = true;

  try{

    const stream =
      await getMedia();


    /* Data channel */

    connection =
      peer.connect(
        OWNER_ID,
        {
          reliable:true
        }
      );

    setupConnection(connection);


    /* Video call */

    call =
      peer.call(
        OWNER_ID,
        stream
      );


    setupCall(call);


  }catch(error){

    console.error(error);

    alert(
      "Kamera atau mikrofon tidak bisa digunakan."
    );

    callButton.disabled = false;

  }

};


function setupConnection(conn){

  conn.on("open",function(){

    console.log(
      "Data connection aktif"
    );

  });


  conn.on("data",function(data){

    if(!data || !data.type){
      return;
    }


    if(data.type === "chat"){

      addMessage(
        data.text,
        false
      );

    }


    if(data.type === "mic"){

      showRemote(
        data.enabled
        ? "🎙️ Mikrofon menyala"
        : "🔇 Mikrofon dimatikan"
      );

    }


    if(data.type === "camera"){

      showRemote(
        data.enabled
        ? "📷 Kamera menyala"
        : "📷 Kamera dimatikan"
      );

    }


    if(data.type === "mirror"){

      remoteVideo.style.transform =
        data.enabled
        ? "scaleX(-1)"
        : "scaleX(1)";

    }


    if(data.type === "end"){

      finish(false);

    }

  });


  conn.on("error",function(error){

    console.error(
      "Data error",
      error
    );

  });

}


function setupCall(mediaCall){

  call = mediaCall;


  call.on("stream",function(stream){

    remoteVideo.srcObject =
      stream;

    homeCard.style.display =
      "none";

    callArea.style.display =
      "block";

    setStatus(
      "🟢 Terhubung",
      "Panggilan sedang berlangsung."
    );

  });


  call.on("close",function(){

    finish(false);

  });


  call.on("error",function(error){

    console.error(
      "Call error",
      error
    );

    finish(false);

  });

}


/* CONTROLS */

micButton.onclick =
function(){

  if(!localStream)return;

  const track =
    localStream.getAudioTracks()[0];

  if(!track)return;

  micOn = !micOn;

  track.enabled = micOn;

  send({
    type:"mic",
    enabled:micOn
  });

  updateButtons();

};


cameraButton.onclick =
function(){

  if(!localStream)return;

  const track =
    localStream.getVideoTracks()[0];

  if(!track)return;

  cameraOn = !cameraOn;

  track.enabled = cameraOn;

  send({
    type:"camera",
    enabled:cameraOn
  });

  updateButtons();

};


mirrorButton.onclick =
function(){

  mirrorOn = !mirrorOn;

  localVideo.style.transform =
    mirrorOn
    ? "scaleX(-1)"
    : "scaleX(1)";

  send({
    type:"mirror",
    enabled:mirrorOn
  });

  updateButtons();

};


function updateButtons(){

  micButton.textContent =
    micOn
    ? "🎙️ Mic ON"
    : "🔇 Mic OFF";

  cameraButton.textContent =
    cameraOn
    ? "📷 Kamera ON"
    : "🚫 Kamera OFF";

  mirrorButton.textContent =
    mirrorOn
    ? "🔄 Mirror ON"
    : "🔄 Mirror";


  micButton.classList.toggle(
    "off",
    !micOn
  );

  cameraButton.classList.toggle(
    "off",
    !cameraOn
  );

  mirrorButton.classList.toggle(
    "off",
    mirrorOn
  );

}


function send(data){

  if(
    connection &&
    connection.open
  ){

    connection.send(data);

  }

}


/* REMOTE STATUS */

let remoteTimer;

function showRemote(text){

  remoteInfo.textContent =
    text;

  remoteInfo.style.display =
    "block";

  clearTimeout(remoteTimer);

  remoteTimer =
    setTimeout(function(){

      remoteInfo.style.display =
        "none";

    },2200);

}


/* CHAT */

sendButton.onclick =
sendMessage;


messageInput.onkeydown =
function(e){

  if(e.key === "Enter"){

    sendMessage();

  }

};


function sendMessage(){

  const text =
    messageInput.value.trim();

  if(!text)return;

  addMessage(
    text,
    true
  );

  send({
    type:"chat",
    text:text
  });

  messageInput.value = "";

}


function addMessage(text,mine){

  const el =
    document.createElement("div");

  el.className =
    "msg " +
    (mine ? "mine" : "theirs");

  el.textContent =
    text;

  messages.appendChild(el);

  messages.scrollTop =
    messages.scrollHeight;

}


emojiButton.onclick =
function(){

  emojis.style.display =
    emojis.style.display === "block"
    ? "none"
    : "block";

};


document
.querySelectorAll("#emojis span")
.forEach(function(el){

  el.onclick =
  function(){

    messageInput.value +=
      el.textContent;

    messageInput.focus();

  };

});


/* END */

endButton.onclick =
function(){

  finish(true);

};


function finish(sendEnd){

  if(
    sendEnd &&
    connection &&
    connection.open
  ){

    connection.send({
      type:"end"
    });

  }


  if(call){

    try{
      call.close();
    }catch(e){}

  }


  if(localStream){

    localStream
    .getTracks()
    .forEach(function(track){
      track.stop();
    });

  }


  call = null;
  connection = null;
  localStream = null;

  remoteVideo.srcObject = null;
  localVideo.srcObject = null;

  callArea.style.display =
    "none";

  homeCard.style.display =
    "block";

  setStatus(
    "🟢 Siap",
    "Server terhubung. Siap melakukan panggilan."
  );

  callButton.disabled = false;

  micOn = true;
  cameraOn = true;
  mirrorOn = false;

  updateButtons();

}


updateButtons();

</script>

</body>
</html>
